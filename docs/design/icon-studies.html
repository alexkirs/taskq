<style>
#tq-icons-v2{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#252930,#eceff2);--green:light-dark(#237862,#77cdb3);--red:light-dark(#ae384c,#ef8996);--ask:light-dark(#a35c29,#edb993);--muted:light-dark(#626b77,#b4bdc8)}#tq-icons-v2 *{box-sizing:border-box}#tq-icons-v2 .study{padding:16px 8px;min-height:370px}#tq-icons-v2 h3{font-size:18px;font-weight:500;margin:0 0 5px}#tq-icons-v2 .meta{font-size:12px;color:var(--muted)}#tq-icons-v2 .comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}#tq-icons-v2 .sample{display:flex;align-items:center;justify-content:center;height:100px}#tq-icons-v2 .sample>.q,#tq-icons-v2 .sample>.wide{transform:scale(3)}#tq-icons-v2 .label{text-align:center;font-size:12px;color:var(--muted)}#tq-icons-v2 .bar{display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 12px;height:22px;border-radius:5px;margin:8px 0;background:#252930;color:#eceff2;--green:#77cdb3;--red:#ef8996;--ask:#edb993;--muted:#b4bdc8}#tq-icons-v2 .bar.light{background:#eff1f4;color:#252930;--green:#237862;--red:#ae384c;--ask:#a35c29;--muted:#626b77}#tq-icons-v2 .caption{margin-right:auto;font-size:12px}#tq-icons-v2 .q{width:18px;height:18px;border:1.8px solid currentColor;border-radius:1.8px;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}#tq-icons-v2 .q:after{content:'';position:absolute;width:1.8px;height:4.5px;right:-1.8px;bottom:-3.6px;background:currentColor}#tq-icons-v2 .mode{display:block;width:6px;height:6px;color:var(--green);flex-shrink:0}#tq-icons-v2 .mode.run{border-left:6px solid currentColor;border-top:3px solid transparent;border-bottom:3px solid transparent}#tq-icons-v2 .mode.paused{border-left:2px solid currentColor;border-right:2px solid currentColor;color:var(--muted)}#tq-icons-v2 .q .mode{width:9px;height:9px}#tq-icons-v2 .q .mode.run{border-left-width:8.1px;border-top-width:4.5px;border-bottom-width:4.5px;transform:translateX(.9px)}#tq-icons-v2 .q .mode.paused{border-left-width:2.7px;border-right-width:2.7px}#tq-icons-v2 .wide{position:relative;height:19px;display:grid;grid-template-columns:6px auto;grid-template-rows:12px 7px;gap:0 1px;align-items:center;flex-shrink:0}#tq-icons-v2 canvas{display:block;grid-column:1/3;height:12px}#tq-icons-v2 .graph{display:flex;align-items:flex-end;height:7px;gap:1px}#tq-icons-v2 .bin{width:3px;height:7px;display:flex;flex-direction:column;justify-content:flex-end}#tq-icons-v2 .bin i{display:block;width:3px;background:var(--green)}#tq-icons-v2 .bin i.failed{background:var(--red)}#tq-icons-v2 .wide.ribbon{display:flex;flex-direction:column;gap:0;align-items:stretch}#tq-icons-v2 .ribbon>.mode{position:absolute;left:0;top:6px}#tq-icons-v2 .controls{display:flex;align-items:center;gap:12px;margin-top:16px}#tq-icons-v2 button{font:inherit;color:inherit;background:light-dark(#edf0f3,#30353c);border:1px solid light-dark(#cbd0d8,#515964);border-radius:5px;padding:6px 10px}#tq-icons-v2 [hidden]{display:none!important}@media(pointer:coarse){#tq-icons-v2 button{min-height:44px}}
#tq-icons-v2{--halo:light-dark(#ffffff,#202126)}#tq-icons-v2 .bar{--halo:#252930}#tq-icons-v2 .bar.light{--halo:#eff1f4}#tq-icons-v2 .ribbon>.mode{left:0;top:auto;bottom:1px;z-index:1;width:9px;height:9px;border:0;color:var(--green);filter:drop-shadow(1px 0 0 var(--halo)) drop-shadow(-1px 0 0 var(--halo)) drop-shadow(0 1px 0 var(--halo)) drop-shadow(0 -1px 0 var(--halo))}#tq-icons-v2 .ribbon>.mode.run:before{content:"";display:block;width:9px;height:9px;background:currentColor;clip-path:polygon(0 0,100% 50%,0 100%)}#tq-icons-v2 .ribbon>.mode.paused{color:var(--muted);background:linear-gradient(to right,currentColor 0 33%,transparent 33% 67%,currentColor 67% 100%)}
#tq-icons-v2 .wide.is-paused{filter:grayscale(1)}#tq-icons-v2 .pause-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;z-index:2}#tq-icons-v2 .pause-overlay .q{background:var(--halo);box-shadow:0 0 0 1px var(--halo)}
</style>
<div id="tq-icons-v2"><div class="viz-dotted-background" aria-label="Single ribbon">
<section data-variant="Single ribbon"><div class="study" data-kind="ribbon"><h3>Single ribbon · 47 px</h3><div class="meta">Running: counts and history · paused: gray summary with centered q and Ⅱ</div><p class="meta">Windows supports only the compact q; summary and the M1 appearance chooser are hidden. CSS pixels represent macOS logical points in this study.</p><div class="content"></div></div></section>
</div></div>
<script>
(()=>{
const series=[[2,1],[2,0],[3,3],[1,0],[0,2],[4,1],[1,1],[0,0],[3,0]];
function heights(done,failed,peak,height=7){return [done*height/peak,failed*height/peak];}
const events=series.flatMap(([done,failed],i)=>[...Array.from({length:done},()=>({at:i===0?0:i===8?71:i*8+4,type:'done'})),...Array.from({length:failed},()=>({at:i===0?0:i===8?71:i*8+4,type:'failed'}))]);
function aggregate(n){const result=Array.from({length:n},()=>[0,0]);for(const e of events)result[Math.min(n-1,Math.floor(e.at/72*n))][e.type==='done'?0:1]++;return result;}
globalThis.taskqIconStudy={heights,series,aggregate};if(typeof document==='undefined')return;
const root=document.getElementById('tq-icons-v2');let paused=false;
const mode=()=>'<span class="mode '+(paused?'paused':'run')+'"></span>';
function small(){return '<span class="q" role="img" aria-label="taskq: '+(paused?'admission paused':'admission enabled')+'">'+mode()+'</span>';}
function wide(kind){const n=kind==='tight'?9:kind==='compact'?8:12,width=kind==='tight'?42:kind==='compact'?38:47,bins=aggregate(n),peak=Math.max(...bins.map(v=>v[0]+v[1]));const graph='<span class="graph">'+bins.map(([g,r])=>{const [gh,rh]=heights(g,r,peak);return '<span class="bin"><i class="failed" style="height:'+rh+'px"></i><i style="height:'+gh+'px"></i></span>';}).join('')+'</span>';return '<span class="wide '+kind+(paused?' is-paused':'')+'" style="width:'+width+'px" role="img" aria-label="In work 3, waiting for answer 2, ready 5; '+(paused?'admission paused':'admission enabled')+'; history on a shared scale"><canvas data-width="'+width+'" data-ribbon="'+(kind==='ribbon')+'" width="'+width*3+'" height="36" style="width:'+width+'px"></canvas>'+(paused?'<span class="pause-overlay" aria-hidden="true">'+small()+'</span>':'')+graph+'</span>';}
function render(){root.querySelectorAll('.study').forEach(panel=>{const kind=panel.dataset.kind;panel.querySelector('.content').innerHTML='<div class="comparison"><div><div class="sample">'+small()+'</div><div class="label">Compact q on both platforms · ×3</div></div><div><div class="sample">'+wide(kind)+'</div><div class="label">macOS summary · ×3</div></div></div>'+['dark','light'].map(t=>'<div class="bar '+t+'"><span class="caption">1:1</span>'+small()+wide(kind)+'<span>14:32</span></div>').join('')+'<div class="controls"><button type="button" aria-pressed="'+paused+'">'+(paused?'Resume':'Pause')+'</button><span class="meta">macOS: 22 pt menu bar · digits 12 pt · graph 7 pt</span></div>';panel.querySelector('button').addEventListener('click',()=>{paused=!paused;render();});});root.querySelectorAll('canvas').forEach(canvas=>{const w=Number(canvas.dataset.width),start=0,ctx=canvas.getContext('2d');ctx.scale(3,3);ctx.font='600 12px ui-monospace, SFMono-Regular, Consolas, monospace';const surface=canvas.closest('.bar')||root;const colors=['--green','--ask','--muted'].map(v=>{const el=document.createElement('span');el.style.color='var('+v+')';surface.appendChild(el);const result=getComputedStyle(el).color;el.remove();return result;});['3','2','5'].forEach((text,i)=>{const m=ctx.measureText(text),bw=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,left=i===0?start:i===1?start+(w-start-bw)/2:w-bw;ctx.fillStyle=colors[i];ctx.fillText(text,left+m.actualBoundingBoxLeft,11);});});}
render();
})();
</script>
