# Main, review candidates and PRs run tests; updates require trusted exact-SHA success.
name: tests
on:
  workflow_dispatch:
  push:
    branches: [main, 'taskq-*']
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup default stable
      - run: cargo test --locked
      - run: node tests/tray-reply.test.cjs
      - run: node tests/tray-next.test.cjs
      - run: node tests/tray-incidents.test.cjs
      - run: node tests/answer-card.test.cjs
      - run: node tests/tray-answer.test.cjs
      - run: cargo run --locked -- selftest
        env:
          TASKQ_SELFTEST_OFFLINE: '1'
          TASKQ_INCIDENT_REPORTS: 'off'
  shots: # README screenshots match the UI sources (docs/shots/check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docs/shots/check.sh
  tests: # required status check name; gates on the rust matrix and the shots check
    needs: [rust, shots]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
