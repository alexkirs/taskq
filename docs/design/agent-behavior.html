<div id="tqbehavior"><div class="bdemo"><label>Preview state <select data-bstate><option>Editing</option><option>Saved</option><option>Applied</option><option>Failed</option><option>Unknown</option><option>Revision changed</option></select></label></div><div class="bcontent"></div><div class="bnotice" role="status" aria-live="polite">Design proposal · no repository changes</div></div>
<style>
#tqbehavior{font:inherit;color:var(--ink)}#tqbehavior .bdemo,#tqbehavior .brow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}#tqbehavior .bdemo,#tqbehavior small,#tqbehavior .bnotice{color:var(--secondary);font-size:.875em}#tqbehavior select{max-width:100%}#tqbehavior .brow label{min-width:85px}#tqbehavior p{margin:8px 0;overflow-wrap:anywhere}#tqbehavior details{border-top:1px solid var(--line);padding:7px 0}#tqbehavior summary{min-height:32px}#tqbehavior .bflow{border-block:1px solid var(--line);padding:8px 0;margin:8px 0}#tqbehavior .bactions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}#tqbehavior button.bprimary,#tqbehavior button.bprimary:hover{background:var(--ink);color:var(--paper)}#tqbehavior .bnotice{margin-top:7px}#tqbehavior .bchange{padding:5px 0;border-bottom:1px solid var(--line)}
</style>
<script>
(()=>{
const r=document.getElementById('tqbehavior'),clone=x=>JSON.parse(JSON.stringify(x));
const presets={Local:{commit:'After checks',push:'None',pr:'None',merge:'Never',method:'Squash'},'Push branch':{commit:'After checks',push:'Task branch',pr:'None',merge:'Never',method:'Squash'},'Review PR':{commit:'After checks',push:'Task branch',pr:'Ready',merge:'Ask owner',method:'Squash'},'Auto-merge':{commit:'After checks',push:'Task branch',pr:'Ready',merge:'After gates',method:'Squash'},Direct:{commit:'After checks',push:'Task branch',pr:'None',merge:'After gates',method:'Squash'}};
const keys={commit:'Commit',push:'Push',pr:'PR / MR',merge:'Merge',method:'PR strategy'},options={commit:['Leave changes','After checks'],push:['None','Task branch'],pr:['None','Draft','Ready'],merge:['Never','Ask owner','After gates'],method:['Squash','Merge commit','Rebase']};
const saved={Default:clone(presets['Auto-merge']),taskq:null,specq:clone(presets.Local)},draft=clone(saved);let target='Default',phase='edit',revision=12,stale=false,receipt='Applied';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const effective=(store,t)=>store[t]||(store===draft?saved.Default:store.Default);
const name=p=>Object.keys(presets).find(n=>JSON.stringify(presets[n])===JSON.stringify(p))||'Custom';
const describe=p=>p.commit==='Leave changes'?'Keep local edits. No commit, push or task closure.':p.push==='None'?'Check → commit locally → hand off. Task stays open.':p.pr==='Draft'?'Check → commit → push → draft PR. Wait for review.':p.merge==='Never'?`Check → commit → push${p.pr==='Ready'?' → ready PR':''}. Wait; task stays open.`:p.pr==='None'?`Check → commit → push task branch → ${p.merge==='Ask owner'?'owner approval → ':''}gates → advance target → verify → close. GitLab uses a fast-forward MR.`:`Check → commit → push → ready PR → ${p.merge==='Ask owner'?'owner approval → ':''}gates → ${p.method.toLowerCase()} → verify → close.`;
function note(t){r.querySelector('.bnotice').textContent=t}
function changed(){return JSON.stringify(saved[target])!==JSON.stringify(draft[target])}
function select(k,p){const disabled=(k==='push'&&p.commit==='Leave changes')||(['pr','merge'].includes(k)&&p.push==='None')||(k==='merge'&&p.pr==='Draft')||(k==='method'&&(p.pr!=='Ready'||p.merge==='Never'));return `<div class="brow"><label for="behavior-${k}">${keys[k]}</label><select id="behavior-${k}" data-bfield="${k}" ${disabled?'disabled':''}>${options[k].map(v=>`<option ${p[k]===v?'selected':''}>${v}</option>`).join('')}</select></div>`}
function render(){const p=effective(draft,target),old=effective(saved,target),inherit=target!=='Default'&&!draft[target];let body=`<div class="brow"><strong>Delivery</strong><small>Codex + Claude · workers + reviewers</small></div><div class="brow"><label for="behavior-target">Applies to</label><select id="behavior-target" data-btarget>${Object.keys(saved).map(t=>`<option ${t===target?'selected':''}>${t}</option>`).join('')}</select><small>${target==='Default'?'All inheriting projects':`taskqorg/${target} · GitHub · main`}</small></div>`;
if(phase==='review'){body+=`<strong>Review delivery change · r${revision}</strong><p>${esc(target)} · ${target==='Default'?'registered repositories / their verified target branches':'GitHub / taskqorg/'+esc(target)+' / main'}</p><div class="bchange">${esc(name(old))} → ${esc(name(p))}${inherit?' · inherit default':''}</div>${Object.keys(keys).filter(k=>old[k]!==p[k]).map(k=>`<div class="bchange">${keys[k]}: ${esc(old[k])} → <strong>${esc(p[k])}</strong></div>`).join('')}<p>${describe(p)}</p><small>${target==='Default'?'Affected inheritors: '+Object.keys(saved).filter(t=>t!=='Default'&&!saved[t]).join(', '):'Only this project; other overrides stay.'}<br>New attempts use the new policy. Pending publication must recheck authority.</small><div class="bactions"><button class="bprimary" data-b="confirm">Confirm change</button><button data-b="back">Back</button></div>`}
else if(phase==='receipt'){body+=`<strong>${receipt}</strong><p>Saved: ${name(old)} · r${revision}</p><p>${receipt==='Applied'?'Matching policy readback simulated.':receipt==='Failed'?'Service rejected the candidate; previous effective policy remains.':receipt==='Unknown'?'No fresh receipt. Effective policy unknown.':'Waiting for matching service readback. Not applied yet.'}</p><div class="bactions"><button data-b="back">Back to delivery</button></div>`}
else{body+=`<small>Saved: ${name(old)} · owner policy r${revision} · fixture</small>${inherit?'<p>Inherits default. Create an override to edit this project.</p><button data-b="override">Override for project</button>':`<div class="brow"><label for="behavior-preset">Workflow</label><select id="behavior-preset" data-bpreset>${[...Object.keys(presets),'Custom'].map(n=>`<option ${name(p)===n?'selected':''} ${n==='Custom'?'disabled':''}>${n}</option>`).join('')}</select>${target!=='Default'?'<button data-b="inherit">Use default</button>':''}</div>`}<div class="bflow">${describe(p)}</div>${!inherit?`<details><summary>Delivery details</summary>${Object.keys(keys).map(k=>select(k,p)).join('')}<small>PR needs push; push needs commit. Draft PR never auto-merges.<br>Repository capabilities must be verified; merge methods here are fixtures.</small></details>`:''}<details><summary>Required gates & completion</summary><p>Project checks · task reviewer · exact-SHA CI · repository approvals.</p><small>Unknown/failed gate blocks publication. PR creation does not close a task. Release/deploy and force-push are separate.</small></details><div class="bactions"><button class="bprimary" data-b="review" ${!changed()||stale?'disabled':''}>Review changes</button><button data-b="discard">Discard</button>${stale?'<button data-b="reload">Reload policy</button>':''}</div>`}
r.querySelector('.bcontent').innerHTML=body;r.querySelector('[data-bstate]').value=phase==='receipt'?(receipt.startsWith('Saved')?'Saved':receipt):stale?'Revision changed':'Editing';}
r.addEventListener('change',ev=>{const opened=[...r.querySelectorAll('details')].map(d=>d.open);const t=ev.target;if(t.matches('[data-btarget]')){target=t.value;phase='edit'}else if(t.matches('[data-bpreset]')){draft[target]=clone(presets[t.value]);note('Draft only · inspect the full delivery sequence before confirming.')}else if(t.dataset.bfield){const p=draft[target];p[t.dataset.bfield]=t.value;if(p.commit==='Leave changes')p.push='None';if(p.push==='None'){p.pr='None';p.merge='Never'}if(p.pr==='Draft')p.merge='Never';note('Custom draft · dependent actions reduced; no broader action enabled.')}else if(t.matches('[data-bstate]')){stale=t.value==='Revision changed';if(t.value==='Editing'||stale)phase='edit';else{phase='receipt';receipt=t.value==='Saved'?'Saved · waiting for service':t.value}note(stale?'Policy changed. Reload and review before applying.':'Preview state: '+t.value+' · synthetic result')}render();if(t.dataset.bfield)r.querySelectorAll('details').forEach((d,j)=>d.open=opened[j])});
r.addEventListener('click',ev=>{const a=ev.target.closest('[data-b]')?.dataset.b;if(!a)return;switch(a){case 'override':draft[target]=clone(saved.Default);break;case 'inherit':draft[target]=null;break;case 'discard':draft[target]=clone(saved[target]);break;case 'review':if(changed()&&!stale)phase='review';break;case 'back':phase='edit';break;case 'reload':stale=false;revision++;note('Fixture reloaded; draft retained. Review against current policy.');break;case 'confirm':if(phase!=='review'||stale)return;saved[target]=clone(draft[target]);revision++;receipt='Saved · waiting for service';phase='receipt';note('Simulation only. No push, PR or merge performed.');break;}render()});
render();
})();
</script>
