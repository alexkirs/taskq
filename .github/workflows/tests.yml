# Main pushes and PR updates run tests; updates require trusted exact-SHA success.
name: tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup default stable
      - run: cargo test --locked
      - run: node tests/tray-reply.test.cjs
      - run: node tests/tray-home-ai.test.cjs
      - run: node tests/tray-home-proposal.test.cjs
      - run: node tests/tray-next.test.cjs
      - run: node tests/tray-navigation.test.cjs
      - run: node tests/tray-press.test.cjs
      - run: node tests/tray-action.test.cjs
      - run: node tests/tray-incidents.test.cjs
      - run: node tests/answer-card.test.cjs
      - run: node tests/tray-answer.test.cjs
      - run: node tests/project-blocks.test.cjs
      - run: node tests/finding-composer.test.cjs
      - run: node tests/resource-controls.test.cjs
      - run: node tests/tray-resources.test.cjs
      - run: cargo run --locked -- selftest
        env:
          TASKQ_SELFTEST_OFFLINE: '1'
          TASKQ_INCIDENT_REPORTS: 'off'
  windows-gnu: # GNU loads the DLL; the Windows MSVC matrix uses a static loader.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu
      - run: cargo +stable-x86_64-pc-windows-gnu test --locked --test windows_install -- --show-output
  shots: # README screenshots: stale against the UI sources warns (exit 2), any other check.sh error fails (taskq.md R12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docs/shots/check.test.sh
      - run: .github/release-tag.test.sh
      - run: |
          rc=0; docs/shots/check.sh || rc=$?
          [ $rc = 2 ] && { echo '::warning::README shots are stale; run the README shots workflow (dispatch) or wait for the next release tag'; exit 0; }
          exit $rc
  tests: # required status check name; gates on the rust matrix and the shots check
    needs: [rust, windows-gnu, shots]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
