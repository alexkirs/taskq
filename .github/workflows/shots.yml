name: README shots
on:
  workflow_dispatch:
  push:
    branches: [taskq-924]
    paths: ['.github/workflows/shots.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup default stable
      - name: Capture README shots
        shell: bash
        run: docs/shots/update.sh 2>&1 | tee "$RUNNER_TEMP/shots.log"
      - run: docs/shots/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: readme-shots
          path: docs/shots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-shots-log
          path: ${{ runner.temp }}/shots.log
          if-no-files-found: warn
