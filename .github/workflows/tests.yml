# Main, review candidates and PRs run tests; updates require trusted exact-SHA success.
name: tests
on:
  push:
    branches: [main, 'taskq-*']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m unittest tests.test_single
