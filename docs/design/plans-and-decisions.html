<div id="tqplans"><div class="pdemo"><label>Preview state <select data-plan-fixture><option>Draft</option><option>Running</option><option>Needs answer</option><option>Failed</option><option>Complete</option></select></label><small>Example plan · no agent or service runs</small></div><div class="pbody"></div><div class="pnotice" role="status" aria-live="polite"></div></div>
<style>
#tqplans{color:var(--ink);font:inherit}#tqplans p{margin:6px 0;overflow-wrap:anywhere}#tqplans .pdemo,#tqplans .prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}#tqplans .pdemo,#tqplans small,#tqplans .pnotice{font-size:.85em;color:var(--secondary)}#tqplans .pstage{border-top:1px solid var(--line);padding:7px 0}#tqplans .pstage>small{display:block}#tqplans .psiblings{margin:4px 0;padding-left:12px;border-left:2px solid var(--line)}#tqplans .pwait{color:var(--secondary)}#tqplans .pactions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}#tqplans button.pprimary,#tqplans button.pprimary:hover{background:var(--ink);color:var(--paper)}#tqplans .preview{border:1px solid var(--line);border-radius:6px;padding:8px}#tqnext .qcard{border-top:1px solid var(--line);padding:7px 2px}#tqnext .qcard p{margin:4px 0}#tqnext .qchoices{display:flex;align-items:stretch;gap:4px;flex-wrap:wrap;margin:6px 0}#tqnext .qchoices button{display:flex;align-items:baseline;gap:6px;text-align:left;background:var(--hover);white-space:normal}#tqnext .qnumber{font-variant-numeric:tabular-nums;flex:none}#tqnext .qcard details{margin:5px 0}#tqnext .qcard small{display:block}#tqnext .qcard .qreceipt{color:var(--good)}#tqnext .qdemo{font-size:.8em;color:var(--secondary);margin-top:7px}#tqnext .qcard summary{min-height:30px}#tqnext .qcard [data-qstatus]{max-width:100%}#tqplans .pnotice{min-height:24px;padding-top:6px}
</style>
<script>
(()=>{
const r=document.getElementById('tqplans'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let example='Build and verify the five-repository project, then remove its temporary environment. Keep unpublished work.';
const recipes={
'Multi-repo work':{name:'Five-repository build',count:7,goal:example,route:[]},
'Plan first':{name:'Plan the admin API',count:2,goal:'Inspect existing tasks, prepare the admin API specification, and show me before implementation.',route:[['Inspect existing tasks','Reuse relevant cards; resolve conflicts'],['Prepare specification','Acceptance and affected use cases'],['Owner checkpoint','Implementation stays held until your approval']]},
'Implement and review':{name:'Implement the admin API',count:1,goal:'Implement the approved admin API specification, run checks, and open a PR for my review.',route:[['Implement approved scope','One reviewable outcome; existing project rules'],['Verify and review','Required checks and reviewer evidence'],['Review PR','Owner approves the exact candidate before publication']]},
'Urgent fix':{name:'Fix the API regression',count:1,goal:'File the admin API regression as urgent, preserve compatibility, and verify the fix.',route:[['Inspect and reconcile','Reuse an existing issue where appropriate'],['Next eligible admission','p0; never bypass pause, access or host pressure'],['Fix, check and review','Same evidence and delivery policy as normal work']]}
};
let recipe='Multi-repo work';
function recipeRoute(){const attention=planState==='Needs answer'?question('plan'):planState==='Failed'?'<p class="ask">Required project check failed. Dependent work stays held.</p><button data-plan="repair">Repair with AI</button>':'';const d=recipes[recipe],done=planState==='Complete',held=['Draft','Created'].includes(planState);return attention+d.route.map(([name,detail],i)=>`<div class="pstage"><strong>${done?'✓':held?'○':i===0?'▷':'○'} ${name}</strong><small>${detail}</small></div>`).join('')+`<small>${held?'No execution authorized.':done?'Fixture evidence verified.':'Example progress only; the service must prove each step.'} Access: Workspace · Delivery: Review PR · Resources: Auto with configured caps</small>`}
const questions={task:{key:'task',issue:841,title:'Keep the existing admin API?',why:'Changing the response format would break current clients.',checked:'Existing clients still use the current response format.',options:['Keep compatibility · add the new fields ★','Use the new format · migrate clients'],state:'Open',draft:'',answer:'',revision:3,sent:0},plan:{key:'plan',issue:852,title:'Which Rust toolchain should the libraries use?',why:'The two repository manifests request different compiler versions.',checked:'No build started for the conflicting library.',options:['Use the pinned project toolchain ★','Wait for the maintainer'],state:'Open',draft:'',answer:'',revision:1,sent:0}};
let planState='Draft',planDraft=example,review=false,creation='Create tasks only',paused=false,notice='',operations=0,created=false;
const open=panel=>document.getElementById('tqnext').dispatchEvent(new CustomEvent('tq-open',{detail:panel}));
function refresh(){render();document.getElementById('tqnext')?.dispatchEvent(new CustomEvent('tq-refresh'))}
function question(key){const q=questions[key],ordinary=q.state==='Open';return `<div class="qcard" data-question="${key}"><div class="line"><span class="ask">?</span><button data-action="issue" class="link">#${q.issue}</button><small>taskq · Codex</small></div><strong>${q.title}</strong><p>${q.why}</p>${ordinary?`<div class="qchoices">${q.options.map((text,j)=>`<button data-q="answer" data-key="${key}" data-option="${j}" data-revision="${q.revision}"><span class="qnumber">${j+1}.</span><span>${esc(text)}</span></button>`).join('')}</div><details><summary>Other answer</summary><textarea data-qtext="${key}" aria-label="Answer for ${q.issue}" placeholder="Your answer…">${esc(q.draft)}</textarea><button data-q="custom" data-key="${key}" data-revision="${q.revision}">Send answer</button></details>`:q.state==='Recorded'?`<p class="qreceipt">Recorded: ${q.answerNumber?`${q.answerNumber}. `:""}${esc(q.answer)}</p><small>Board acknowledgement simulated. Agent resumption is not yet verified.</small>`:q.state==='Sending'?'<p>Sending… choices locked</p>':q.state==='Changed'?`<p class="ask">Question changed. Your previous choice was not sent.</p><button data-q="reload" data-key="${key}">Load current question</button>`:q.state==='Unknown'?`<p>Delivery unknown. Do not resend.</p><button data-q="check" data-key="${key}">Check answer status</button>`:`<p>Rejected before write. Draft preserved.</p><button data-q="reload" data-key="${key}">Retry answer</button>`}<details><summary>Checked & context</summary><small>${q.checked}</small><button data-q="discuss" data-key="${key}">Discuss with AI</button></details><div class="qdemo"><label>Preview answer state <select data-qstatus="${key}">${['Open','Sending','Recorded','Changed','Failed','Unknown'].map(s=>`<option ${q.state===s?'selected':''}>${s}</option>`).join('')}</select></label></div></div>`}
function stages(){if(recipe!=='Multi-repo work')return recipeRoute();const live=planState!=='Draft'&&planState!=='Created',done=planState==='Complete',failed=planState==='Failed',ask=planState==='Needs answer';return `<div class="pstage"><strong>${live?'✓':'○'} Prepare environment</strong><small>Explicit repository revisions · owned temporary workspace</small></div><div class="pstage"><strong>${done?'✓':failed?'!':ask?'?':live?'▷':'○'} Build independent components</strong><small>Parallel when slots and isolated resources permit</small><div class="psiblings">${['rust-core','rust-codec','huff'].map((x,i)=>`<div class="prow"><span>${x}</span><small>${done?'Verified':!live?'Waits for preparation':i===0?'Verified':i===1?failed?'Failed: compiler mismatch':ask?'Waiting for your answer':'Running':paused?'Waiting · plan paused':'Running'}</small></div>`).join('')}</div>${ask?question('plan'):failed?'<p>rust-codec failed. Integration waits; verified rust-core is retained.</p><button data-plan="repair">Repair with AI</button><button data-plan="retry">Review retry</button>':''}</div><div class="pstage"><strong>${done?'✓':'○'} Integrate main + frontend</strong><small>${done?'Compatible outputs verified':'Waits for all required component outputs; main before frontend'}</small></div><div class="pstage"><strong>${done?'✓':'○'} Verify the result</strong><small>${done?'Acceptance and cross-repository checks passed':'Project checks + acceptance · publication follows Delivery policy'}</small></div><div class="pstage"><strong>${done?'✓':'○'} Clean owned temporary resources</strong><small>${done?'Owned temporary environment removed; evidence retained':'After all attempts settle, including failure/cancellation; preserve unpublished work'}</small></div>`}
function render(){r.querySelector('[data-plan-fixture]').value=['Created','Retry review'].includes(planState)?'Draft':planState;const initial=['Draft','Created'].includes(planState);r.querySelector('.pbody').innerHTML=`<div class="prow"><strong>${recipes[recipe].name}</strong><small>${paused?'Paused · active attempts continue':planState}</small></div><small>taskq · ${recipes[recipe].count} ${created?'existing':'proposed'} tasks</small>${initial&&!review?`<div class="line"><label>Recipe <select data-recipe ${created?'disabled':''}>${Object.keys(recipes).map(v=>`<option ${recipe===v?'selected':''}>${v}</option>`).join('')}</select></label></div><small>Selection drafts a plan. Edit the goal or discuss changes; nothing starts.</small><div class="composer"><textarea data-plan-draft aria-label="Plan goal">${esc(planDraft)}</textarea><div class="line"><button data-plan="propose" class="pprimary">${planState==='Created'?'Review changes':'Prepare plan with AI'}</button><button data-plan="example">Use example</button></div></div>`:''}${review?`<div class="preview"><strong>Review plan</strong><p>${recipe==='Multi-repo work'?'Repositories: rust-core, rust-codec, main, huff, frontend.':'Project: taskq · existing repository'}</p><p>${created?`Reuse ${recipes[recipe].count} existing cards; no new issues.`:`Create ${recipes[recipe].count} task cards with reviewed dependencies.`} ${recipe==='Multi-repo work'?'Cleanup is a separate finalizer after attempts settle.':'Required checks and owner checkpoints remain in force.'}</p><small>Example plan; no real repositories inspected. Requires qualified planning and lifecycle support.</small><div class="prow"><label>After confirmation <select data-plan-creation><option ${creation==='Create tasks only'?'selected':''} ${created?'disabled':''}>Create tasks only</option><option value="Create tasks & start" ${creation==='Create tasks & start'?'selected':''}>${created?'Start existing tasks':'Create tasks & start'}</option></select></label></div><small>${creation==='Create tasks only'?'Create the reviewed cards without authorizing execution.':'Admit only reviewed tasks within current focus/limits; project pause stays authoritative.'}</small></div>`:''}${planState==='Retry review'?`<div class="preview"><strong>Retry rust-codec?</strong><p>Only the failed build gets a new attempt. No live attempt; prior failure confirmed in this fixture.</p><small>Keep verified rust-core. Integration stays blocked until required outputs pass.</small><div class="pactions"><button data-plan="retry-confirm" class="pprimary">Retry failed build</button><button data-plan="retry-back">Back</button></div></div>`:stages()}<div class="pactions">${review?'<button data-plan="confirm" class="pprimary">Confirm plan</button><button data-plan="back">Back to draft</button>':planState==='Created'?'<button data-plan="start-review" class="pprimary">Review start</button>':!initial&&planState!=='Retry review'&&planState!=='Complete'?`<button data-plan="pause">${paused?'Resume new tasks':'Pause new tasks'}</button>`:''}<button data-plan="discuss">Discuss changes with AI</button></div>`;r.querySelector('.pnotice').textContent=notice;}
function submit(q,text,revision,number=null){if(q.state!=='Open'||revision!==q.revision)return;if(!text.trim()){notice='Write an answer first.';refresh();return}q.state='Sending';q.sent++;q.answer=text;q.answerNumber=number;refresh();const current=q.revision;setTimeout(()=>{if(q.state==='Sending'&&q.revision===current){q.state='Recorded';refresh()}},250)}
document.addEventListener('input',ev=>{if(ev.target.dataset.qtext)questions[ev.target.dataset.qtext].draft=ev.target.value;if(ev.target.matches('[data-plan-draft]'))planDraft=ev.target.value});
document.addEventListener('change',ev=>{if(ev.target.dataset.qstatus){const q=questions[ev.target.dataset.qstatus];q.state=ev.target.value;if(q.state==='Recorded'&&!q.answer)q.answer='Previously recorded answer · fixture';q.revision++;refresh()}});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-q]');if(!el)return;const q=questions[el.dataset.key];switch(el.dataset.q){case 'answer':submit(q,q.options[Number(el.dataset.option)],Number(el.dataset.revision),Number(el.dataset.option)+1);return;case 'custom':submit(q,q.draft,Number(el.dataset.revision));return;case 'reload':q.state='Open';q.revision++;notice='Current question loaded · choose again; no answer sent.';break;case 'check':notice='Fixture lookup remains unknown; resend is blocked.';break;case 'discuss':window.tqAI.prepare(`Explain the choices for taskq #${q.issue}. Question: ${q.title} ${q.why} Options: ${q.options.map((text,j)=>`${j+1}. ${text}`).join('; ')}. Do not answer for me.`);open('chat');return;}refresh()});
r.addEventListener('input',ev=>{if(ev.target.matches('[data-plan-draft]'))planDraft=ev.target.value});
r.addEventListener('change',ev=>{if(ev.target.matches('[data-recipe]')){recipe=ev.target.value;example=recipes[recipe].goal;planDraft=example;creation='Create tasks only';review=false;notice='Recipe selected as a draft. No execution authorized.';refresh();return}if(ev.target.matches('[data-plan-fixture]')){planState=ev.target.value;review=false;paused=false;notice='Preview state: '+planState+' · synthetic service state';created=planState!=='Draft';if(planState==='Needs answer'){questions.plan.state='Open';questions.plan.title=recipe==='Multi-repo work'?'Which Rust toolchain should the libraries use?':'Approve the reviewed specification?';questions.plan.why=recipe==='Multi-repo work'?'The two repository manifests request different compiler versions.':'Implementation waits for approval of this exact specification revision.';questions.plan.options=recipe==='Multi-repo work'?['Use the pinned project toolchain ★','Wait for the maintainer']:['Approve this specification ★','Revise before implementation'];}refresh()}if(ev.target.matches('[data-plan-creation]')){creation=ev.target.value;render()}});
r.addEventListener('click',ev=>{const a=ev.target.closest('[data-plan]')?.dataset.plan;if(!a)return;switch(a){case 'example':planDraft=example;break;case 'propose':if(planDraft.trim()!==example){notice='Live planner unavailable in this preview. Draft retained; use the example to inspect its plan.';render();return}review=true;break;case 'confirm':if(!review)return;review=false;if(!created){operations++;created=true;}planState=creation==='Create tasks only'?'Created':'Running';notice=creation==='Create tasks only'?'Ready to start when you say. Cards held · simulated receipt; no board writes.':'Start confirmed · simulated receipt; no board writes.';break;case 'back':review=false;break;case 'start-review':creation='Create tasks & start';review=true;notice='Existing example cards are reused; start review must not create duplicates.';break;case 'pause':paused=!paused;notice=paused?'New plan admissions held; running attempts and other projects continue.':'Plan hold removed; current project pause, focus and capacity still apply.';break;case 'retry':planState='Retry review';break;case 'retry-back':planState='Failed';break;case 'retry-confirm':if(planState!=='Retry review')return;planState='Running';notice='Failed build retried in a new fixture attempt. Verified sibling retained.';break;case 'discuss':case 'repair':window.tqAI.prepare(a==='repair'?'Diagnose the failed rust-codec build in the example plan. Preserve verified outputs; propose a repair before retry.':`Revise this plan: ${planDraft}. Show only changed tasks, dependencies and effects; do not apply yet.`);open('chat');return;}refresh()});
window.tqPlans={question,summary:()=>`<button data-action="plans" class="all">${planState==='Needs answer'?'?':'☷'} ${recipes[recipe].name} <small>Plan · ${paused?'Paused':planState}</small></button>`,snapshot:()=>JSON.parse(JSON.stringify({recipe,planState,planDraft,paused,operations,questions}))};render();
})();
</script>
