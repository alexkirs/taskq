<div id="tqai"><div class="aidemo"><label>Preview state <select data-fixture><option>Editing</option><option>Queued</option><option>Running</option><option>Needs answer</option><option>Proposal</option><option>Applying</option><option>Applied</option><option>Result</option><option>Refused</option><option>Partial</option><option>Failed</option><option>Interrupted</option><option>Cancelled</option></select></label><button data-ai="restart">Simulate restart</button></div><div class="ailayout"><aside class="ailist"></aside><section class="aichat"></section></div><div class="ainote" role="status" aria-live="polite"></div></div>
<style>
#tqai{font:inherit;color:inherit}#tqai *{box-sizing:border-box}#tqai button,#tqai input,#tqai textarea,#tqai select{font:inherit;color:inherit}#tqai button{min-height:32px;border:0;border-radius:5px;padding:4px 6px;background:transparent}#tqai button:hover,#tqai button[aria-pressed=true]{background:var(--hover,light-dark(#e9edf1,#37424c))}#tqai button:disabled{opacity:.5}#tqai input,#tqai select{background:var(--paper,light-dark(#fafbfc,#252b32));border:1px solid var(--line,light-dark(#dce0e5,#46505b));border-radius:5px;padding:4px;max-width:100%}#tqai .aidemo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.875em;color:var(--secondary);margin-bottom:8px}#tqai .ailayout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}#tqai .ailist{border-right:1px solid var(--line);padding-right:7px;min-width:0}#tqai .ailist input{width:100%}#tqai .aititle{font-weight:500}#tqai .airow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}#tqai .airow.spread{justify-content:space-between}#tqai .aientry{display:block;width:100%;text-align:left;margin-top:4px;overflow-wrap:anywhere}#tqai small,#tqai .ainote{font-size:.85em;color:var(--secondary)}#tqai .aientry small{display:block}#tqai .aichat{min-width:0}#tqai p{margin:5px 0;overflow-wrap:anywhere}#tqai .aimsg{padding:6px 0;border-bottom:1px solid var(--line)}#tqai .aibox{border:1px solid var(--line);border-radius:6px;padding:7px;margin:7px 0}#tqai .aicomposer{border:1px solid var(--line);border-radius:6px;padding:5px;margin-top:8px}#tqai textarea{display:block;width:100%;min-height:70px;max-height:160px;resize:vertical;border:0;background:transparent;padding:4px}#tqai .aifile{display:flex;align-items:center;gap:5px;flex-wrap:wrap;border-top:1px solid var(--line);padding:4px 0;overflow-wrap:anywhere}#tqai .aifile img{width:44px;height:44px;object-fit:contain}#tqai .ainote{margin-top:6px;min-height:24px}#tqai .aiprimary,#tqai .aiprimary:hover{background:var(--ink,light-dark(#243039,#eef2f5));color:var(--paper,light-dark(#fafbfc,#252b32))}#tqai .backlist{display:none}#tqai svg{display:inline-block;width:16px;height:16px;vertical-align:-3px}#tqai .aipreview{max-width:100%;max-height:260px;object-fit:contain}@container aiworkspace (max-width:480px){#tqai .ailayout{display:block}#tqai .ailist{display:none;border:0}#tqai .backlist{display:inline-block}#tqai[data-list=true] .ailist{display:block}#tqai[data-list=true] .aichat{display:none}}#tqai{container-type:inline-size;container-name:aiworkspace}
</style>
<script>
(()=>{
const r=document.getElementById('tqai'),e=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,b=(a,t,v='',extra='')=>`<button data-ai="${a}" data-v="${e(v)}" ${extra}>${t}</button>`;
const make=(id,title,status='Editing')=>({id,title,status,draft:'',files:[],messages:[],owner:'main',archived:false,revision:1,confirmed:0,request:0});
let locallyEdited=false;let conversations=[make('admin','Admin API','Needs answer'),make('release','Release checks','Running'),{...make('plan','Previous plan','Applied'),archived:true}],selected='admin',archived=false,query='',deleting=false,preview='';
const active=['Queued','Running','Cancelling','Applying'],unresolved=[...active,'Proposal','Needs answer','Partial','Interrupted'];
const sendBlocked=[...active,'Proposal','Partial','Interrupted'];
function c(){return conversations.find(x=>x.id===selected)}
function note(t){r.querySelector('.ainote').textContent=t}
function save(){locallyEdited=true;const safe=conversations.map(x=>({...x,files:x.files.map(f=>({name:f.name,size:f.size,state:'Reattach required'}))}));window.openai?.setWidgetState?.({modelContent:{aiWorkspace:{conversation:selected,state:c()?.status,owner:c()?.owner}},privateContent:{aiConversations:safe,selected}})?.catch(()=>{});}
function restore(state){const data=state?.privateContent;if(Array.isArray(data?.aiConversations)&&data.aiConversations.every(x=>typeof x.id==='string'&&typeof x.title==='string'&&typeof x.status==='string'&&typeof x.draft==='string'&&Array.isArray(x.messages)&&x.messages.every(m=>m&&typeof m.text==='string'&&typeof m.role==='string'&&(!m.files||Array.isArray(m.files)&&m.files.every(f=>f&&typeof f.name==='string')))&&Array.isArray(x.files)&&x.files.every(f=>f&&typeof f.name==='string'&&Number.isFinite(f.size)))){conversations=JSON.parse(JSON.stringify(data.aiConversations));for(const x of conversations){if(unresolved.includes(x.status))x.status="Interrupted";x.owner="main";for(const f of x.files){delete f.url;f.state="Reattach required"}}selected=conversations.some(x=>x.id===data.selected)?data.selected:conversations[0]?.id;}}
restore(window.openai?.widgetState);
function content(x){switch(x.status){case 'Result':return '<p>Two tasks wait for a human answer. Open Attention to review them.</p><small>Fixture snapshot · not live board data.</small>';case 'Refused':return '<p>This operator cannot grant host permissions. Open Agents to review host policy.</p>';case 'Needs answer':return `<p>Include the authentication dependency outside the requested scope?</p>${b('answer','1. Keep it excluded','exclude')}${b('answer','2. Review inclusion','include')}`;case 'Queued':return '<p>Waiting for operator capacity. No worker has started.</p>';case 'Running':return '<p>Agent is working. Progress details are unavailable.</p>';case 'Proposal':return `<p>taskq · All → Admin API, excluding billing</p><small>Future matches included. Current attempts continue.</small><div>${b('confirm','Confirm changes','','class="aiprimary"')}${b('decline','Decline')}</div>`;case 'Applying':return '<p>Checking and applying the reviewed operations. Confirmation cannot be repeated.</p>';case 'Applied':return '<p>Applied · matching service readback received.</p>';case 'Partial':return '<p>taskq: applied.<br>agentq: outcome unknown.</p><small>Reconcile the unknown operation before retry; do not repeat taskq.</small>'+b('check','Check unknown operation');case 'Interrupted':return '<p>Delivery is uncertain after interruption. Draft preserved.</p>'+b('check','Check request status');case 'Failed':return '<p>Agent failed before accepting this fixture request. No changes applied.</p>'+b('retry','Retry request');case 'Cancelling':return '<p>Cancellation requested; awaiting acknowledgement.</p>'+b('ack','Simulate cancellation acknowledgement');case 'Cancelled':return '<p>Cancellation acknowledged. This does not roll back completed effects.</p>';default:return '<p>Ask, plan or review changes.</p>';}}
function render(){const x=c();r.querySelector('.ailist').innerHTML=`<div class="airow spread"><strong>Conversations</strong>${b('new',icon('plus'),'','aria-label="New conversation"')}</div><input data-search aria-label="Search conversations" placeholder="Search" value="${e(query)}"><div class="airow">${b('archive-view',archived?'Recent':'Archive')}</div>${conversations.filter(z=>z.archived===archived&&z.title.toLowerCase().includes(query.toLowerCase())).map(z=>`<button class="aientry" data-ai="select" data-v="${e(z.id)}" aria-pressed="${z.id===selected}">${e(z.title)}<small>${e(z.status)}${z.owner==='detached'?' · separate window':''}</small></button>`).join('')||'<small>No conversations</small>'}`;
r.querySelector('.aichat').innerHTML=!x?'<p>Select or create a conversation.</p>':`${b('list',icon('arrow-left')+' Conversations','','class="backlist"')}<div class="airow spread"><strong>${e(x.title)}</strong><span>${b('detach',icon('panels-top-left'),'','aria-label="Detach or return conversation"')}${b('hide',icon('x'),'','aria-label="Hide conversation window"')}</span></div><small>taskq · Codex · current host</small>${x.owner!=='main'?`<div class="aibox">${x.owner==='hidden'?'Window hidden · request continues':'Separate window owner · simulated'}${b('raise','Raise window')}${b('return','Return to main')}</div>`:''}${x.messages.map(m=>`<div class="aimsg"><small>${e(m.role)}</small><p>${e(m.text)}</p>${m.files?.length?'<small>'+m.files.map(f=>e(f.name)).join(', ')+'</small>':''}</div>`).join('')}<div class="aibox" data-outcome><strong>${e(x.status)}</strong>${content(x)}${['Queued','Running'].includes(x.status)?b('cancel','Cancel request'):''}</div>${deleting?`<div class="aibox"><p>Delete local conversation and attachment copies? Board tasks and source files stay.</p>${b('delete-confirm','Delete local history')}${b('delete-cancel','Keep')}</div>`:''}${preview?`<div class="aibox"><img class="aipreview" src="${preview}" alt="Selected attachment preview">${b('preview-close','Close preview')}</div>`:''}<div class="aicomposer"><textarea data-draft aria-label="Conversation message" placeholder="Message Codex…">${e(x.draft)}</textarea>${x.files.map((f,j)=>`<div class="aifile">${f.url?`<img src="${f.url}" alt="Attachment thumbnail">`:icon('paperclip')}<span>${e(f.name)} <small>${Math.ceil(f.size/1024)} KB · ${e(f.state)}</small></span>${f.url?b('preview','Preview',j):''}${b('remove-file',icon('x'),j,'aria-label="Remove attachment"')}</div>`).join('')}<div class="airow spread">${b('attach',icon('paperclip')+' Attach')}<span>${sendBlocked.includes(x.status)?'<small>Draft next message</small>':''}${b('send',icon('arrow-up')+' Send','',`class="aiprimary" ${sendBlocked.includes(x.status)?'disabled':''}`)}</span></div><input data-files type="file" multiple accept="image/png,image/jpeg,image/webp,text/plain,text/markdown,application/pdf" hidden></div><div class="airow">${b('archive',x.archived?'Restore':'Archive','',unresolved.includes(x.status)?'disabled':'')}${b('delete','Delete history','',unresolved.includes(x.status)?'disabled':'')}</div>`;
r.querySelector('[data-fixture]').value=x?.status||'Editing';window.lucide?.createIcons();}
function rememberOutcome(x){if(x.messages.at(-1)?.role==='You'){const body=r.querySelector('[data-outcome]');x.messages.push({role:'TaskQ',text:x.status+': '+[...body.querySelectorAll('p,small')].map(n=>n.textContent).join(' ')})}}
function send(){const x=c();if(!x||sendBlocked.includes(x.status))return;if(!x.draft.trim()){note('Describe what to do with the attachments.');return}if(x.files.some(f=>f.state!=='Ready')){note('Remove or reattach unavailable files before sending. Draft retained.');return}rememberOutcome(x);x.messages.push({role:'You',text:x.draft,files:x.files.map(f=>({name:f.name,size:f.size}))});x.title=x.title==='New conversation'?x.draft.slice(0,36):x.title;x.draft='';x.files=[];x.request++;x.revision++;x.status='Queued';note('Simulated request queued; no data sent.');render();save();}
async function files(list){const x=c();if(!x)return;for(const file of list){const f={name:file.name,size:file.size,state:'Reading'};x.files.push(f);render();if(file.size>5*1024*1024){f.state='Error: demo limit 5 MB';continue}if(!/^(image\/(png|jpeg|webp)|text\/(plain|markdown)|application\/pdf)$/.test(file.type)&&! /\.(txt|md)$/i.test(file.name)){f.state='Error: unsupported type';continue}try{if(file.type.startsWith('image/')){f.url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});}else{await file.arrayBuffer();}f.state='Ready';}catch{f.state='Error: unreadable';}}render();save();note('Local preview only · fixture limit 5 MB/file; no upload.');}
r.addEventListener('click',ev=>{const el=ev.target.closest('[data-ai]');if(!el)return;const x=c(),a=el.dataset.ai,v=el.dataset.v;switch(a){case 'new':{const n=make('c'+Date.now(),'New conversation');conversations.push(n);selected=n.id;archived=false;r.dataset.list='false';break}case 'select':selected=v;deleting=false;preview='';r.dataset.list='false';break;case 'list':r.dataset.list='true';break;case 'archive-view':archived=!archived;break;case 'archive':if(unresolved.includes(x.status))return;x.archived=!x.archived;archived=x.archived;break;case 'delete':deleting=true;break;case 'delete-cancel':deleting=false;break;case 'delete-confirm':if(unresolved.includes(x.status))return;conversations=conversations.filter(z=>z!==x);selected=conversations[0]?.id;deleting=false;break;case 'send':send();return;case 'attach':r.querySelector('[data-files]').click();return;case 'remove-file':x.files.splice(Number(v),1);preview='';break;case 'preview':preview=x.files[Number(v)].url;break;case 'preview-close':preview='';break;case 'detach':x.owner=x.owner==='detached'?'main':'detached';note('Window ownership simulated; no native window created.');break;case 'hide':x.owner='hidden';break;case 'raise':x.owner='detached';break;case 'return':x.owner='main';break;case 'cancel':if(!['Queued','Running'].includes(x.status))return;x.status='Cancelling';break;case 'ack':if(x.status==='Cancelling')x.status='Cancelled';break;case 'answer':rememberOutcome(x);x.messages.push({role:'You',text:v==='exclude'?'1. Keep it excluded':'2. Review inclusion'});x.status='Proposal';x.revision++;break;case 'confirm':if(x.status!=='Proposal'||x.confirmed===x.revision)return;x.confirmed=x.revision;x.status='Applying';break;case 'decline':x.status='Editing';break;case 'check':if(x.status==='Partial'){note('Fixture: taskq remains applied; agentq still unknown. Retry remains blocked.');return}x.status='Failed';note('Fixture lookup: previous request was not accepted. Explicit Retry is now available.');break;case 'retry':if(x.status==='Failed'){x.status='Queued';x.request++;}break;case 'restart':for(const z of conversations){if(unresolved.includes(z.status))z.status='Interrupted';for(const f of z.files){delete f.url;f.state='Reattach required'}z.owner='main';}note('Restart simulated: drafts retained; unresolved requests require reconciliation.');break;}render();save();});
r.addEventListener('input',ev=>{if(ev.target.matches('[data-draft]')){c().draft=ev.target.value;save()}if(ev.target.matches('[data-search]')){query=ev.target.value;const cursor=ev.target.selectionStart;render();const field=r.querySelector('[data-search]');field.focus();field.setSelectionRange(cursor,cursor);}});
r.addEventListener('keydown',ev=>{if(ev.target.matches('[data-draft]')&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();send();}});
r.addEventListener('change',ev=>{if(ev.target.matches('[data-fixture]')){const x=c();if(!x)return;x.status=ev.target.value;x.revision++;note('Preview state: '+x.status+' · synthetic result');render();save()}if(ev.target.matches('[data-files]'))files([...ev.target.files]);});
r.addEventListener('dragover',ev=>{if(ev.target.closest('.aicomposer'))ev.preventDefault()});r.addEventListener('drop',ev=>{if(ev.target.closest('.aicomposer')){ev.preventDefault();files([...ev.dataTransfer.files]);}});
window.tqAI={prepare(text){this.newConversation();c().draft=text;render();save()},showList(){r.dataset.list='true';render()},newConversation(){r.querySelector('[data-ai=new]').click()},async acceptMenu(text,attached){this.newConversation();c().draft=text;r.dataset.list='false';if(attached.length)await files(attached);send();},snapshot(){return copyState()}};
function copyState(){return JSON.parse(JSON.stringify({selected,conversations}))}
window.addEventListener('openai:set_globals',ev=>{if(!locallyEdited){restore(ev.detail?.globals?.widgetState);render()}});render();
})();
</script>
