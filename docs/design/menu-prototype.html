<div id="tq-spec"><div class="stage viz-dotted-background"><div class="bar"><button class="trigger" aria-label="taskq menu" aria-expanded="true"></button><span class="clock">◉ &nbsp; 14:32</span></div><div class="menu"></div><div class="foot">Product HTML popover preview · fixture state · no service writes. Target: wry webview, one tray per host, install/projects registry.</div></div></div>
<script>
(()=>{
const fixtures=[{project:'taskq',number:664,title:'Desktop and CLI capabilities',state:'doing'},{project:'taskq',number:654,title:'Task Mesh — agents across hosts',state:'ask'},{project:'taskq',number:652,title:'Run an urgent task outside the current scope',state:'failed'},{project:'taskq',number:651,title:'Move TaskQ to an organization',state:'ready'}].map(t=>({...t,key:'github.com/alexkirs/taskq/'+t.number,url:'https://github.com/alexkirs/taskq/issues/'+t.number}));
const periods={'5m':300000,'1h':3600000,'1d':86400000,'1w':604800000,'1mo':2592000000};
const now=Date.UTC(2026,9,13,14,32);
const events=Array.from({length:28},(_,i)=>({time:now-(i*i*47+30)*60000,task:'github.com/alexkirs/taskq/'+(600+i),attemptId:'attempt-'+i,kind:'close'})).concat([{time:now-60000,task:'github.com/alexkirs/taskq/652',attemptId:'failed-attempt-1',kind:'failed'},{time:now-6000000,task:'github.com/alexkirs/taskq/652',attemptId:'failed-attempt-2',kind:'failed'}]).filter(e=>e.time>=now-86400000);
const historySince=now-86400000; // <root>/.taskq/events: attemptId is the event ID; no board replay.
const names={doing:'In work',review:'Review',ask:'Waiting for answer',failed:'Failed',ready:'Ready',waiting:'Dependencies',later:'Later'};
const symbols={doing:'▶',review:'↻',ask:'?',failed:'!',ready:'○',waiting:'⋯',later:'Ⅱ'};
const color=st=>({doing:'work',review:'work',ask:'ask',failed:'failed',ready:'ready'}[st]||'muted');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function unique(tasks){return [...new Map(tasks.map(t=>[t.key,t])).values()];}
function counts(tasks){const rows=unique(tasks);return {work:rows.filter(t=>['doing','review'].includes(t.state)).length,ask:rows.filter(t=>t.state==='ask').length,ready:rows.filter(t=>t.state==='ready').length,failed:rows.filter(t=>t.state==='failed').length};}
function histogram(list,start,end){if(!Number.isFinite(start)||!Number.isFinite(end)||start>=end)throw Error('Start must be before end');const bins=Array.from({length:9},()=>({close:0,failed:0}));for(const e of new Map(list.map(e=>[e.attemptId,e])).values())if(e.time>=start&&e.time<end&&['close','failed'].includes(e.kind))bins[Math.min(8,Math.floor((e.time-start)/(end-start)*9))][e.kind]++;return bins;}
function summaryVisible(platform,view){return platform!=='windows'&&view==='full';}
function resumeFocus(saved){return typeof saved==='string'&&saved.trim()&&saved!=='off'?saved:null;}
function historyComplete(start,since){return Number.isFinite(since)&&start>=since;}
function confirm(state,id,revision){if(state.applied.includes(id))return 'duplicate';if(!state.proposal||state.proposal.id!==id||state.proposal.revision!==revision)return 'stale';state.applied.push(id);state.proposal=null;return 'accepted';}
function taskRow(t,global=false){return '<a class="task '+(global?'global':'')+'" href="'+esc(t.url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(t.project+' #'+t.number+' '+t.title+'; '+names[t.state])+'" data-tooltip="'+esc(t.title)+'"><span class="'+color(t.state)+'" aria-hidden="true">'+symbols[t.state]+'</span>'+(global?'<span class="num">'+esc(t.project)+'</span>':'')+'<span class="num">#'+t.number+'</span><span class="title">'+esc(t.title)+'</span></a>';}
// Pure model is exposed only for fixture tests; no service adapter in this prototype.
globalThis.taskqMenuModel={unique,counts,histogram,confirm,taskRow,serviceMenu,fixtures,remember,counter,events,summaryVisible,resumeFocus,historyComplete,addProjectMenu};
if(typeof document==='undefined')return;
const root=document.getElementById('tq-spec');
const platform=new URLSearchParams(location.search).get('platform')||(/Windows/i.test(navigator.userAgent)?'windows':'macos');
const state={request:'Work on taskq UI; only observe serverq.',savedFocus:'area-ui',focusQuestion:false,history:[],picker:false,view:'icon',font:16,period:'1d',paused:false,page:'home',draft:'',reply:'',proposal:null,applied:[],revision:0};
// Target bridge: Rust supplies state and validates actions; this adapter is fixture-only.
function restore(v){if(['icon','full'].includes(v.view))state.view=v.view;if([14,16,18,20].includes(v.font))state.font=v.font;if(v.period in periods)state.period=v.period;if(typeof v.paused==='boolean')state.paused=v.paused;for(const k of ['draft','reply','request','savedFocus'])if(typeof v[k]==='string'||v[k]===null)state[k]=v[k];}
function restorePrivate(v){if(!v)return;if(Array.isArray(v.history))state.history=v.history.filter(x=>typeof x==='string'&&x.trim()).slice(0,20);if(Array.isArray(v.custom)&&v.custom.length===2){try{histogram([], ...v.custom);state.custom=v.custom;}catch{}}if(Number.isInteger(v.revision)&&v.revision>=0)state.revision=v.revision;if(Array.isArray(v.applied))state.applied=v.applied.filter(x=>typeof x==='string');if(v.proposal&&typeof v.proposal.id==='string'&&Number.isInteger(v.proposal.revision))state.proposal=v.proposal;}
try{const saved=JSON.parse(localStorage.getItem('taskq-menu-fixture')||'{}');restore(saved);restorePrivate(saved);}catch{}
function save(){try{localStorage.setItem('taskq-menu-fixture',JSON.stringify({...state,history:state.history}));}catch{}}
function range(){return state.custom||[now-periods[state.period],now];}
function badge(full){const mode='<span class="mode '+(state.paused?'pause':'run')+'"></span>';if(!full)return '<span class="q" role="img" aria-label="taskq: '+(state.paused?'paused':'admission enabled')+'">'+mode+'</span>';const bins=histogram(events,...range()),complete=historyComplete(range()[0],historySince),peak=Math.max(1,...bins.map(b=>b.close+b.failed));return '<span class="micro '+(state.paused?'paused':'')+'" role="img" aria-label="In work 1, waiting for answer 1, ready 1, failed 1"><canvas class="digits" width="126" height="48" aria-hidden="true"></canvas><span class="spark">'+bins.map(b=>{const total=(b.close+b.failed)/peak*(28/3);const red=b.failed/peak*(28/3);return '<span class="bin"><i class="bad" style="height:'+red+'px"></i><i style="height:'+(total-red)+'px"></i></span>';}).join('')+'</span>'+(!complete?'<span class="history-unknown" aria-label="Incomplete history">?</span>':'')+(state.paused?'<span class="pause-overlay">'+badge(false)+'</span>':'')+'</span>';}
function draw(){const cols=['work','ask','ready'].map(c=>{const s=document.createElement('span');s.style.color='var(--'+c+')';root.appendChild(s);const value=getComputedStyle(s).color;s.remove();return value;});root.querySelectorAll('.digits').forEach(c=>{const ctx=c.getContext('2d');ctx.scale(3,3);ctx.font='600 16px ui-monospace, SFMono-Regular, Consolas, monospace';['1','1','1'].forEach((n,i)=>{const m=ctx.measureText(n),w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,left=i===0?0:i===1?(42-w)/2:42-w;ctx.fillStyle=cols[i];ctx.fillText(n,left+m.actualBoundingBoxLeft,15);});});}
function remember(history,text){text=text.trim();return text?[text,...history.filter(x=>x!==text)].slice(0,20):history;}
function counter(value,kind,label){return '<span class="counter '+(value>0?kind+' filled':'zero')+'" aria-label="'+esc(label+': '+value)+'" data-tooltip="'+esc(label)+'">'+value+'</span>';}
function countMarkup(c){return '<span class="counts">'+counter(c.work,'work','In work')+counter(c.ask,'ask','Waiting for answer')+counter(c.ready,'ready','Ready')+'</span>';}
function requestPicker(){if(!state.picker)return '';return '<div class="request-picker"><div class="row meta">Recent'+(state.history.length?'<button data-action="clear-history" aria-label="Clear history">Clear</button>':'')+'</div>'+(state.history.length?state.history.map((t,i)=>'<button class="recall" data-recall="'+i+'">'+esc(t)+'</button>').join(''):'<div class="meta body">No requests yet</div>')+'<div class="row meta">Commands</div>'+['What is blocking work?','Pause admission in taskq','Show failed reasons'].map((t,i)=>'<button class="recall" data-preset="'+i+'">'+esc(t)+'</button>').join('')+'</div>';}
function group(st,global){const ts=fixtures.filter(t=>t.state===st);if(!ts.length)return '';return '<details class="group"><summary><span class="'+color(st)+'">'+names[st]+'</span>'+counter(ts.length,color(st),names[st])+'</summary>'+ts.map(t=>taskRow(t,global)).join('')+'</details>';}
function addProjectMenu(){return '<details class="group"><summary>Add project · phase 4</summary><div class="body meta">Native folder picker and setup agent ship together in phase 4. Empty folder without taskq.json: new-project onboarding. Files without taskq.json: existing-project onboarding. Config and passing selftest: register, then offer service install. Failed selftest or old format: taskq.md section 9 cutover. Exact old-project marker remains open.</div><button disabled>Choose folder · phase 4</button></details>';}
function serviceMenu(project,newerVersion=project==='taskq'?'4.0.11':null){return '<details class="group"><summary>⚙ Project service <span class="meta">'+esc(project)+'</span></summary><div class="body meta">Fixture: native service actions are not connected. One host tray reads install/projects; observation also uses an installed service with focus off.</div>'+['Open log','Open folder','Restart','Stop until next logon'].map(label=>'<button class="project" disabled aria-label="'+esc(label+' — '+project+'; unavailable in this fixture')+'">'+label+'</button>').join('')+(newerVersion?'<button class="project" disabled>Update now - '+esc(newerVersion)+'</button><div class="body meta">Fixture status.json reports a verified newer version. Target action: request .taskq/update, then verify status readback.</div>':'')+'<details><summary>Uninstall service '+esc(project)+'</summary><div class="body meta">Remove this project service registration. Keep working files and other projects.</div><button class="project" disabled>Confirm uninstall '+esc(project)+'</button></details></details>';}
function render(){const c=counts(fixtures);root.querySelector('.trigger').innerHTML=badge(summaryVisible(platform,state.view));const menu=root.querySelector('.menu');menu.style.setProperty('--size',state.font+'px');menu.style.setProperty('--menu-width',(state.font>=18?360:320)+'px');if(state.page!=='home'){const tasks=fixtures.filter(t=>t.project===state.page);menu.innerHTML='<button data-action="back">‹ All projects</button><div class="row"><strong>'+esc(state.page)+'</strong>'+countMarkup(counts(tasks))+'</div><div class="body meta">'+(state.page==='taskq'?'area-ui · this host · '+(state.paused?'admission paused':'admission enabled'):'Observation only · installed service, focus off')+'</div>'+(['ask','failed','doing','review','ready','waiting','later'].map(st=>{const rows=tasks.filter(t=>t.state===st);return rows.length?'<div class="group"><div class="row meta"><span>'+names[st]+'</span>'+counter(rows.length,color(st),names[st])+'</div>'+rows.map(t=>taskRow(t)).join('')+'</div>':'';}).join('')||'<div class="body muted">No open tasks</div>')+(state.page==='taskq'?'<div class="group"><a class="row" href="https://github.com/alexkirs/taskq/issues" target="_blank" rel="noopener noreferrer">Board ↗</a><button data-action="pause">'+(state.paused?'Resume':'Pause')+' admission</button></div>'+serviceMenu(state.page):serviceMenu(state.page));}else{menu.innerHTML='<div class="options views" '+(platform==='windows'?'hidden':'')+'><button data-view="icon" aria-pressed="'+(state.view==='icon')+'">'+badge(false)+' Icon</button><button data-view="full" aria-pressed="'+(state.view==='full')+'">'+badge(true)+' Summary</button></div>'+ '<details><summary>✎ Ask taskq · phase 4 fixture</summary><div class="body"><label class="small-label" for="spec-request">Context: taskq · execution; serverq · observation</label><div class="composer"><textarea id="spec-request" rows="2" placeholder="What should taskq do?">'+esc(state.draft)+'</textarea><div class="composer-tools"><button data-action="history" aria-label="History and commands" aria-expanded="'+state.picker+'" data-tooltip="History and commands">↶</button><button data-action="send" aria-label="Send request" data-tooltip="Send">↑</button></div></div>'+requestPicker()+'<div class="answer" aria-live="polite">'+esc(state.reply)+'</div>'+(state.proposal?'<div class="options"><button data-action="confirm">Confirm</button><button data-action="clarify">Clarify</button></div>':'')+'</div></details>'+ '<details><summary>↳ Working on <span class="meta">1 project</span></summary><div class="body"><span class="small-label">You asked</span><p>'+esc(state.request||'Original request not recorded.')+'</p><span class="small-label">We understood</span><p>Execution: taskq, area-ui and this host. Observation: taskq and serverq, all tasks on every host.</p><span class="small-label">Currently applied · fixture data</span><p>'+ (state.paused?'taskq: no new tasks; current attempts continue.':'taskq: admission enabled.')+' serverq: installed service with focus off.</p><button data-action="scope">Change here…</button></div></details>'+group('ask',true)+group('failed',true)+'<div class="group"><div class="row meta">Projects</div><button class="project" data-project="taskq"><span>taskq</span>'+countMarkup(c)+'<span>›</span></button><button class="project" data-project="serverq"><span>serverq</span><span class="meta">Observation ›</span></button></div>'+ '<details class="group"><summary>▥ Cadence <span class="meta">'+(state.custom?'Custom interval':{'5m':'5 minutes','1h':'Hour','1d':'24 hours','1w':'7 days','1mo':'30 days'}[state.period])+'</span></summary><div class="options">'+Object.entries({'5m':'5 min','1h':'Hour','1d':'Day','1w':'Week','1mo':'Month'}).map(([key,label])=>'<button data-period="'+key+'" aria-pressed="'+(!state.custom&&state.period===key)+'">'+label+'</button>').join('')+'</div><div class="body meta">'+(historyComplete(range()[0],historySince)?'':'Incomplete history. ')+'History since '+new Date(historySince).toISOString()+'. Earlier history is unknown, not zero.</div><div class="body meta">Green: closed. Red: failed transitions. Oldest left; heights use a common peak scale.</div><details><summary>Custom interval</summary><div class="body"><label class="small-label">From (Asia/Bangkok)<input type="datetime-local" id="range-start" value="2026-10-12T21:32"></label><label class="small-label">To (Asia/Bangkok)<input type="datetime-local" id="range-end" value="2026-10-13T21:32"></label><button data-action="range">Show</button><div id="range-error" role="alert"></div></div></details></details>'+ '<button class="project" data-action="pause">'+(state.paused?'Resume':'Pause')+' admission in taskq</button><details><summary>Aa Text size <span class="meta">'+state.font+' px</span></summary><div class="options">'+[14,16,18,20].map(n=>'<button data-font="'+n+'" aria-pressed="'+(n===state.font)+'">'+n+'</button>').join('')+'</div></details>'+serviceMenu('taskq')+serviceMenu('serverq')+addProjectMenu()+'<div class="row meta">taskq · '+esc(platform)+' · fixture host</div>';}
if(state.focusQuestion)menu.innerHTML+='<div class="body" role="alert">Saved focus is missing. Choose labels before resuming.<button data-action="choose-focus">Use area-ui</button></div>';draw();}
function action(data){const el={dataset:data};const open=[...root.querySelectorAll('details')].map(d=>d.open);if(el.dataset.view)state.view=el.dataset.view;if(el.dataset.font)state.font=Number(el.dataset.font);if(el.dataset.project)state.page=el.dataset.project;if(el.dataset.period){state.period=el.dataset.period;delete state.custom;}const a=el.dataset.action;if(a==='back')state.page='home';if(a==='pause'){if(!state.paused)state.paused=true;else if(resumeFocus(state.savedFocus))state.paused=false;else state.focusQuestion=true;}if(a==='choose-focus'){state.savedFocus='area-ui';state.paused=false;state.focusQuestion=false;}if(a==='scope')state.draft='Pause admission in taskq';if(a==='history')state.picker=!state.picker;if(a==='clear-history')state.history=[];if(el.dataset.recall!==undefined||el.dataset.preset!==undefined){state.draft=el.dataset.recall!==undefined?state.history[Number(el.dataset.recall)]:['What is blocking work?','Pause admission in taskq','Show failed reasons'][Number(el.dataset.preset)];state.proposal=null;state.picker=false;}if(a==='send'){if(!state.draft.trim())return;state.history=remember(state.history,state.draft);state.picker=false;state.proposal=null;if(/pause/i.test(state.draft)){state.revision++;state.proposal={id:'demo-'+state.revision,revision:state.revision};state.reply='Proposal: pause admission in taskq. Current tasks continue; serverq observation is unchanged.';}else state.reply='Fixture: 1 question and 1 failed task in taskq. Request saved; no runtime is connected. M7 and Add project ship in phase 4.';}if(a==='confirm'&&state.proposal){const p=state.proposal;if(confirm(state,p.id,p.revision)==='accepted'){state.paused=true;state.reply='Applied only in the fixture: taskq paused. No service write or readback occurred.';}}if(a==='clarify'){state.proposal=null;state.reply='Clarify your request and send again.';}if(a==='range'){const start=Date.parse(root.querySelector('#range-start').value+'+07:00'),end=Date.parse(root.querySelector('#range-end').value+'+07:00');try{histogram(events,start,end);state.custom=[start,end];}catch(err){root.querySelector('#range-error').textContent=err.message;return;}}render();root.querySelectorAll('details').forEach((d,i)=>d.open=open[i]||false);if(a==='scope')root.querySelector('details').open=true;save();}
root.addEventListener('click',e=>{const el=e.target.closest('button');if(el)action(el.dataset);});
root.addEventListener('input',e=>{if(e.target.id==='spec-request'){state.draft=e.target.value;if(state.proposal){state.proposal=null;const confirmButton=root.querySelector('[data-action="confirm"]');if(confirmButton)confirmButton.disabled=true;}save();}});
root.querySelector('.trigger').addEventListener('click',()=>{const menu=root.querySelector('.menu');menu.hidden=!menu.hidden;root.querySelector('.trigger').setAttribute('aria-expanded',String(!menu.hidden));});
globalThis.taskqMenuBridge={state:()=>({...state}),receiveState(snapshot){restore(snapshot);restorePrivate(snapshot);render();},action};render();
