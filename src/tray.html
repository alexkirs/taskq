<!doctype html>
<!-- `taskq tray` popover (taskq.md § 4): docs/design/menu-prototype.html driven by the Rust bridge in tray.rs.
     Rust calls taskq.receive(state); actions go back through window.ipc.postMessage(JSON). -->
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#252930,#eceff2);--surface:light-dark(#f4f5f7,#292c32);--muted:light-dark(#626b77,#b4bdc8);--edge:light-dark(#d9dde2,#444951);--work:light-dark(#237862,#77cdb3);--ask:light-dark(#a35c29,#edb993);--ready:light-dark(#646d78,#c3c9d1);--failed:light-dark(#ae384c,#ef8996);background:var(--surface);-webkit-user-select:none;user-select:none;cursor:default}
html{scrollbar-width:thin}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:5px 7px}
a{color:inherit;text-decoration:none}
.menu{font-size:var(--size,16px);padding:6px 8px;overflow-x:hidden}
.row,summary{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:32px;padding:5px 4px;line-height:1.35}
summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) 8px;gap:6px}
summary>.meta,summary>.counter{justify-self:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
summary::-webkit-details-marker{display:none}
summary:after{content:'›';color:var(--muted);grid-column:3}
details[open]>summary:after{transform:rotate(90deg)}
.muted,.meta{color:var(--muted);font-size:max(12px,.85em)}
.group{border-top:1px solid var(--edge);margin-top:5px;padding-top:5px}
.body{padding:5px 4px;line-height:1.45;overflow-wrap:anywhere}
.task{display:grid;grid-template-columns:14px 4ch minmax(0,1fr);gap:7px;align-items:center;min-height:32px;padding:5px 4px;line-height:1.3;border-radius:4px}
.task.global{grid-template-columns:14px 6ch 4ch minmax(0,1fr)}
.task:hover,.task:focus-visible,.project:hover,.project:focus-visible{background:light-dark(#e3e7ec,#3a4049)}
.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project{width:100%;border:0;display:grid;grid-template-columns:minmax(0,1fr) auto 8px;gap:6px;align-items:center;text-align:left;min-height:33px;padding:5px 4px}
.project>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counts{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.counter{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:999px;font-size:max(12px,.8em);font-variant-numeric:tabular-nums;font-weight:500;line-height:1}
.counter.filled{background:color-mix(in srgb,currentColor 23%,var(--surface))}
.counter.zero{color:var(--muted);background:light-dark(#e4e7eb,#353a42)}
.work{color:var(--work)}.ask{color:var(--ask)}.ready{color:var(--ready)}.failed{color:var(--failed)}
.options{display:flex;gap:5px;flex-wrap:wrap;padding:4px}
.options button{flex:1;min-width:38px}
button[aria-pressed=true]{background:light-dark(#dce7e1,#354a40);border-color:var(--work)}
.periods button{flex:1 0 auto;padding:4px 6px}
.views button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;font-size:.9em}
.views img{height:18px}
button:disabled{color:var(--muted);opacity:.75}
.alert{color:var(--failed)}
.bars{display:flex;align-items:flex-end;gap:2px;height:28px;padding:0 4px}
.bars span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block}.bars i.k0{background:var(--work)}.bars i.k1{background:var(--failed)}.bars i.k2{background:var(--ask)}.bars i.k3{background:var(--ready)}
.bars span.unknown{border:1px dashed var(--edge);border-bottom:0}
.range{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;align-items:center;padding:4px}
.range input,.range select{font:inherit;font-size:.9em;min-width:0;color:inherit;background:none;border:1px solid var(--edge);border-radius:4px;padding:3px}
/* large text may wrap a title (menu.md M3); 14 and 16 px ellipsize */
.big .title{white-space:normal;overflow-wrap:anywhere}.big .task.global{grid-template-columns:12px 5ch 4ch minmax(0,1fr);gap:4px}
@media(pointer:coarse){.task,button,summary{min-height:44px}}
</style></head><body><div class="menu" role="menu"></div>
<script>
(()=>{
const names={doing:'In work',review:'Review',ask:'Waiting for answer',failed:'Failed',ready:'Ready',waiting:'Dependencies',later:'Later'};
const symbols={doing:'▶',review:'↻',ask:'?',failed:'!',ready:'○',waiting:'⋯',later:'Ⅱ'};
const color=st=>({doing:'work',review:'work',ask:'ask',failed:'failed',ready:'ready'}[st]||'muted');
const periods={'5m':'5 min','1h':'Hour','1d':'Day','1w':'7 days','1mo':'30 days',custom:'Custom'};
const zone=Intl.DateTimeFormat().resolvedOptions().timeZone;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const send=m=>window.ipc&&window.ipc.postMessage(JSON.stringify(m));
const menu=document.querySelector('.menu');
let S=null,page='home',homeScroll=0,ask=null,pending={},confirming=null,updating=null,draft=null,capedit=null,capmsg={};
// one task per board and issue: `issues` names provider, host and repo (M2)
function tasks(p){return p.tasks.map(t=>({...t,project:p.name,key:p.issues+'/'+t.n,url:p.issues+'/'+t.n}));}
function unique(ts){return [...new Map(ts.map(t=>[t.key,t])).values()];}
function counts(ts){ts=unique(ts);const n=f=>ts.filter(t=>f.includes(t.state)).length;return {work:n(['doing','review']),ask:n(['ask']),ready:n(['ready']),failed:n(['failed'])};}
function mode(p){return p.focus.length?'run':p.saved?'paused':'watch';}
function counter(v,kind,label){return '<span class="counter '+(v>0?kind+' filled':'zero')+'" aria-label="'+esc(label+': '+v)+'" title="'+esc(label)+'">'+v+'</span>';}
function countMarkup(c){return '<span class="counts">'+counter(c.work,'work','In work')+counter(c.ask,'ask','Waiting for answer')+counter(c.ready,'ready','Ready')+'</span>';}
function taskRow(t,global){return '<a class="task'+(global?' global':'')+'" href="'+esc(t.url)+'" data-url="'+esc(t.url)+'" role="menuitem" aria-label="'+esc(t.project+' #'+t.n+' '+t.title+'; '+names[t.state])+'" title="'+esc(t.title)+'"><span class="'+color(t.state)+'" aria-hidden="true">'+symbols[t.state]+'</span>'+(global?'<span class="num">'+esc(t.project)+'</span>':'')+'<span class="num">#'+esc(t.n)+'</span><span class="title">'+esc(t.title)+'</span></a>';}
function globalGroup(st,ts){ts=ts.filter(t=>t.state===st);return ts.length?'<details class="group"><summary><span class="'+color(st)+'">'+names[st]+'</span>'+counter(ts.length,color(st),names[st])+'</summary>'+ts.map(t=>taskRow(t,true)).join('')+'</details>':'';}
function age(s){return s<120?s+' s':s<7200?Math.round(s/60)+' min':s<172800?Math.round(s/3600)+' h':Math.round(s/86400)+' d';}
// service error and stale status.json are not failed tasks (M-A10)
function problem(p){const e=!p.alive?(p.age==null?'no status.json: service not running':'status.json '+age(p.age)+' old: service not running?'):p.error?'service error: '+p.error:'';return e?'<button class="project alert" data-a="log" data-root="'+esc(p.root)+'" title="'+esc(e)+'"'+(p.log?'':' disabled')+'><span>⚠ '+esc(p.name)+': '+esc(e)+'</span><span class="meta">'+(p.log?'Log':'')+'</span><span></span></button>':'';}
function modeText(p){return {run:'Admitting: '+p.focus.join(' '),paused:'Paused: running tasks finish, no new ones',watch:'Observation only: focus off'}[mode(p)];}
function admission(p){
  if(pending[p.root])return '<button class="project" disabled>'+esc(pending[p.root])+'…</button>';
  if(mode(p)==='run')return '<button class="project" data-a="pause" data-root="'+esc(p.root)+'">Pause admission in '+esc(p.name)+'</button>';
  if(p.saved)return '<button class="project" data-a="resume" data-root="'+esc(p.root)+'">Resume admission in '+esc(p.name)+'</button>';
  if(ask!==p.root)return '<button class="project" data-a="pick" data-root="'+esc(p.root)+'">Resume: choose labels…</button>';
  // no saved focus: offer labels, never `all` (M-A12)
  return '<div class="body meta">No saved focus. Admit tasks with one label:</div><div class="options">'+(p.labels.length?p.labels.map(l=>'<button data-a="focus" data-root="'+esc(p.root)+'" data-label="'+esc(l)+'">'+esc(l)+'</button>').join(''):'<span class="meta">No labels on open tasks: use taskq service focus</span>')+'</div>';
}
function service(p){return '<details class="group"><summary>⚙ Service <span class="meta">'+esc(p.name)+'</span></summary>'+
  (p.log?'<button class="project" data-a="log" data-root="'+esc(p.root)+'">Open log</button>':'<div class="body meta">Log path unknown</div>')+
  '<button class="project" data-a="folder" data-root="'+esc(p.root)+'">Open folder</button>'+
  '<button class="project" data-a="restart" data-root="'+esc(p.root)+'"'+(p.alive?'':' disabled title="Service not running"')+'>Restart</button>'+
  '<button class="project" data-a="stop" data-root="'+esc(p.root)+'">Stop until next logon</button>'+
  '<details><summary>Uninstall service '+esc(p.name)+'</summary><div class="body meta">Removes this project\'s service; files and other projects stay.</div><button class="project" data-a="uninstall" data-root="'+esc(p.root)+'">Confirm uninstall '+esc(p.name)+'</button></details></details>';}
// bins, range and since come from Rust (the icon draws the same); unknown is never drawn or counted as zero (M6)
function when(t,tz){return new Date(t*1000).toLocaleString([],{timeZone:tz==='UTC'?'UTC':undefined,dateStyle:'short',timeStyle:'short'})+' '+(tz==='UTC'?'UTC':zone);}
function local(t,tz){const d=new Date(t*1000);return (tz==='UTC'?d.toISOString():new Date(d-d.getTimezoneOffset()*60000).toISOString()).slice(0,16);}
function custom(){
  const d=draft;
  return '<div class="range"><label for="hs">Start</label><input id="hs" type="datetime-local" data-draft="start" value="'+esc(d.start)+'"><label for="he">End</label><input id="he" type="datetime-local" data-draft="end" value="'+esc(d.end)+'"><label for="hz">Time zone</label><select id="hz" data-draft="tz">'+[['local','Local ('+zone+')'],['UTC','UTC']].map(([v,l])=>'<option value="'+v+'"'+(d.tz===v?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div>'+
  (d.error?'<div class="body alert" role="alert">'+esc(d.error)+'</div>':'')+'<button class="project" data-a="range">Show [start, end)</button>';}
function history(){
  // series stack from the bottom in this order on one scale: the peak of the sum (M6)
  const H=S.history,n=H.bins.length,w=(H.end-H.start)/n,kinds=['closed','failed','ask','waiting'],tot=kinds.map((_,k)=>H.bins.reduce((a,b)=>a+b[k],0));
  const sum=b=>b.reduce((a,x)=>a+x,0),named=(b,sep)=>kinds.map((k,i)=>k+' '+b[i]).join(sep),peak=Math.max(1,...H.bins.map(sum)),none=S.projects.filter(p=>p.since==null).map(p=>p.name),part=none.length>0||H.since>H.start;
  const note=H.since==null?'No history yet: unknown, not zero.':[H.since>H.start?'Incomplete: history since '+when(H.since,H.tz)+'; earlier is unknown, not zero.':'',none.length?'No history in '+none.join(', ')+'.':''].join(' ').trim();
  const total=H.since==null?kinds.map(k=>k+' —').join(' · '):named(tot,' · ')+(part?' · incomplete':'');
  return '<details class="group hist"><summary>▥ History <span class="meta">'+periods[S.period]+' · '+total+'</span></summary><div class="options periods">'+Object.entries(periods).map(([k,l])=>'<button data-set="period" data-v="'+k+'" aria-pressed="'+(S.period===k||k==='custom'&&draft!=null)+'">'+l+'</button>').join('')+'</div>'+
  (draft?custom():'')+'<div class="body meta">['+esc(when(H.start,H.tz))+', '+esc(when(H.end,H.tz))+') · peak '+peak+'</div>'+
  '<div class="bars" role="img" aria-label="'+esc(named(tot,', ')+'; '+n+' equal bins, oldest left'+(note?'; '+note:''))+'">'+H.bins.map((b,i)=>{const t=H.start+i*w,u=H.since==null||t+w<=H.since;
    return '<span'+(u?' class="unknown" title="unknown"':' title="'+esc(when(t,H.tz)+': '+named(b,', '))+'"')+'>'+[3,2,1,0].map(k=>'<i class="k'+k+'" style="height:'+b[k]/peak*100+'%"></i>').join('')+'</span>';}).join('')+'</div>'+(note?'<div class="body meta">'+esc(note)+'</div>':'')+'</details>';}
// `Update now` only for a newer version in status.json; success only once a status.json reads it back (M9)
function update(){
  const up=S.projects.find(p=>p.update&&p.update!==p.version);
  if(updating&&S.projects.some(p=>p.version===updating.v))return '<div class="row meta">Updated to '+esc(updating.v)+': read from status.json</div>';
  if(updating&&S.now-updating.at<300)return '<button class="project" disabled>Updating to '+esc(updating.v)+'…</button>';
  return (updating?'<div class="row alert">Update to '+esc(updating.v)+' not confirmed: see the log</div>':'')+(up?'<button class="project" data-a="update" data-root="'+esc(up.root)+'" data-v="'+esc(up.update)+'">Update now to '+esc(up.update)+'</button>':'');}
// the command over all projects names each one and its effect before acting (M5, M-A4)
function bulk(run,held){
  const pausing=run.length>0,state=p=>({run:pausing?'pause':'admitting, unchanged',paused:pausing?'paused, unchanged':'resume',watch:'observation, unchanged'}[mode(p)]);
  if(confirming)return '<div class="body" role="alert">'+(pausing?'Pause admission? Running tasks finish.':'Resume admission?')+'<br>'+S.projects.map(p=>esc(p.name)+': '+state(p)).join('<br>')+'</div><div class="options"><button data-a="'+(pausing?'pause-all':'resume-all')+'">Confirm</button><button data-a="cancel">Cancel</button></div>';
  return run.length?'<button class="project" data-a="confirm">Pause all…</button>':held.length?'<button class="project" data-a="confirm">Resume all…</button>':'';}
function home(){
  const all=S.projects.flatMap(tasks),c=counts(all),run=S.projects.filter(p=>mode(p)==='run'),held=S.projects.filter(p=>mode(p)==='paused');
  let h='';
  if(S.platform==='macos')h+='<div class="options views">'+[['icon','Icon'],['full','Summary']].map(([v,l])=>'<button data-set="view" data-v="'+v+'" aria-pressed="'+(S.view===v)+'"><img alt="" src="'+S.icons[v]+'">'+l+'</button>').join('')+'</div>';
  h+='<details><summary>↳ Scope <span class="meta">'+S.projects.length+' project'+(S.projects.length===1?'':'s')+' · in work '+c.work+' · ask '+c.ask+' · ready '+c.ready+'</span></summary><div class="body">'+S.projects.map(p=>'<div><strong>'+esc(p.name)+'</strong> <span class="meta">'+esc(modeText(p))+'</span></div><div class="meta">You asked: '+esc(p.request||'not recorded')+'</div>').join('')+'</div></details>';
  h+=S.projects.map(problem).join('');
  h+=globalGroup('ask',unique(all))+globalGroup('failed',unique(all));
  h+='<div class="group"><div class="row meta">Projects</div>'+(S.projects.length?S.projects.map(p=>'<button class="project" data-page="'+esc(p.root)+'" role="menuitem"><span title="'+esc(p.name)+'">'+esc(p.name)+(mode(p)==='run'?'':' <span class="meta">'+(mode(p)==='paused'?'Ⅱ':'observation')+'</span>')+'</span>'+countMarkup(counts(tasks(p)))+'<span aria-hidden="true">›</span></button>').join(''):'<div class="body meta">No projects: run taskq service install in one</div>')+'</div>';
  h+=history();
  if(held.length&&run.length)h+='<div class="row meta">Paused '+held.length+' of '+(held.length+run.length)+': '+esc(held.map(p=>p.name).join(', '))+'</div>';
  h+=bulk(run,held);
  h+='<details><summary>Aa Text size <span class="meta">'+S.font+' px</span></summary><div class="options">'+[14,16,18,20].map(n=>'<button data-set="font" data-v="'+n+'" aria-pressed="'+(n===S.font)+'">'+n+'</button>').join('')+'</div></details>';
  h+=S.projects.map(service).join('');
  const vs=[...new Set(S.projects.map(p=>p.version).filter(Boolean))];
  return h+update()+'<div class="row meta">taskq '+esc(vs.join(', ')||'unknown')+(vs.length===1&&vs[0]===S.version?'':' · tray '+esc(S.version))+' · '+esc(S.host)+'</div>';}
// Capacity (taskq.md § 4): this host's used/limit and load gate; an edit writes only after a confirm naming old → new
const rtName=rt=>rt.charAt(0).toUpperCase()+rt.slice(1);
function gateText(p){
  const c=p.capacity;
  if(!c)return 'Unknown: service has no capacity status';
  if(p.age==null||p.age>60)return 'Unknown: status '+(p.age==null?'missing':age(p.age)+' old');
  if(c.load_gate&&c.load_gate.enabled&&c.sample_age_seconds!=null&&c.sample_age_seconds+p.age>60)return 'Unknown: sample '+age(c.sample_age_seconds+p.age)+' old';
  const rs=c.reasons||[];
  if(c.gate==='off')return 'Off';
  if(c.gate==='open')return 'Ready';
  if(c.gate==='held')return 'Waiting: '+rs.map(r=>({cpu:'CPU',memory:'memory'}[r.code]||'recovery')).join(', ');
  return 'Unknown: '+rs.map(r=>r.text).join('; ');}
function capRts(saved){return [...new Set(['claude','codex',...Object.keys(saved.limits||{})])];}
function capChanges(saved,d){
  const g=saved.load_gate,out=capRts(saved).filter(rt=>String(saved.limits[rt]??'')!==d[rt]).map(rt=>rtName(rt)+' '+(saved.limits[rt]??'none')+' → '+d[rt]);
  if(g.enabled!==d.enabled)out.push('Load gate '+(g.enabled?'on':'off')+' → '+(d.enabled?'on':'off'));
  if(String(g.cpu_max)!==d.cpu_max)out.push('CPU ceiling '+g.cpu_max+' → '+d.cpu_max+' %');
  if(String(g.memory_min)!==d.memory_min)out.push('Memory floor '+g.memory_min+' → '+d.memory_min+' %');
  return out;}
function capCheck(saved,d){
  const n=(v,lo,hi)=>/^\d+$/.test(v)&&Number(v)>=lo&&Number(v)<=hi;
  for(const rt of capRts(saved))if(!n(d[rt],0,4294967295))return rtName(rt)+': an integer 0 or more';
  if(!n(d.cpu_max,10,100))return 'CPU ceiling: an integer 10..100';
  if(!n(d.memory_min,1,95))return 'Memory floor: an integer 1..95';
  return capChanges(saved,d).length?'':'No change';}
function capSet(saved,d){
  const g=saved.load_gate,set={limits:{}};
  for(const rt of capRts(saved))if(String(saved.limits[rt]??'')!==d[rt])set.limits[rt]=Number(d[rt]);
  if(g.enabled!==d.enabled||String(g.cpu_max)!==d.cpu_max||String(g.memory_min)!==d.memory_min)Object.assign(set,{enabled:d.enabled,cpu_max:Number(d.cpu_max),memory_min:Number(d.memory_min)});
  return set;}
function capacity(p){
  const c=p.capacity,ok=!!c&&p.age!=null&&p.age<=60,saved=p.cap_saved||{},lim=ok?c.limits:(saved.limits||{}),g=gateText(p),m=capmsg[p.root];
  const rts=[...new Set([...Object.keys(lim),...Object.keys(ok?c.used:{})])];
  let h='<details class="group"><summary>▤ Capacity <span class="meta">'+esc((p.cap_host||'this host')+' · Load gate: '+g)+'</span></summary>';
  h+=rts.map(rt=>{const u=ok?(c.used[rt]||0):'?',l=lim[rt]||0;return '<div class="row" aria-label="'+esc(rtName(rt)+': '+u+' used of '+l)+'"><span>'+esc(rtName(rt))+'</span><span>'+u+'/'+l+'</span></div>';}).join('');
  h+='<div class="row"><span>Load gate</span><span class="meta">'+esc(g)+'</span></div>';
  if(ok&&c.cpu_percent!=null&&c.memory_available_percent!=null)h+='<div class="row meta">CPU '+Math.round(c.cpu_percent)+' % · available memory '+Math.round(c.memory_available_percent)+' %</div>';
  if(saved.error)return h+'<div class="body alert">Config: '+esc(saved.error)+'</div></details>';
  const same=ok&&JSON.stringify(c.limits)===JSON.stringify(saved.limits)&&JSON.stringify(c.load_gate)===JSON.stringify(saved.load_gate);
  if(m&&m.startsWith('Error'))h+='<div class="body alert" role="alert">'+esc(m)+'</div>';
  else if(m&&same&&m!=='Saving')h+='<div class="body meta">Applied: read from status.json</div>';
  else if(m||(ok&&!same))h+='<div class="body meta">Saved; waiting for service</div>';
  const d=capedit&&capedit.root===p.root?capedit:null;
  if(!d)return h+'<button class="project" data-a="capedit" data-root="'+esc(p.root)+'">Edit limits</button></details>';
  if(d.confirm)return h+'<div class="body" role="alert">Apply to '+esc(p.name)+' on '+esc(p.cap_host)+'?<br>'+capChanges(saved,d).map(esc).join('<br>')+'<br>Running tasks continue.</div><div class="options"><button data-a="capconfirm" data-root="'+esc(p.root)+'">Confirm</button><button data-a="capcancel">Cancel</button></div></details>';
  const num=(id,k,label)=>'<label for="'+esc(id)+'">'+label+'</label><input id="'+esc(id)+'" type="number" inputmode="numeric" step="1" data-cap="'+esc(k)+'" value="'+esc(d[k])+'">';
  return h+'<div class="range">'+capRts(saved).map(rt=>num('cap-'+rt,rt,esc(rtName(rt)))).join('')+'<label for="cap-en">Load gate</label><input id="cap-en" type="checkbox" role="switch" data-cap="enabled"'+(d.enabled?' checked':'')+'>'+
    num('cap-cpu','cpu_max','CPU ceiling %')+num('cap-mem','memory_min','Memory floor %')+'</div>'+(d.error?'<div class="body alert" role="alert">'+esc(d.error)+'</div>':'')+
    '<div class="options"><button data-a="capapply" data-root="'+esc(p.root)+'">Apply…</button><button data-a="capcancel">Cancel</button></div></details>';}
function project(p){
  const ts=tasks(p);
  return '<button data-a="back">‹ All projects</button><div class="row"><strong title="'+esc(p.root)+'">'+esc(p.name)+'</strong>'+countMarkup(counts(ts))+'</div><div class="body meta">'+esc(modeText(p))+'</div>'+problem(p)+
  (['ask','failed','doing','review','ready','waiting','later'].map(st=>{const r=ts.filter(t=>t.state===st);return r.length?'<div class="group"><div class="row meta"><span>'+names[st]+'</span>'+counter(r.length,color(st),names[st])+'</div>'+r.map(t=>taskRow(t)).join('')+'</div>':'';}).join('')||'<div class="body muted">No open tasks</div>')+
  '<div class="group">'+(p.issues?'<a class="project" href="'+esc(p.issues)+'" data-url="'+esc(p.issues)+'"><span>Board ↗</span><span></span><span></span></a>':'')+admission(p)+'</div>'+capacity(p)+service(p);}
function render(){
  if(!S)return;
  const open=[...menu.querySelectorAll('details')].map(d=>d.open),p=S.projects.find(p=>p.root===page);
  if(!p)page='home';
  document.documentElement.style.colorScheme=S.theme||'light dark';
  menu.style.setProperty('--size',S.font+'px');menu.classList.toggle('big',S.font>=18);
  menu.innerHTML=p?project(p):home();
  menu.querySelectorAll('details').forEach((d,i)=>d.open=open[i]||false);
  if(S.page!==undefined)menu.querySelectorAll('.hist').forEach(d=>d.open=true);
  send({a:'size',w:S.font>=18?360:320,h:menu.scrollHeight});}
window.taskq={receive(s){
  if(s.capmsg){capmsg[s.capmsg.root]=s.capmsg.text;render();return;}
  for(const p of s.projects){const was=S&&S.projects.find(q=>q.root===p.root);if(pending[p.root]&&was&&mode(was)!==mode(p))delete pending[p.root];}
  S=s;
  // snapshot mode names the page
  if(s.page!==undefined){page=s.page;pending={};}
  // a tick does not take the caret out of the range fields
  if(document.activeElement&&(document.activeElement.dataset.draft||document.activeElement.dataset.cap))return;
  render();
},model:{unique,counts,mode,gateText,capChanges,capCheck,capSet}};
menu.addEventListener('click',e=>{
  const a=e.target.closest('a[data-url]');if(a){e.preventDefault();send({a:'open',url:a.dataset.url});return;}
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.page){homeScroll=document.scrollingElement.scrollTop;page=d.page;ask=null;render();document.scrollingElement.scrollTop=0;return;}
  if(d.a==='back'){page='home';render();document.scrollingElement.scrollTop=homeScroll;return;}
  if(d.set==='period'&&d.v==='custom'){const H=S.history;draft={start:local(H.start,H.tz),end:local(H.end,H.tz),tz:H.tz,error:''};render();return;}
  if(d.set){S[d.set]=d.set==='font'?Number(d.v):d.v;if(d.set==='period')draft=null;send({a:'set',[d.set]:S[d.set]});render();return;}
  if(d.a==='range'){
    const t=v=>v?Date.parse(draft.tz==='UTC'?v+'Z':v)/1000:NaN,a=t(draft.start),z=t(draft.end);
    draft.error=!(a<z)?'Refused: start must be before end.':'';
    if(!draft.error){S.period='custom';send({a:'set',period:'custom',start:a,end:z,tz:draft.tz});draft=null;}
    render();return;}
  if(d.a==='confirm'||d.a==='cancel'){confirming=d.a==='confirm';render();return;}
  if(d.a==='update'){updating={v:d.v,at:S.now};}
  if(d.a==='pick'){ask=d.root;render();return;}
  const cp=S.projects.find(p=>p.root===d.root),sv=cp&&cp.cap_saved;
  if(d.a==='capedit'){const g=sv.load_gate;capedit={root:d.root,enabled:g.enabled,cpu_max:String(g.cpu_max),memory_min:String(g.memory_min),confirm:false,error:''};for(const rt of capRts(sv))capedit[rt]=String(sv.limits[rt]??0);render();return;}
  if(d.a==='capcancel'){capedit=null;render();return;}
  if(d.a==='capapply'){capedit.error=capCheck(sv,capedit);capedit.confirm=!capedit.error;render();return;}
  if(d.a==='capconfirm'){send({a:'capacity',root:d.root,set:capSet(sv,capedit),expect:sv});capmsg[d.root]='Saving';capedit=null;render();return;}
  if(d.a==='pause-all'||d.a==='resume-all'){confirming=null;for(const p of S.projects.filter(p=>mode(p)===(d.a==='pause-all'?'run':'paused'))){pending[p.root]=d.a==='pause-all'?'Pausing':'Resuming';send({a:d.a.slice(0,-4),root:p.root});}render();return;}
  if(d.a==='pause'||d.a==='resume'||d.a==='focus'){pending[d.root]=d.a==='pause'?'Pausing':'Resuming';ask=null;}
  if(d.a)send({a:d.a,root:d.root,label:d.label});render();});
menu.addEventListener('input',e=>{const k=e.target.dataset.draft,c=e.target.dataset.cap;if(k&&draft)draft[k]=e.target.value;if(c&&capedit)capedit[c]=e.target.type==='checkbox'?e.target.checked:e.target.value;});
menu.addEventListener('focusout',e=>{const f=x=>x&&x.dataset&&(x.dataset.draft||x.dataset.cap);if(f(e.target))setTimeout(()=>{if(!f(document.activeElement))render();});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')send({a:'hide'});});
send({a:'ready'});
})();
</script></body></html>
