<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#243039,#eef2f5);--surface:light-dark(#fafbfc,#252b32);--muted:light-dark(#59636e,#b9c3cd);--edge:light-dark(#dce0e5,#46505b);--work:light-dark(#246f59,#8dd2b8);--ask:light-dark(#955525,#edbc96);--ready:light-dark(#5d6874,#c8d0d9);--failed:light-dark(#a6324b,#ee96a5);background:var(--surface);-webkit-user-select:none;user-select:none;cursor:default}

<script>
(()=>{
const names={doing:'In work',review:'Review',ask:'Waiting for answer',failed:'Failed',ready:'Ready',waiting:'Dependencies',later:'Later'};
const color=st=>({doing:'work',review:'work',ask:'ask',failed:'failed',ready:'ready'}[st]||'muted');
const periods={'5m':'5 min','1h':'Hour','1d':'Day','1w':'7 days','1mo':'30 days',custom:'Custom'};
const zone=Intl.DateTimeFormat().resolvedOptions().timeZone;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const send=m=>window.ipc&&window.ipc.postMessage(JSON.stringify(m));
const menu=document.querySelector('.menu');
let aiText=null,aiMenu=false,aiConfirm=null,addConfirm=false;
let S=null,page='home',taskFilter=null,working=null,workCard=null,homeScroll=0,ask=null,pending={},confirming=null,updating=null,draft=null;
// Task answers: the native bridge owns credentials and canonical dispatch/readback.
const answerRequests=new Map(),answerCards=new Map();
function answerCapability(board){const p=S&&S.projects.find(p=>p.issues===board);return {answer:!!p&&p.alive&&p.complete!==false,reason:'Project status is unavailable or stale; check the board'};}
function answerSend(board,op){
  const p=S&&S.projects.find(p=>p.issues===board);
  if(!p)return Promise.resolve({state:'rejected',reason:'Project is no longer registered'});
  const key=p.root+'#'+op.id;
  if(answerRequests.has(key))return answerRequests.get(key).promise;
  let resolve;
  const promise=new Promise(r=>resolve=r);
  const timer=setTimeout(()=>{answerRequests.delete(key);resolve({state:'unknown',reason:'No bridge receipt received',next:'Check delivery with the same operation'});},30000);
  answerRequests.set(key,{promise,resolve,timer});
  send({a:'answer',root:p.root,board,op});
  return promise;
}
function answerReceipt(r){
  const key=r.root+'#'+r.id,request=answerRequests.get(key);
  if(!request)return;
  clearTimeout(request.timer);answerRequests.delete(key);
  request.resolve({state:r.state,reason:r.reason,next:r.next});
  setTimeout(()=>send({a:'size',w:S.font>=18?360:320,h:menu.scrollHeight}),0);
}
function answerSlot(t){return t.question||t.card||answerCards.has(t.key)?'<div data-answer="'+esc(t.key)+'"></div>':'';}
function mountAnswers(){
  for(const slot of menu.querySelectorAll('[data-answer]')){
    const t=unique(S.projects.flatMap(tasks)).find(t=>t.key===slot.dataset.answer);
    if(!t)continue;
    let card=answerCards.get(t.key);
    if(!card){const el=document.createElement('div');card={el,ui:TaskqAnswerCard.mount(el,{capability:answerCapability,send:answerSend})};answerCards.set(t.key,card);}
    slot.append(card.el);
    const p=S.projects.find(p=>p.issues+'/'+t.n===t.key);
    card.ui.update([{board:p.issues,row:t}]);
  }
  const keys=new Set(S.projects.flatMap(tasks).map(t=>t.key));
  for(const key of answerCards.keys())if(!keys.has(key))answerCards.delete(key);
}
// one task per board and issue: `issues` names provider, host and repo (M2)
function tasks(p){return p.tasks.map(t=>({...t,project:p.name,key:p.issues+'/'+t.n,url:t.url||p.issues+'/'+t.n}));}
function blockProject(p){return {id:p.root,name:p.name,board:{url:p.issues,kind:p.board_kind},complete:p.complete===true,closed:p.closed,tasks:tasks(p)};}
function unique(ts){return [...new Map(ts.map(t=>[t.key,t])).values()];}
function counts(ts){ts=unique(ts);const n=f=>ts.filter(t=>f.includes(t.state)).length;return {work:n(['doing','review']),ask:n(['ask']),ready:n(['ready']),failed:n(['failed'])};}
function mode(p){return p.focus.length?'run':p.saved?'paused':'watch';}
function counter(v,kind,label){return '<span class="counter '+(v>0?kind+' filled':'zero')+'" aria-label="'+esc(label+': '+v)+'" title="'+esc(label)+'">'+v+'</span>';}
// an incomplete or stale snapshot has unknown counts, never zero (§ 4)
function known(ps){return ps.every(p=>p.complete!==false);}
function taskRow(t,global){const p=S.projects.find(p=>p.issues+'/'+t.n===t.key);return TaskqProjectBlocks.task(blockProject(p),t,global)+answerSlot(t);}
function globalGroup(st,ts){ts=ts.filter(t=>t.state===st);return ts.length?'<details class="group"><summary><span class="'+color(st)+'">'+names[st]+'</span>'+counter(ts.length,color(st),names[st])+'</summary>'+ts.map(t=>taskRow(t,true)).join('')+'</details>':'';}
function age(s){return s<120?s+' s':s<7200?Math.round(s/60)+' min':s<172800?Math.round(s/3600)+' h':Math.round(s/86400)+' d';}
// service error and stale status.json are not failed tasks (M-A10)
function problem(p){const e=!p.alive?(p.age==null?'no status.json: service not running':'status.json '+age(p.age)+' old: service not running?'):p.error?'service error: '+p.error:'';return e?'<button class="project alert" data-a="log" data-root="'+esc(p.root)+'" title="'+esc(e)+'"'+(p.log?'':' disabled')+'><span>⚠ '+esc(p.name)+': '+esc(e)+'</span><span class="meta">'+(p.log?'Log':'')+'</span><span></span></button>':'';}
function modeText(p){return {run:'Admitting: '+p.focus.join(' '),paused:'Paused: running tasks finish, no new ones',watch:'Observation only: focus off'}[mode(p)];}
function admission(p){
  if(pending[p.root])return '<button class="project" disabled>'+esc(pending[p.root])+'…</button>';
  if(mode(p)==='run')return '<button class="project" data-a="pause" data-root="'+esc(p.root)+'">Pause admission in '+esc(p.name)+'</button>';
  if(p.saved)return '<button class="project" data-a="resume" data-root="'+esc(p.root)+'">Resume admission in '+esc(p.name)+'</button>';
  if(ask!==p.root)return '<button class="project" data-a="pick" data-root="'+esc(p.root)+'">Resume: choose labels…</button>';
  // no saved focus: offer labels, never `all` (M-A12)
  return '<div class="body meta">No saved focus. Admit tasks with one label:</div><div class="options">'+(p.labels.length?p.labels.map(l=>'<button data-a="focus" data-root="'+esc(p.root)+'" data-label="'+esc(l)+'">'+esc(l)+'</button>').join(''):'<span class="meta">No labels on open tasks: use taskq service focus</span>')+'</div>';
}
function incident(p,top=false){
  const i=p.incident,local=i&&['local','unsupported-auth'].includes(i.state);
  if(top&&(!p.alive||!local))return '';
  const line=!p.alive?'Incidents: unknown ('+(p.age==null?'no status.json':'stale status.json')+')':p.incident_line||'Incidents: unknown (no incident status)';
  const text=p.alive&&i&&(i.url||i.path)?line.replace(' · '+(i.url||i.path),''):line;
  let h='<div class="body '+(top?'incident-attention':'meta')+'" title="'+esc(line)+'">'+esc((top?p.name+': ':'')+text)+'</div>';
  if(p.alive&&local)h+='<div class="options"><button data-a="incident-report" data-root="'+esc(p.root)+'"'+(i.path?'':' disabled')+'>Open report</button><button data-a="incident-manual" data-root="'+esc(p.root)+'">Report manually ↗</button></div>';
  if(p.alive&&i&&i.state==='sent'&&i.url)h+='<a class="project" href="'+esc(i.url)+'" data-url="'+esc(i.url)+'">Open incident ↗</a>';
  return h;
}
function incidentNotice(p){return p.incident_notice?'<details class="group incident-notice"><summary>Incident reports: notice <span class="meta">'+esc(p.name)+'</span></summary><div class="body">Reports stay local until you choose.</div><div class="body meta">Destination: '+esc(p.incident_repo)+' on GitHub (public). Posting account: unknown here; verify the github.com account used by this project before enabling.</div><div class="body meta">Only sanitized fault codes, fingerprint, report ID, release, revision, contract, board/runtime/OS classes, source site and evidence codes are sent. No project, task, user, session, token or raw error text.</div><div class="body meta">Offline or unsupported login: keep a local JSON report. After confirming the destination and posting account, set incident_reports to true in taskq.json to enable, or false to opt out. TASKQ_INCIDENT_REPORTS=off also disables reporting.</div></details>':'';}
function service(p){return '<details class="group service"><summary>⚙ Service <span class="meta">'+esc(p.name)+'</span></summary>'+incident(p)+
  (p.log?'<button class="project" data-a="log" data-root="'+esc(p.root)+'">Open log</button>':'<div class="body meta">Log path unknown</div>')+
  '<button class="project" data-a="folder" data-root="'+esc(p.root)+'">Open folder</button>'+
  '<button class="project" data-a="restart" data-root="'+esc(p.root)+'"'+(p.alive?'':' disabled title="Service not running"')+'>Restart</button>'+
  '<button class="project" data-a="stop" data-root="'+esc(p.root)+'">Stop until next logon</button>'+
  '<details><summary>Uninstall service '+esc(p.name)+'</summary><div class="body meta">Removes this project\'s service; files and other projects stay.</div><button class="project" data-a="uninstall" data-root="'+esc(p.root)+'">Confirm uninstall '+esc(p.name)+'</button></details></details>';}
// bins, range and since come from Rust (the icon draws the same); unknown is never drawn or counted as zero (M6)
function when(t,tz){return new Date(t*1000).toLocaleString([],{timeZone:tz==='UTC'?'UTC':undefined,dateStyle:'short',timeStyle:'short'})+' '+(tz==='UTC'?'UTC':zone);}
function local(t,tz){const d=new Date(t*1000);return (tz==='UTC'?d.toISOString():new Date(d-d.getTimezoneOffset()*60000).toISOString()).slice(0,16);}
function custom(){
  const d=draft;
  return '<div class="range"><label for="hs">Start</label><input id="hs" type="datetime-local" data-draft="start" value="'+esc(d.start)+'"><label for="he">End</label><input id="he" type="datetime-local" data-draft="end" value="'+esc(d.end)+'"><label for="hz">Time zone</label><select id="hz" data-draft="tz">'+[['local','Local ('+zone+')'],['UTC','UTC']].map(([v,l])=>'<option value="'+v+'"'+(d.tz===v?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div>'+
  (d.error?'<div class="body alert" role="alert">'+esc(d.error)+'</div>':'')+'<button class="project" data-a="range">Show [start, end)</button>';}
function history(){
  // series stack from the bottom in this order on one scale: the peak of the sum (M6)
  const H=S.history,n=H.bins.length,w=(H.end-H.start)/n,kinds=['closed','failed','ask','waiting'],tot=kinds.map((_,k)=>H.bins.reduce((a,b)=>a+b[k],0));
  const sum=b=>b.reduce((a,x)=>a+x,0),named=(b,sep)=>kinds.map((k,i)=>k+' '+b[i]).join(sep),peak=Math.max(1,...H.bins.map(sum)),none=S.projects.filter(p=>p.since==null).map(p=>p.name),part=none.length>0||H.since>H.start;
  const note=H.since==null?'No history yet: unknown, not zero.':[H.since>H.start?'Incomplete: history since '+when(H.since,H.tz)+'; earlier is unknown, not zero.':'',none.length?'No history in '+none.join(', ')+'.':''].join(' ').trim();
  const total=H.since==null?kinds.map(k=>k+' —').join(' · '):named(tot,' · ')+(part?' · incomplete':'');
  return '<details class="group hist"><summary>▥ History <span class="meta">'+periods[S.period]+' · '+total+'</span></summary><div class="options periods">'+Object.entries(periods).map(([k,l])=>'<button data-set="period" data-v="'+k+'" aria-pressed="'+(S.period===k||k==='custom'&&draft!=null)+'">'+l+'</button>').join('')+'</div>'+
  (draft?custom():'')+'<div class="body meta">['+esc(when(H.start,H.tz))+', '+esc(when(H.end,H.tz))+') · peak '+peak+'</div>'+
  '<div class="bars" role="img" aria-label="'+esc(named(tot,', ')+'; '+n+' equal bins, oldest left'+(note?'; '+note:''))+'">'+H.bins.map((b,i)=>{const t=H.start+i*w,u=H.since==null||t+w<=H.since;
    return '<span'+(u?' class="unknown" title="unknown"':' title="'+esc(when(t,H.tz)+': '+named(b,', '))+'"')+'>'+[3,2,1,0].map(k=>'<i class="k'+k+'" style="height:'+b[k]/peak*100+'%"></i>').join('')+'</span>';}).join('')+'</div>'+(note?'<div class="body meta">'+esc(note)+'</div>':'')+'</details>';}
// `Update now` only for a newer version in status.json; success only once a status.json reads it back (M9)
function update(){
  const up=S.projects.find(p=>p.update&&p.update!==p.version);
  if(updating&&S.projects.some(p=>p.version===updating.v))return '<div class="row meta">Updated to '+esc(updating.v)+': read from status.json</div>';
  if(updating&&S.now-updating.at<300)return '<button class="project" disabled>Updating to '+esc(updating.v)+'…</button>';
  return (updating?'<div class="row alert">Update to '+esc(updating.v)+' not confirmed: see the log</div>':'')+(up?'<button class="project" data-a="update" data-root="'+esc(up.root)+'" data-v="'+esc(up.update)+'">Update now to '+esc(up.update)+'</button>':'');}
// AI requests (menu.md M7): one input, `↶` history and commands, the newest request with its answer
const aiStates={queued:'Queued',running:'Working…',clarify:'Needs your answer',proposal:'Needs your confirmation',applying:'Applying…',applied:'Applied: read back',result:'Done',refuse:'Refused',failed:'AI request not done','apply failed':'Not applied'};
const aiCommands=['What needs my answer?','What is running now?','Why is nothing starting?','Pause all projects'];
// every value the command gets is shown before confirm
function opText(o){return [o.project+':',o.op,o.task?'#'+o.task:'',(o.labels||[]).join(' '),o.title?'"'+o.title+'"':'',o.goal?'goal: '+o.goal:'',(o.acceptance||[]).map(x=>'acceptance: '+x).join('; '),o.request?'request: '+o.request:'',o.option?'option '+o.option:'',o.text||''].filter(Boolean).join(' ');}
// R6 item 7 `Next: 1 <action> ★ · 2 <action>` as the last line: numbered 1..n in order, at most one ★; else null (raw text only)
function nextActions(t){
  const l=String(t||'').trim().split('\n').pop().trim();if(!l.startsWith('Next: '))return null;
  const xs=l.slice(6).split(' · ').map((s,i)=>{const m=/^(\d+) (\S.*?)( ★)?$/.exec(s.trim());return m&&+m[1]===i+1?{n:m[1],text:s.trim(),rec:!!m[3]}:null;});
  return xs.every(Boolean)&&xs.filter(x=>x.rec).length<2?xs:null;}
function ai(){
  const A=S.ai,r=A.request,an=r&&r.answer||{},st=r?(an.state||'queued'):null,bad=['failed','refuse','apply failed'].includes(st);
  let h='<div class="group"><div class="row meta">✦ Ask AI · '+(A.target?'projects: '+esc(S.projects.map(p=>p.name).join(', ')):'no running service: cannot send')+'</div>';
  for(const q of r?(r.chain||[r]):[]){
    const a=q.answer||{},state=a.state||'queued',bad=['failed','refuse','apply failed'].includes(state);
    h+='<div class="body"><div class="meta">'+(q.url?'<a href="'+esc(q.url)+'" data-url="'+esc(q.url)+'">Comment on #'+esc(q.task)+' ↗</a>: ':'You: ')+esc(q.text||'')+'</div><div class="'+(bad?'alert':state==='applied'||state==='result'?'work':'ask')+'" role="status">'+esc(aiStates[state]||state)+(a.reason?': '+esc(a.reason):'')+'</div>'+(a.text?'<div>'+esc(a.text).replace(/\n/g,'<br>')+'</div>':'')+'</div>';
  }
  // a Next button replies with its number, the same token as typing it; the chain then shows `You: <number>`
  const nx=r&&['result','clarify','refuse'].includes(st)&&nextActions(an.text);
  if(nx)h+='<div class="options" role="group" aria-label="Next">'+nx.map(x=>'<button data-a="ai-next" data-v="'+x.n+'"'+(x.rec?' class="rec"':'')+'>'+esc(x.text)+'</button>').join('')+'</div>';
  h+='<div class="askai"><textarea id="ai" rows="2" aria-label="'+(st==='clarify'?'Answer to AI':'Request to AI')+'" placeholder="'+(st==='clarify'?'Answer…':'Ask, or request a change')+'">'+esc(aiText)+'</textarea><button data-a="ai-menu" aria-label="History and commands" title="History and commands" aria-expanded="'+aiMenu+'">↶</button></div>';
  if(aiMenu)h+='<div class="row meta">Recent</div>'+(A.history.length?A.history.map(t=>'<button class="project" data-a="ai-pick" data-v="'+esc(t)+'"><span>'+esc(t)+'</span></button>').join('')+'<button class="project" data-a="ai-clear">Clear history</button>':'<div class="body meta">No sent requests</div>')+
    '<div class="row meta">Commands</div>'+aiCommands.map(t=>'<button class="project" data-a="ai-pick" data-v="'+esc(t)+'"><span>'+esc(t)+'</span></button>').join('');
  h+='<div class="options"><button data-a="ai-send"'+(A.target?'':' disabled')+'>'+(st==='clarify'?'Reply':'Send')+'</button></div>';
  if(!r)return h+'</div>';
  // a setup lists its effects, computed by the service, instead of the op (§ 6)
  if(an.effects)h+='<div class="body meta">'+an.effects.map(esc).join('<br>')+'</div>';
  else if(an.ops)h+='<div class="body meta">'+an.ops.map(o=>esc(opText(o))).join('<br>')+'</div>';
  if(an.readback)h+='<div class="body meta">'+an.readback.map(esc).join('<br>')+'</div>';
  if(st==='proposal')h+='<button class="project" data-a="ai-confirm" data-root="'+esc(r.root)+'" data-id="'+esc(r.id)+'" data-rev="'+Number(an.rev)+'"'+(aiConfirm===r.id+'/'+Number(an.rev)?' disabled':'')+'>Confirm: apply '+(an.effects||an.ops).length+' change'+((an.effects||an.ops).length===1?'':'s')+'</button>';
  if(bad)h+='<button class="project" data-a="ai-pick" data-v="'+esc(r.text||'')+'">Edit and send again</button>';
  return h+'</div>';}
// Add project (menu.md M10): the folder comes from the OS picker; four cases
const addKinds={new:'New project: no taskq.json',plain:'Not a repository: files stay',taskq:'taskq project: selftest passes',old:'Old taskq project: selftest fails'};
const cutover='https://github.com/taskqorg/taskq/blob/main/taskq.md#9-config-and-cutover';
function addProject(){
  const A=S.add;
  if(!A)return '<button class="project" data-a="add">Add project…</button>';
  if(A.state==='picking')return '<div class="row meta">Choose a folder…</div>';
  const failed=A.state==='install failed',known=S.projects.some(p=>p.root===A.path);
  let h='<div class="body"><div class="meta">Folder: '+esc(A.path)+'</div><div role="status" class="'+(A.kind==='old'||failed?'alert':'')+'">'+(failed?'Install failed':esc(addKinds[A.kind]))+(A.reason?': '+esc(A.reason):'')+'</div></div>';
  if(A.kind==='old')h+='<a class="project" href="'+cutover+'" data-url="'+cutover+'"><span>Repair or cutover: taskq.md § 9 ↗</span><span></span><span></span></a>';
  if(A.kind==='taskq'){
    if(A.state==='installed')h+='<div class="row work" role="status">Installed: read back from this host\'s projects</div>';
    else if(A.state==='installing')h+='<button class="project" disabled>Installing…</button>';
    else if(known)h+='<div class="body meta">Already in this menu</div>';
    else if(addConfirm)h+='<div class="body" role="alert">Register '+esc(A.path)+' and install its service? It starts at logon.</div><div class="options"><button data-a="add-install">Confirm</button><button data-a="add-back">Cancel</button></div>';
    else if(!failed)h+='<button class="project" data-a="add-ask">Install service…</button>';
  }
  if(A.kind==='new'||A.kind==='plain')h+=S.ai.target?'<button class="project" data-a="add-setup">Set up with AI…</button>':'<div class="body meta">Setup needs one running project service</div>';
  return h+'<button class="project" data-a="add-cancel">'+(A.state==='installed'?'Done':'Cancel')+'</button>';}
// the command over all projects names each one and its effect before acting (M5, M-A4)
function bulk(run,held){
  const pausing=run.length>0,state=p=>({run:pausing?'pause':'admitting, unchanged',paused:pausing?'paused, unchanged':'resume',watch:'observation, unchanged'}[mode(p)]);
  if(confirming)return '<div class="body" role="alert">'+(pausing?'Pause admission? Running tasks finish.':'Resume admission?')+'<br>'+S.projects.map(p=>esc(p.name)+': '+state(p)).join('<br>')+'</div><div class="options"><button data-a="'+(pausing?'pause-all':'resume-all')+'">Confirm</button><button data-a="cancel">Cancel</button></div>';
  return run.length?'<button class="project" data-a="confirm">Pause all…</button>':held.length?'<button class="project" data-a="confirm">Resume all…</button>':'';}
function home(){
  const all=S.projects.flatMap(tasks),c=counts(all),run=S.projects.filter(p=>mode(p)==='run'),held=S.projects.filter(p=>mode(p)==='paused');
  let h='';
  if(S.platform==='macos')h+='<div class="options views">'+[['icon','Icon'],['full','Summary']].map(([v,l])=>'<button data-set="view" data-v="'+v+'" aria-pressed="'+(S.view===v)+'"><img alt="" src="'+S.icons[v]+'">'+l+'</button>').join('')+'</div>';
  h+=ai();
  h+='<details><summary>↳ Scope <span class="meta">'+S.projects.length+' project'+(S.projects.length===1?'':'s')+(known(S.projects)?' · in work '+c.work+' · ask '+c.ask+' · ready '+c.ready:' · counts unknown')+'</span></summary><div class="body">'+S.projects.map(p=>'<div><strong>'+esc(p.name)+'</strong> <span class="meta">'+esc(modeText(p))+'</span></div><div class="meta">You asked: '+esc(p.request||'not recorded')+'</div>').join('')+'</div></details>';
  h+=workEntry();
  h+=S.projects.map(p=>problem(p)+incident(p,true)+incidentNotice(p)).join('');
  if(S.settings_error)h+='<div class="body alert" role="alert">⚠ Settings unknown: '+esc(S.settings_error)+'; defaults shown</div>';
  h+=globalGroup('ask',unique(all))+globalGroup('failed',unique(all));
  h+='<div class="group">'+TaskqProjectBlocks.aggregate(S.projects.map(blockProject))+'<div class="row meta">Projects</div>'+(S.projects.length?S.projects.map(p=>TaskqProjectBlocks.summary(blockProject(p))+'<div class="body meta">'+esc(modeText(p))+'</div>').join(''):'<div class="body meta">No projects yet</div>')+addProject()+'</div>';
  h+=history();
  if(held.length&&run.length)h+='<div class="row meta">Paused '+held.length+' of '+(held.length+run.length)+': '+esc(held.map(p=>p.name).join(', '))+'</div>';
  h+=bulk(run,held);
  h+='<details><summary>Aa Text size <span class="meta">'+S.font+' px</span></summary><div class="options">'+[14,16,18,20].map(n=>'<button data-set="font" data-v="'+n+'" aria-pressed="'+(n===S.font)+'">'+n+'</button>').join('')+'</div></details>';
  // host-level, read-only rows of the freshest status.json probe (taskq.md § 4); none: unknown, not empty
  const A=S.agents;
  h+='<details class="group agents"><summary>⌘ Agents <span class="meta">'+esc(S.host+' · '+(A?'checked '+age(Math.max(0,S.now-A.at))+' ago':'unknown: no service probe yet'))+'</span></summary>'+(A?A.rows.map(r=>'<div class="row" role="menuitem" aria-disabled="true">'+esc(r)+'</div>').join(''):'<div class="body meta">Unknown: no status.json has agents</div>')+'</details>';
  h+='<button class="project" data-a="resources" title="btop in its own terminal window">◔ Resources</button>';
  h+=S.projects.map(service).join('');
  const vs=[...new Set(S.projects.map(p=>p.version).filter(Boolean))];
  return h+update()+'<div class="row meta">taskq '+esc(vs.join(', ')||'unknown')+(vs.length===1&&vs[0]===S.version?'':' · tray '+esc(S.version))+' · '+esc(S.host)+'</div>';}
// Capacity (taskq.md § 4): the shared resource controls (docs/design/shared-resource-controls.md) over the tray's
// taskq.resources/1 projection; this adapter only maps an operation onto `service capacity` and its receipt
const resourceCards=new Map(),resourceRequests=new Map(),resourcePayloads=new Map();
function resourceGroup(p){return {...p.resources,key:p.root,labels:{host:p.cap_host||'this host',project:p.name}};}
function resourceCapability(g){const p=S&&S.projects.find(p=>p.root===g.key),e=p&&p.cap_saved&&p.cap_saved.error;return e||!p?{edit:false,reason:'Read-only here',note:e?'Config: '+e:null}:{edit:true};}
function resourceSet(op){const set={limits:{}};for(const o of op.ops){if('runtime_limit' in o.changes)set.limits[o.target.runtime_id]=o.changes.runtime_limit;if(o.changes.load_gate)Object.assign(set,o.changes.load_gate);if('mode' in o.changes)set.mode=o.changes.mode;if('maximum' in o.changes)set.maximum=o.changes.maximum;}return set;}
function resourceSend(g,op){
  const p=S.projects.find(p=>p.root===g.key),key=g.key+'#'+op.id;
  // A lost receipt retries the reviewed expectation, never a newer config; keep one operation per project.
  if(resourcePayloads.get(g.key)?.id!==op.id)resourcePayloads.set(g.key,JSON.parse(JSON.stringify({a:'capacity',root:g.key,id:op.id,set:resourceSet(op),expect:p&&p.cap_saved})));
  return new Promise(resolve=>{
    const prior=resourceRequests.get(key);if(prior)clearTimeout(prior.timer);
    resourceRequests.set(key,{resolve,timer:setTimeout(()=>{resourceRequests.delete(key);resolve({state:'unknown',reason:'no receipt'});},30000)});
    send(resourcePayloads.get(g.key));});}
function resourceReceipt(m){
  const key=m.root+'#'+m.id,r=resourceRequests.get(key);
  if(!r)return;
  clearTimeout(r.timer);resourceRequests.delete(key);
  r.resolve(String(m.text).startsWith('Error')?{state:'rejected',reason:String(m.text).replace(/^Error:\s*/,'')}:{state:'saved'});
  setTimeout(()=>send({a:'size',w:S.font>=18?360:320,h:menu.scrollHeight}),0);}
function capacity(p){
  if(!p.resources)return '';
  return '<details class="group"><summary>▤ Capacity <span class="meta">'+esc((p.cap_host||'this host')+' · '+TaskqResources.headline(resourceGroup(p),S.now))+'</span></summary><div data-resources="'+esc(p.root)+'"></div></details>';}
// Work mode (menu M12): the shared editor over this host's projects; only the explicitly selected ones change
function workEntry(root){return S.projects.some(p=>p.resources)?'<button class="project" data-a="work"'+(root?' data-root="'+esc(root)+'"':'')+'>◎ Work mode…</button>':'';}
function workPage(){return '<button data-a="back">‹ Back</button><div data-work></div>';}
function mountResources(){
  const ws=menu.querySelector('[data-work]');
  if(ws){
    if(!workCard){const el=document.createElement('div');workCard={el,ui:TaskqResources.mountWork(el,{capability:resourceCapability,send:resourceSend,now:()=>S.now,host:S.host},working)};}
    ws.append(workCard.el);
    workCard.ui.update(S.projects.filter(p=>p.resources).map(resourceGroup));
  }
  for(const slot of menu.querySelectorAll('[data-resources]')){
    const p=S.projects.find(p=>p.root===slot.dataset.resources);
    if(!p)continue;
    let card=resourceCards.get(p.root);
    if(!card){const el=document.createElement('div');card={el,ui:TaskqResources.mount(el,{capability:resourceCapability,send:resourceSend,now:()=>S.now})};resourceCards.set(p.root,card);}
    slot.append(card.el);
    card.ui.update(resourceGroup(p));
  }
}
function project(p){
  const ts=tasks(p);
  return '<button data-a="back">‹ All projects</button>'+TaskqProjectBlocks.summary(blockProject(p))+'<div class="body meta">'+esc(modeText(p))+'</div>'+problem(p)+incident(p,true)+incidentNotice(p)+
  (['ask','failed','doing','review','ready','waiting','later'].map(st=>{const r=ts.filter(t=>t.state===st);return r.length?'<div class="group"><div class="row meta"><span>'+names[st]+'</span>'+counter(r.length,color(st),names[st])+'</div>'+r.map(t=>taskRow(t)).join('')+'</div>':'';}).join('')||'<div class="body muted">No open tasks</div>')+
  '<div class="group">'+(p.issues?'<a class="project" href="'+esc(p.issues)+'" data-url="'+esc(p.issues)+'"><span>Board ↗</span><span></span><span></span></a>':'')+admission(p)+'</div>'+capacity(p)+workEntry(p.root)+service(p);}
function filteredTasks(p){
  const ps=p?[p]:S.projects,rows=unique(ps.flatMap(tasks)).filter(t=>t.state===taskFilter),name=TaskqProjectBlocks.states.find(s=>s[0]===taskFilter)[1];
  return '<button data-a="back">‹ All projects</button><div class="body">'+esc((p?p.name:'All projects')+' · '+name)+'</div>'+(p?TaskqProjectBlocks.summary(blockProject(p)):TaskqProjectBlocks.aggregate(ps.map(blockProject)))+
    (known(ps)?'':'<div class="body meta">Partial: refresh the affected project or open its Board.</div>')+
    (taskFilter==='closed'?'<div class="body meta">Closed total and task list unknown: open the Board for authoritative closed tasks.</div>'+ps.map(p=>TaskqProjectBlocks.summary(blockProject(p))).join(''):rows.map(t=>taskRow(t,!p)).join('')||'<div class="body meta">'+(known(ps)?'No tasks':'Tasks unknown')+'</div>');
}
// pin (menu.md M13): the same menu as a movable window; the header is its drag handle
function head(){return '<div class="row head"><span class="meta">taskq</span><button data-a="pin" aria-pressed="'+!!S.pinned+'" title="'+(S.pinned?'Unpin: back to the popover':'Pin: keep open as a movable window')+'">'+(S.pinned?'Pinned':'Pin')+'</button></div>';}
function render(){
  if(!S)return;
  const active=document.activeElement,answerFocus=active&&active.closest('[data-answer]'),scroll=document.scrollingElement.scrollTop;
  const caret=answerFocus&&active.tagName==='TEXTAREA'?[active.selectionStart,active.selectionEnd]:null;
  const answerSelector=answerFocus&&(caret?'textarea':active.dataset.choice?'[data-choice="'+active.dataset.choice+'"]':active.dataset.qac?'[data-qac="'+active.dataset.qac+'"]':'button[type=submit]');
  const open=[...menu.querySelectorAll('details')].map(d=>d.open),p=S.projects.find(p=>p.root===page);
  if(!p)page='home';
  document.documentElement.style.colorScheme=S.theme||'light dark';
  menu.style.setProperty('--size',S.font+'px');
  menu.classList.toggle('pinned',!!S.pinned);
  menu.innerHTML=head()+(working?workPage():taskFilter?filteredTasks(p):p?project(p):home());
  mountAnswers();mountResources();
  menu.querySelectorAll('details').forEach((d,i)=>d.open=open[i]||false);
  if(S.page!==undefined)menu.querySelectorAll('.hist,.agents,.service,.incident-notice').forEach(d=>d.open=true);
  const restored=answerFocus&&menu.querySelector('[data-answer="'+CSS.escape(answerFocus.dataset.answer)+'"] '+answerSelector);
  if(restored){restored.focus();if(caret)restored.setSelectionRange(...caret);}
  document.scrollingElement.scrollTop=scroll;
  send({a:'size',w:S.font>=18?360:320,h:menu.scrollHeight});}
window.taskq={receive(s){
  if(s.answerReceipt){answerReceipt(s.answerReceipt);return;}
  if(s.capmsg){resourceReceipt(s.capmsg);return;}
  for(const p of s.projects){const was=S&&S.projects.find(q=>q.root===p.root);if(pending[p.root]&&was&&mode(was)!==mode(p))delete pending[p.root];}
  S=s;
  if(aiText===null)aiText=s.ai.draft||'';
  // snapshot mode names the page
  if(s.page!==undefined){page=s.page;pending={};}
  // a tick does not take the caret out of the range fields
  if(document.activeElement&&(document.activeElement.dataset.draft||document.activeElement.dataset.rscField||document.activeElement.id==='ai'))return;
  render();
},model:{unique,counts,mode,resourceSet}};
menu.addEventListener('click',e=>{
  const cardLink=e.target.closest('.qac a');if(cardLink){e.preventDefault();send({a:'open',url:cardLink.getAttribute('href')});return;}
  if(e.target.closest('.qac,.rsc'))return;
  if(TaskqProjectBlocks.handle(e,{open:url=>send({a:'open',url}),project:id=>{homeScroll=document.scrollingElement.scrollTop;taskFilter=null;page=id;ask=null;render();document.scrollingElement.scrollTop=0;},tasks:(id,state)=>{homeScroll=document.scrollingElement.scrollTop;page=id||'home';taskFilter=state;render();document.scrollingElement.scrollTop=0;}}))return;
  const a=e.target.closest('a[data-url]');if(a){e.preventDefault();send({a:'open',url:a.dataset.url});return;}
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.a==='work'){working=d.root?{[d.root]:true}:{};workCard=null;render();document.scrollingElement.scrollTop=0;return;}
  if(d.a==='back'&&working){working=null;workCard=null;render();return;}
  if(d.a==='back'){page='home';taskFilter=null;render();document.scrollingElement.scrollTop=homeScroll;return;}
  if(d.set==='period'&&d.v==='custom'){const H=S.history;draft={start:local(H.start,H.tz),end:local(H.end,H.tz),tz:H.tz,error:''};render();return;}
  if(d.set){S[d.set]=d.set==='font'?Number(d.v):d.v;if(d.set==='period')draft=null;send({a:'set',[d.set]:S[d.set]});render();return;}
  if(d.a==='range'){
    const t=v=>v?Date.parse(draft.tz==='UTC'?v+'Z':v)/1000:NaN,a=t(draft.start),z=t(draft.end);
    draft.error=!(a<z)?'Refused: start must be before end.':'';
    if(!draft.error){S.period='custom';send({a:'set',period:'custom',start:a,end:z,tz:draft.tz});draft=null;}
    render();return;}
  if(d.a==='ai-menu'){aiMenu=!aiMenu;render();return;}
  // picking fills the input, never sends (M-A13)
  if(d.a==='ai-pick'){aiText=d.v;aiMenu=false;send({a:'ai-draft',text:aiText});render();const t=document.getElementById('ai');t.focus();t.setSelectionRange(t.value.length,t.value.length);return;}
  if(d.a==='ai-next'){send({a:'ai-send',text:d.v,after:S.ai.request.id});render();return;}
  if(d.a==='ai-send'){const r=S.ai.request,an=r&&r.answer||{};if(!aiText.trim())return;send({a:'ai-send',text:aiText,after:an.state==='clarify'?r.id:''});aiText='';render();return;}
  if(d.a==='ai-confirm'){aiConfirm=d.id+'/'+d.rev;send({a:'ai-confirm',root:d.root,id:d.id,rev:Number(d.rev)});render();return;}
  if(d.a==='ai-clear'){send({a:'ai-clear'});return;}
  if(d.a==='add-ask'||d.a==='add-back'){addConfirm=d.a==='add-ask';render();return;}
  if(d.a==='add-install'||d.a==='add-cancel')addConfirm=false;
  if(d.a==='confirm'||d.a==='cancel'){confirming=d.a==='confirm';render();return;}
  if(d.a==='update'){updating={v:d.v,at:S.now};}
  if(d.a==='pick'){ask=d.root;render();return;}
  if(d.a==='pause-all'||d.a==='resume-all'){confirming=null;for(const p of S.projects.filter(p=>mode(p)===(d.a==='pause-all'?'run':'paused'))){pending[p.root]=d.a==='pause-all'?'Pausing':'Resuming';send({a:d.a.slice(0,-4),root:p.root});}render();return;}
  if(d.a==='pause'||d.a==='resume'||d.a==='focus'){pending[d.root]=d.a==='pause'?'Pausing':'Resuming';ask=null;}
  if(d.a)send({a:d.a,root:d.root,label:d.label});render();});
menu.addEventListener('input',e=>{if(e.target.id==='ai'){aiText=e.target.value;send({a:'ai-draft',text:aiText});return;}const k=e.target.dataset.draft;if(k&&draft)draft[k]=e.target.value;});
menu.addEventListener('focusout',e=>{const f=x=>x&&(x.id==='ai'||x.dataset&&(x.dataset.draft||x.dataset.rscField));if(f(e.target))setTimeout(()=>{if(!f(document.activeElement))render();});});
menu.addEventListener('mousedown',e=>{if(S&&S.pinned&&e.button===0&&e.target.closest('.head')&&!e.target.closest('button'))send({a:'drag'});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')send({a:'hide'});});
send({a:'ready'});
})();
</script></body></html>
