<div id="tqas">
<div class="demo"><span>Agent settings · interactive proposal</span><label>Preview state <select id="outcome"><option>Editing</option><option>Saved</option><option>Applied</option><option>Failed</option><option>Unknown</option><option>Revision changed</option></select></label><label>Text <select id="type"><option selected>16</option><option>20</option></select></label></div>
<section class="window" aria-label="TaskQ agent settings"><header><strong>TaskQ</strong><span class="sub">Settings / Agents</span><span class="push">MAC · this host</span></header><div class="runtime" id="runtime"></div><main id="content"></main><footer id="actions"></footer></section><div id="notice" class="notice" role="status" aria-live="polite">Fixture policy · no real permissions change</div>
</div>
<style>
#tqas{--paper:light-dark(#fafbfc,#252b32);--ink:light-dark(#243039,#eef2f5);--secondary:light-dark(#59636e,#b9c3cd);--line:light-dark(#dce0e5,#46505b);--hover:light-dark(#e9edf1,#37424c);--good:light-dark(#246f59,#8dd2b8);--warn:light-dark(#955525,#edbc96);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}#tqas *{box-sizing:border-box}#tqas .demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--secondary)}#tqas .window{background:var(--paper);border:1px solid var(--line);border-radius:10px;font-size:var(--size,16px);overflow:hidden}#tqas header,#tqas footer,#tqas .row,#tqas .runtime{display:flex;align-items:center;gap:6px;flex-wrap:wrap}#tqas header,#tqas .runtime,#tqas footer{padding:7px 10px;border-bottom:1px solid var(--line)}#tqas footer{border-top:1px solid var(--line);border-bottom:0}#tqas main{padding:10px}#tqas button,#tqas select{font:inherit;color:inherit;max-width:100%;min-height:32px;padding:4px 7px;border-radius:5px}#tqas button{border:0;background:transparent}#tqas button:hover,#tqas button[aria-pressed=true]{background:var(--hover)}#tqas button:disabled{opacity:.5}#tqas select{background:var(--paper);border:1px solid var(--line)}#tqas .primary{background:var(--ink);color:var(--paper)}#tqas strong{font-weight:500}#tqas .sub,#tqas small{color:var(--secondary);font-size:.875em}#tqas .push{margin-left:auto}#tqas .spread{justify-content:space-between}#tqas .section{border-top:1px solid var(--line);margin-top:9px;padding-top:8px}#tqas .review{border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}#tqas p{margin:5px 0}#tqas .good{color:var(--good)}#tqas .warn{color:var(--warn)}#tqas svg{display:inline-block;width:16px;height:16px;vertical-align:-3px}#tqas details{border-top:1px solid var(--line);padding:7px 0}#tqas summary{min-height:32px;padding:3px 0}#tqas .notice{font-size:14px;color:var(--secondary);padding-top:7px;min-height:28px}#tqas .cap{display:grid;grid-template-columns:minmax(95px,1fr) minmax(0,2fr);gap:6px;margin:6px 0}#tqas .cap>*{overflow-wrap:anywhere}#tqas .exception{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 0}#tqas button:focus-visible,#tqas select:focus-visible{outline:2px solid var(--good);outline-offset:1px}@media(max-width:420px){#tqas .cap{grid-template-columns:1fr}#tqas header .push{margin-left:0}#tqas .exception select{width:100%}}@media(pointer:coarse){#tqas button,#tqas select{min-height:44px}}
</style>
<script>
(()=>{
const r=document.getElementById('tqas'),profiles=['Read only','Workspace','Full'];
const copy=x=>JSON.parse(JSON.stringify(x));
const initial={mode:'Workspace',network:'Allowlist',exceptions:{specq:'Read only'}};
const store={Codex:{draft:copy(initial),saved:copy(initial),effective:copy(initial),rev:7,effectiveRev:7,activeRev:7,stale:false,status:'Applied',stage:'edit'},Claude:{draft:copy(initial),saved:copy(initial),effective:copy(initial),rev:4,effectiveRev:4,activeRev:4,stale:false,status:'Applied',stage:'edit'}};
let agent='Codex',outcome='Applied';
const e=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const i=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const b=(a,t,cls='',v='')=>`<button data-action="${a}" data-value="${e(v)}" class="${cls}">${t}</button>`;
const normalized=p=>({...copy(p),network:p.mode==='Full'?'Unrestricted':p.network});
const changed=s=>JSON.stringify(normalized(s.draft))!==JSON.stringify(normalized(s.saved));
function note(t){r.querySelector('#notice').textContent=t}
function state(){return store[agent]}
function diff(s){const old=normalized(s.effective),next=normalized(s.draft);const rows=[];for(const key of ['mode','network'])if(old[key]!==next[key])rows.push(`<p>${key==='mode'?'Default access':'Worker network'}: ${old[key]} → <strong>${next[key]}</strong></p>`);for(const project of new Set([...Object.keys(old.exceptions),...Object.keys(next.exceptions)])){const a=old.exceptions[project]||'Inherit '+old.mode,z=next.exceptions[project]||'Inherit '+next.mode;if(a!==z)rows.push(`<p>${e(project)}: ${a} → <strong>${z}</strong></p>`)}return rows.join('')||'<p>No effective change.</p>'}
function editor(s){const p=normalized(s.draft);return `<div class="row spread"><strong>${agent} access</strong><small>Signed in · probe 12s ago · fixture</small></div><div class="row"><span class="good">Effective: ${s.effective.mode}</span><small>Host policy · r${s.effectiveRev}</small></div><small>Model / effort: existing configuration, unchanged</small><div class="section"><div class="row">${profiles.map(v=>`<button data-action="mode" data-value="${v}" aria-pressed="${s.draft.mode===v}">${v}</button>`).join('')}<small>${changed(s)?'Unsaved draft':s.status}</small></div><p class="sub">${p.mode==='Full'?'Runtime sandbox off · external isolation unknown':p.mode==='Read only'?'Inspect project files; no project writes.':'Edit, build and test within approved workspaces.'}</p></div><details><summary>${i('folder-open')} Files <span class="sub">· ${p.mode==='Full'?'Unrestricted by runtime':'Approved workspace set'}</span></summary><div class="cap"><span>Project + worktree</span><span>${p.mode==='Read only'?'Read':p.mode==='Full'?'Unrestricted':'Read / write'}</span><span>Runtime / temp</span><span>Private runtime state as required</span><span>Policy / credentials</span><span>${p.mode==='Full'?'No same-user containment guarantee':'Protected by qualified adapter'}</span></div><small>Additional roots need a native picker and adapter validation; this fixture grants none.</small></details><details><summary>${i('network')} Network <span class="sub">· ${p.network}</span></summary><label>Worker egress <select data-field="network" ${p.mode==='Full'?'disabled':''}>${['Off','Allowlist','Unrestricted'].map(v=>`<option ${p.network===v?'selected':''}>${v}</option>`).join('')}</select></label><p class="sub">${p.mode==='Full'?'Restrictions require independently enforced isolation.':'Allowlist fixture: github.com, registry.npmjs.org. Exact hosts are reviewed with policy.'}</p><small>Provider API transport is separate.</small></details><details><summary>${i('wrench')} Tools <span class="sub">· ${p.mode==='Full'?'Unrestricted':'Adapter policy'}</span></summary><p>${p.mode==='Full'?'No runtime tool restrictions. OS/admin policy still applies.':'Read/search enabled. Writes and shell follow the effective sandbox. MCP/child-process boundaries require adapter proof.'}</p><small>Unsupported enforcement blocks application; no fallback to Full.</small></details><div class="section"><div class="row spread"><strong>Project exceptions</strong>${b('add',i('plus')+' Add')}</div><small>Host-owned overrides · remaining projects inherit ${p.mode}</small>${Object.entries(s.draft.exceptions).map(([name,mode])=>`<div class="exception"><span>${i('folder')} ${e(name)}</span><select class="push" data-project="${e(name)}" aria-label="${e(name)} access">${profiles.map(v=>`<option ${mode===v?'selected':''}>${v}</option>`).join('')}</select><button data-action="remove" data-value="${e(name)}" aria-label="Remove ${e(name)} override">${i('x')}</button></div>`).join('')}<small>Repository/task restrictions still apply. Removing an override returns to inheritance.</small></div><div class="section sub">2 active attempts keep r${s.activeRev}. New policy applies to new attempts; existing sessions do not silently change.</div>`}
function render(){const s=state();r.querySelector('#runtime').innerHTML=Object.keys(store).map(a=>`<button data-action="agent" data-value="${a}" aria-pressed="${a===agent}">${i(a==='Codex'?'terminal':'bot')} ${a}</button>`).join('')+'<span class="sub push">Workers + reviewers</span>';
let html,actions;
if(s.stage==='review'){html=`<strong>Review access change</strong><p class="sub">MAC · ${agent} · expected policy r${s.rev}</p><div class="review">${diff(s)}</div><p>Inherited projects: ${['taskq','specq'].filter(n=>!s.draft.exceptions[n]).join(', ')||'none'}</p>${s.draft.mode==='Full'?'<p class="warn">Runtime sandbox off. No verified external isolation.</p>':''}<p class="sub">Current attempts continue unchanged. Other runtimes and hosts remain unchanged.</p>`;actions=b('confirm','Confirm change','primary')+b('back','Back to draft');}
else if(s.stage==='receipt'){html=`<strong>${s.status}</strong><p class="sub">MAC · ${agent} · saved revision r${s.rev}</p><div class="review"><p>Saved: ${s.saved.mode}</p><p>Effective: ${s.effective.mode}</p><small>${s.status==='Applied'?'Fresh matching service readback simulated.':s.status==='Failed'?'Adapter rejected the candidate. Previous policy remains effective.':s.status==='Unknown'?'No fresh service receipt. Previous effective policy is last known; current state is unknown.':'Waiting for matching service readback; saving alone is not application.'}</small></div><p class="sub">2 existing attempts retain their original policy.</p>`;actions=(s.status!=='Applied'?b('readback','Refresh status','primary'):'')+b('back','Back to settings');}
else{html=editor(s);actions=`<button class="primary" data-action="review" ${!changed(s)||s.stale?'disabled':''}>Review changes</button>`+b('discard','Discard draft')+(s.stale?b('reload','Reload policy'):'' );}
r.querySelector('#content').innerHTML=html;r.querySelector('#actions').innerHTML=actions;window.lucide?.createIcons();}
r.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const s=state(),a=el.dataset.action,v=el.dataset.value;switch(a){case 'agent':agent=v;break;case 'mode':s.draft.mode=v;break;case 'add':if(!s.draft.exceptions.taskq)s.draft.exceptions.taskq=s.draft.mode;note('Fixture project taskq added; production uses the registered-project picker.');break;case 'remove':delete s.draft.exceptions[v];break;case 'discard':s.draft=copy(s.saved);note('Draft discarded; saved policy unchanged.');break;case 'reload':s.stale=false;s.rev++;note('Fixture policy reloaded; review your retained draft against the refreshed revision.');break;case 'review':if(changed(s)&&!s.stale)s.stage='review';break;case 'back':s.stage='edit';break;case 'confirm':if(s.stage!=='review')return;if(outcome==='Revision changed'){s.stale=true;s.stage='edit';note('Policy changed on the service. Apply refused; reload and reconcile before retry.');break;}s.saved=normalized(s.draft);s.rev++;s.status='Saved · waiting for service';s.stage='receipt';note('Simulation only: candidate saved, not yet applied.');break;case 'readback':if(s.stage!=='receipt')return;s.status=outcome==='Revision changed'?'Unknown':outcome;if(s.status==='Applied'){s.effective=copy(s.saved);s.effectiveRev=s.rev;}note('Simulated readback · no service contacted');break;}render();window.openai?.setWidgetState?.({modelContent:{agentSettings:{agent,mode:state().draft.mode,status:state().status}},privateContent:{}})?.catch(()=>{});});
r.addEventListener('change',ev=>{if(ev.target.id==='outcome'){
const value=ev.target.value,s=state();outcome=value==='Editing'||value==='Saved'?'Applied':value;
s.stale=false;
if(value==='Editing'){s.stage='edit';note('Editing preview · no real permissions change');}
else {s.saved={...copy(initial),mode:'Full',network:'Unrestricted'};s.draft=copy(s.saved);s.effective=copy(initial);s.effectiveRev=7;s.rev=8;
if(value==='Revision changed'){s.stage='edit';s.stale=true;note('Revision conflict preview: review is blocked until Reload policy.');}
else{s.stage='receipt';s.status=value==='Saved'?'Saved · waiting for service':value;if(value==='Applied'){s.effective=copy(s.saved);s.effectiveRev=s.rev;}note('Preview state: '+value+' · simulated service result');}}
render();return}
if(ev.target.id==='type'){r.style.setProperty('--size',ev.target.value+'px');return}const s=state();if(ev.target.dataset.field==='network')s.draft.network=ev.target.value;if(ev.target.dataset.project)s.draft.exceptions[ev.target.dataset.project]=ev.target.value;const details=[...r.querySelectorAll('details')].map(x=>x.open);render();r.querySelectorAll('details').forEach((x,j)=>x.open=details[j]);});
render();
})();
</script>
