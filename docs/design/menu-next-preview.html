function body(s,page){switch(page){case &#x27;home&#x27;:return home(s);case &#x27;work&#x27;:return work(s);case &#x27;scope-review&#x27;:return scopeReview(s);case &#x27;stop&#x27;:return stop(s);case &#x27;recover&#x27;:return recovery(s);case &#x27;restart-review&#x27;:return `&lt;strong&gt;Restart selected work?&lt;/strong&gt;&lt;div class=&quot;review&quot;&gt;&lt;p&gt;#841 · new attempt on ${preview.platform}&lt;/p&gt;&lt;p&gt;Preserved workspace · Workspace permissions&lt;/p&gt;&lt;small&gt;#852 stays held. Only taskq resumes admission; agentq remains held.&lt;/small&gt;&lt;/div&gt;${s.selected?button(&#x27;restart-confirm&#x27;,&#x27;Restart #841&#x27;,&#x27;rotate-ccw&#x27;,&#x27;primary&#x27;):&#x27;&lt;p&gt;Select a stopped task first.&lt;/p&gt;&#x27;}${button(&#x27;recover&#x27;,&#x27;Back&#x27;)}`;
