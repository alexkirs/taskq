# The test project: every key taskq.toml knows.
[gitlab]
project = "group/project"
host = "gitlab.example.com"
board = "taskq"

[limit]
claude = 2
codex = 3

[codex]
project = "codex-project"
section = "codex-section"

[workspace]
new = "from the main checkout run `make worktree NAME=taskq-{iid}` and work only there; prepare only what the task needs (`make prepare WHAT=<step>`)."
continue = "this task was started before in worktree `taskq-{iid}`; continue there. If it is gone, create it: `make worktree NAME=taskq-{iid}`."
none = "this task is expected to end in an answer, not a commit: work from the main checkout."
retire = "make worktree-retire NAME=taskq-{iid}"
cleanup_helpers = "scripts"

[update]
auto = false
every = "24h"
