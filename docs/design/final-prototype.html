const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,brand=n=>`<img class="brand" alt="${n==='openai'?'Codex':n}" src="${assets[n]}">`;
const b=(a,text,value='',cls='')=>`<button class="${cls}" data-action="${a}" data-value="${e(value)}">${text}</button>`;
const btn=(a,n,label,v='')=>`<button data-action="${a}" data-value="${e(v)}" aria-label="${e(label)}">${ic(n)}</button>`;
let st={page:'home',tab:'conversations',id:'design',scenario:'question',font:16,theme:'system',paused:false,view:'summary',window:true,archive:false,showList:false,period:'1d',owners:{}};
let menuDraft='',menuFiles=[],pending=null;let permissionRuntime='codex',permissionMode='workspace',permissionNetwork='Allowlist';const permissionApplied={codex:'workspace',claude:'workspace'};const cs={design:{id:'design',title:'Admin API',project:'taskq',agent:'Codex',state:'clarify',rev:1,draft:'',files:[],messages:[]},release:{id:'release',title:'Release checks',project:'agentq',agent:'Claude',state:'running',rev:1,draft:'',files:[],messages:[]},done:{id:'done',title:'Yesterday’s plan',project:'specq',agent:'Codex',state:'result',rev:1,draft:'',files:[],messages:[],archived:true}};
const states={clarify:'Needs answer',proposal:'Review changes',running:'Working',queued:'Queued',applied:'Applied · read back',partial:'Partially applied',failed:'Agent unavailable',result:'Done',draft:'Draft',refuse:'Cannot apply',interrupted:'Interrupted'};
function status(t){r.querySelector('#demo-status').textContent=t}
function persist(){window.openai?.setWidgetState?.({modelContent:{finalMenu:{scenario:st.scenario,tab:st.tab,conversation:st.id,windowPolicy:'main + explicit detached'}},privateContent:{theme:st.theme,font:st.font,view:st.view}})?.catch(()=>{})}
function bar(title){return `<div class="row section">${btn('home','arrow-left','Back to home')}<strong>${title}</strong><span class="small">Mac</span></div>`}
function row(a,text,v='',tail='›'){return b(a,text+`<span>${tail}</span>`,v,'full')}
function task(id,title,state='work',host='Mac',agent='openai'){return `<div class="task"><span class="${state}">${state==='ask'?'?':state==='fail'?'!':'▶'}</span> ${brand('github')} ${b('issue','#'+id,id)} <span class="meta">${host!=='Mac'?ic('network'):''}${host}</span> ${e(title)} <span>${btn('session',agent==='claude'?'sparkles':'terminal','Open '+(agent==='claude'?'Claude':'Codex')+' session',host)}</span></div>`}
function composer(menu=false){const c=cs[st.id],draft=menu?menuDraft:c.draft,files=menu?menuFiles:c.files;return `<div class="${menu?'mini-composer':''}" data-drop="${menu?'menu':'chat'}"><textarea rows="1" data-draft="${menu?'menu':'chat'}" aria-label="${menu?'Menu request':'Conversation message'}" placeholder="${menu?'Ask or plan work…':'Message '+c.agent+'…'}">${e(draft)}</textarea><div>${files.map((f,i)=>`<span class="attachment">${ic('paperclip')}${e(f.name)} · ${Math.ceil(f.size/1024)} KB${btn('remove-file','x','Remove '+f.name,(menu?'menu':'chat')+':'+i)}</span>`).join('')}</div><div class="row"><span class="small">${menu?'taskq + agentq':e(c.project)+' · '+c.agent}</span><span>${btn('attach','paperclip','Attach files',menu?'menu':'chat')}${btn('history','history','History and commands',menu?'menu':'chat')}${btn('send','arrow-up',menu?'Send and open conversation':'Send message',menu?'menu':'chat')}</span></div><input type="file" data-file="${menu?'menu':'chat'}" accept="image/png,image/jpeg,image/webp,text/plain,text/markdown,application/pdf" multiple hidden></div>`}
const counterStates=[['doing','Doing','play','work'],['review','Review','git-pull-request',''],['ask','Needs answer','message-circle-question','ask'],['failed','Failed','circle-x','fail'],['ready','Ready','circle',''],['waiting','Blocked','link',''],['later','Later','clock',''],['closed','Closed','check','closed']];

r.addEventListener('click',ev=>{const x=ev.target.closest('button[data-action]');if(!x)return;const a=x.dataset.action,v=x.dataset.value||'',c=cs[st.id];switch(a){case 'counter':st.counter=v;st.page='counter';break;case 'permissions':permissionRuntime=v||permissionRuntime;st.page='permissions';break;case 'confirm-permissions':permissionApplied[permissionRuntime]=permissionMode;st.page='agents';status('Simulation only. No permission grant, policy file or worker changed.');break;case 'home':st.page='home';break;case 'view':st.view=v;break;case 'font':st.font=Number(v);break;case 'pause':st.page='pause';break;case 'confirm-pause':st.paused=!st.paused;st.page='home';status('Simulated admission change. No service was modified.');break;case 'project':case 'service':st.project=v||st.project;st.page=a;break;case 'lifecycle':st.lifecycle=v;st.page=a;break;case 'open':st.id=v;st.window=true;st.tab='conversations';st.archive=!!cs[v].archived;st.showList=false;status(Model.openWindow(st.owners,v,false)==='detached'?'Raise the existing detached window.':'Raise this conversation in the main window.');break;case 'workspace':st.window=true;st.showList=false;break;case 'close-window':st.window=false;status('Window hidden. Requests, drafts and conversations remain.');break;case 'detach':if(st.owners[st.id]){Model.reattach(st.owners,st.id);status('Returned the same conversation to the main window.')}else{Model.openWindow(st.owners,st.id,true);status('Detached-window ownership simulated; no duplicate conversation created.')}break;case 'new':{const id='new'+Object.keys(cs).length;cs[id]={id,title:'New conversation',project:'taskq',agent:'Codex',state:'draft',rev:1,draft:'',files:[],messages:[]};st.id=id;st.archive=false;st.tab='conversations';st.window=true;st.showList=false;break}case 'tab':st.tab=v;st.showList=false;break;case 'show-list':st.showList=!st.showList;break;case 'archive':st.archive=!st.archive;st.showList=true;st.tab='conversations';break;case 'history':st.historyTarget=v||'menu';st.page='history';break;case 'fill':if(st.historyTarget==='chat')c.draft=v;else menuDraft=v;st.page='home';status('Filled draft only. Nothing sent.');break;case 'attach':r.querySelector('[data-file="'+v+'"]').click();return;case 'remove-file':{const [target,i]=v.split(':');(target==='menu'?menuFiles:c.files).splice(Number(i),1);break}case 'send':{const text=v==='menu'?menuDraft:c.draft,files=v==='menu'?menuFiles:c.files;if(!text.trim()){status('Describe what to do with the request or attachments.');return}if(v!=='menu'&&c.state==='running'){status('Follow-up stays in the draft until this request finishes.');return}if(v==='menu'){const id='menu'+Object.keys(cs).length;cs[id]={id,title:text.slice(0,32),project:'taskq + agentq',agent:'Codex',state:'clarify',rev:1,draft:'',files:[],messages:[{role:'You',text},{role:'Codex',text:'Demo: request received with '+files.length+' attachments. No agent was started.'}]};st.id=id;menuDraft='';menuFiles=[];}else{c.messages.push({role:'You',text},{role:c.agent,text:'Simulation: message stays in this conversation; no external request sent.'});c.draft='';c.files=[];c.preview=false;c.receipt=null;c.rev++;c.state='clarify'}st.window=true;st.tab='conversations';st.archive=false;st.showList=false;break}case 'answer':c.messages.push({role:'You',text:v==='keep'?'Keep compatibility.':'Remove the old API.'},{role:c.agent,text:'Demo: review the current question/attempt before sending this answer to the board.'});c.state='result';break;case 'simulate-proposal':c.preview=true;c.state='proposal';c.rev++;break;case 'confirm':{const [id,rev]=v.split(':');status(Model.confirm(cs[id],id,Number(rev))?'Simulated apply with revision receipt.':'Stale or already applied; refresh first.');break}case 'decline':c.preview=false;c.state='result';c.messages.push({role:'You',text:'Declined. No change applied.'});break;case 'clarify':c.messages.push({role:c.agent,text:'Should authentication and migration tasks be included? No scope changed.'});c.state='clarify';break;case 'reconcile':case 'retry':c.messages.push({role:c.agent,text:'Demo: refresh delivery and applied-state evidence before retrying. Successful operations must not repeat.'});break;case 'focus-ai':applyScenario('proposal');st.page='home';break;case 'setup-chat':applyScenario('setup');st.page='home';break;case 'period':st.period=v;break;case 'range':{const lo=r.querySelector('#start').value,hi=r.querySelector('#end').value;status(lo&&hi&&lo<hi?'Valid sample [start, end) range.':'Start must be before end.');return}case 'review-mode':{const targets=[...r.querySelectorAll('[data-target]:checked')].map(i=>i.dataset.target);if(!targets.length){status('Select at least one change target.');return}const scope=r.querySelector('#scope').value;const limits=[...r.querySelectorAll('[data-limit]')].filter(i=>targets.includes(i.dataset.limit.split(':')[0]));if(limits.some(i=>!/^\d+$/.test(i.value)||+i.value>32)){status('Prototype limits: integer 0–32. Runtime keeps its full validated range.');return}const baseline={'taskq:codex':2,'taskq:claude':1,'agentq:codex':1,'agentq:claude':1};const changes=limits.filter(i=>Number(i.value)!==baseline[i.dataset.limit]).map(i=>i.dataset.limit+': '+baseline[i.dataset.limit]+' → '+i.value);if(scope!=='mixed')targets.forEach(p=>{const before=p==='taskq'?'all':'docs';if(before!==scope)changes.push(p+' focus: '+before+' → '+scope)});if(!changes.length){status('No changes. Mixed focus and untouched limits preserved.');return}pending={text:changes.join('; ')};st.page='review-mode';break}case 'apply-mode':status('Simulated per-target review only; no capacity or focus written.');pending=null;st.page='home';break;case 'session':status(v==='Mac'?'Demo: open the recorded local session using its agent permalink.':'Remote session: host shown; no local navigation.');return;case 'issue':status('Demo: open the recorded board/issue URL for '+v+'.');return;case 'note':status(v);return;default:st.page=a}render();persist()});
function takeFiles(list,target){const allowed=['image/png','image/jpeg','image/webp','text/plain','text/markdown','application/pdf'];const ok=[...list].filter(f=>allowed.includes(f.type)||/\.(md|txt)$/i.test(f.name));if(ok.length!==list.length)status('Unsupported attachment rejected; draft preserved. Preview reads no file content.');const a=target==='menu'?menuFiles:cs[st.id].files;ok.forEach(f=>a.push({name:f.name,size:f.size}));render()}
r.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.draft){if(t.dataset.draft==='menu')menuDraft=t.value;else cs[st.id].draft=t.value}if(t.id==='chat-search')r.querySelectorAll('[data-chat-name],[data-session-name]').forEach(x=>x.hidden=!(x.dataset.chatName||x.dataset.sessionName).includes(t.value.toLowerCase()));if(t.hasAttribute('data-search-project'))r.querySelectorAll('[data-project]').forEach(x=>x.hidden=!x.dataset.project.includes(t.value.toLowerCase()))});
r.addEventListener('change',ev=>{const t=ev.target;if(t.id==='permission-mode'){permissionMode=t.value;if(permissionMode==='full')permissionNetwork='Unrestricted';}else if(t.id==='permission-network')permissionNetwork=t.value;else if(t.id==='scenario')applyScenario(t.value);else if(t.id==='theme')st.theme=t.value;else if(t.id==='font')st.font=Number(t.value);else if(t.dataset.file){takeFiles(t.files,t.dataset.file);return}else if(t.dataset.target){r.querySelectorAll('[data-limit]').forEach(i=>{const p=i.dataset.limit.split(':')[0];i.disabled=!r.querySelector('[data-target="'+p+'"]').checked});return}else return;render();persist()});
r.addEventListener('keydown',ev=>{if(ev.target.dataset.draft&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();r.querySelector('[data-action="send"][data-value="'+ev.target.dataset.draft+'"]').click()}});
r.addEventListener('dragover',ev=>{if(ev.target.closest('[data-drop]'))ev.preventDefault()});r.addEventListener('drop',ev=>{const el=ev.target.closest('[data-drop]');if(el){ev.preventDefault();takeFiles(ev.dataTransfer.files,el.dataset.drop)}});
const restored=window.openai?.widgetState?.privateContent;if(restored){if(['system','light','dark'].includes(restored.theme))st.theme=restored.theme;if([14,16,18,20].includes(restored.font))st.font=restored.font}applyScenario('question');render();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);
})();
</script>
