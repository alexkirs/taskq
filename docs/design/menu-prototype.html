<div id="tq-spec"><div class="stage viz-dotted-background"><div class="bar"><button class="trigger" aria-label="Меню taskq" aria-expanded="true"></button><span class="clock">◉ &nbsp; 14:32</span></div><div class="menu"></div><div class="foot">Макет по спецификациям · реальные ссылки, демонстрационные состояния · сервис не изменяется.</div></div></div>
<script>
(()=>{
const fixtures=[{project:'taskq',number:664,title:'Desktop и CLI: возможности',state:'doing'},{project:'taskq',number:654,title:'Task Mesh — связь агентов между хостами',state:'ask'},{project:'taskq',number:652,title:'Разовый срочный запуск задачи вне текущего scope',state:'failed'},{project:'taskq',number:651,title:'Перенести TaskQ в организацию',state:'ready'}].map(t=>({...t,key:'github.com/alexkirs/taskq/'+t.number,url:'https://github.com/alexkirs/taskq/issues/'+t.number}));
const periods={'5m':300000,'1h':3600000,'1d':86400000,'1w':604800000,'1mo':2592000000};
const now=Date.UTC(2026,9,13,14,32);
const events=Array.from({length:28},(_,i)=>({id:'close-'+i,at:now-(i*i*47+30)*60000,kind:'done'})).concat([{id:'fail-1',at:now-60000,kind:'failed'},{id:'fail-2',at:now-6000000,kind:'failed'}]);
const names={doing:'В работе',review:'Проверка',ask:'Ждут ответа',failed:'Неудачные',ready:'Готовы',waiting:'Зависимости',later:'Отложены'};
const symbols={doing:'▶',review:'↻',ask:'?',failed:'!',ready:'○',waiting:'⋯',later:'Ⅱ'};
const color=st=>({doing:'work',review:'work',ask:'ask',failed:'failed',ready:'ready'}[st]||'muted');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function unique(tasks){return [...new Map(tasks.map(t=>[t.key,t])).values()];}
function counts(tasks){const rows=unique(tasks);return {work:rows.filter(t=>['doing','review'].includes(t.state)).length,ask:rows.filter(t=>t.state==='ask').length,ready:rows.filter(t=>t.state==='ready').length,failed:rows.filter(t=>t.state==='failed').length};}
function histogram(list,start,end){if(!Number.isFinite(start)||!Number.isFinite(end)||start>=end)throw Error('Начало должно быть раньше конца');const bins=Array.from({length:9},()=>({done:0,failed:0}));for(const e of new Map(list.map(e=>[e.id,e])).values())if(e.at>=start&&e.at<end&&['done','failed'].includes(e.kind))bins[Math.min(8,Math.floor((e.at-start)/(end-start)*9))][e.kind]++;return bins;}
function confirm(state,id,revision){if(state.applied.includes(id))return 'duplicate';if(!state.proposal||state.proposal.id!==id||state.proposal.revision!==revision)return 'stale';state.applied.push(id);state.proposal=null;return 'accepted';}
function taskRow(t,global=false){return '<a class="task '+(global?'global':'')+'" href="'+esc(t.url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(t.project+' #'+t.number+' '+t.title+'; '+names[t.state])+'" data-tooltip="'+esc(t.title)+'"><span class="'+color(t.state)+'" aria-hidden="true">'+symbols[t.state]+'</span>'+(global?'<span class="num">'+esc(t.project)+'</span>':'')+'<span class="num">#'+t.number+'</span><span class="title">'+esc(t.title)+'</span></a>';}
// Pure model is exposed only for fixture tests; no service adapter in this prototype.
globalThis.taskqMenuModel={unique,counts,histogram,confirm,taskRow,serviceMenu,fixtures,remember,counter};
if(typeof document==='undefined')return;
const root=document.getElementById('tq-spec');
const state={history:[],picker:false,view:'icon',font:16,period:'1d',paused:false,page:'home',draft:'',reply:'',proposal:null,applied:[],revision:0};
const restored=window.openai?.widgetState?.modelContent||{};
function restore(v){if(['icon','full'].includes(v.view))state.view=v.view;if([14,16,18,20].includes(v.font))state.font=v.font;if(v.period in periods)state.period=v.period;if(typeof v.paused==='boolean')state.paused=v.paused;for(const k of ['draft','reply'])if(typeof v[k]==='string')state[k]=v[k];}
restore(restored);
function restorePrivate(v){if(!v)return;if(Array.isArray(v.history))state.history=v.history.filter(x=>typeof x==='string'&&x.trim()).slice(0,20);if(Array.isArray(v.custom)&&v.custom.length===2){try{histogram([], ...v.custom);state.custom=v.custom;}catch{}}if(Number.isInteger(v.revision)&&v.revision>=0)state.revision=v.revision;if(Array.isArray(v.applied))state.applied=v.applied.filter(x=>typeof x==='string');if(v.proposal&&typeof v.proposal.id==='string'&&Number.isInteger(v.proposal.revision))state.proposal=v.proposal;}
restorePrivate(window.openai?.widgetState?.privateContent);
function save(){window.openai?.setWidgetState?.({modelContent:{view:state.view,font:state.font,period:state.period,paused:state.paused,draft:state.draft,reply:state.reply},privateContent:{history:state.history,custom:state.custom||null,revision:state.revision,proposal:state.proposal,applied:state.applied}})?.catch(()=>{});}
function range(){return state.custom||[now-periods[state.period],now];}
function badge(full){const mode='<span class="mode '+(state.paused?'pause':'run')+'"></span>';if(!full)return '<span class="q" role="img" aria-label="taskq: '+(state.paused?'на паузе':'приём включён')+'">'+mode+'</span>';const bins=histogram(events,...range()),peak=Math.max(1,...bins.map(b=>b.done+b.failed));return '<span class="micro" role="img" aria-label="Работа 1, ответ 1, готовы 1, failed 1"><canvas class="digits" width="120" height="42" aria-hidden="true"></canvas>'+mode+'<span class="spark">'+bins.map(b=>{const total=(b.done+b.failed)/peak*8;const red=b.failed/peak*8;return '<span class="bin"><i class="bad" style="height:'+red+'px"></i><i style="height:'+(total-red)+'px"></i></span>';}).join('')+'</span></span>';}
function draw(){const cols=['work','ask','ready'].map(c=>{const s=document.createElement('span');s.style.color='var(--'+c+')';root.appendChild(s);const value=getComputedStyle(s).color;s.remove();return value;});root.querySelectorAll('.digits').forEach(c=>{const ctx=c.getContext('2d');ctx.scale(3,3);ctx.font='600 14px ui-monospace, SFMono-Regular, Consolas, monospace';['1','1','1'].forEach((n,i)=>{const m=ctx.measureText(n),w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,left=i===0?0:i===1?(40-w)/2:40-w;ctx.fillStyle=cols[i];ctx.fillText(n,left+m.actualBoundingBoxLeft,13);});});}
function remember(history,text){text=text.trim();return text?[text,...history.filter(x=>x!==text)].slice(0,20):history;}
function counter(value,kind,label){return '<span class="counter '+(value>0?kind+' filled':'zero')+'" aria-label="'+esc(label+': '+value)+'" data-tooltip="'+esc(label)+'">'+value+'</span>';}
function countMarkup(c){return '<span class="counts">'+counter(c.work,'work','В работе')+counter(c.ask,'ask','Ждут ответа')+counter(c.ready,'ready','Готовы')+'</span>';}
function requestPicker(){if(!state.picker)return '';return '<div class="request-picker"><div class="row meta">Недавние'+(state.history.length?'<button data-action="clear-history" aria-label="Очистить историю">Очистить</button>':'')+'</div>'+(state.history.length?state.history.map((t,i)=>'<button class="recall" data-recall="'+i+'">'+esc(t)+'</button>').join(''):'<div class="meta body">Пока пусто</div>')+'<div class="row meta">Готовые команды</div>'+['Что мешает работе?','Приостанови приём в taskq','Покажи причины failed'].map((t,i)=>'<button class="recall" data-preset="'+i+'">'+esc(t)+'</button>').join('')+'</div>';}
function group(st,global){const ts=fixtures.filter(t=>t.state===st);if(!ts.length)return '';return '<details class="group"><summary><span class="'+color(st)+'">'+names[st]+'</span>'+counter(ts.length,color(st),names[st])+'</summary>'+ts.map(t=>taskRow(t,global)).join('')+'</details>';}
function serviceMenu(project){return '<details class="group"><summary>⚙ Сервис проекта <span class="meta">'+esc(project)+'</span></summary><div class="body meta">Макет: системные действия не подключены.</div>'+['Открыть лог','Открыть папку','Перезапустить','Остановить до следующего входа'].map(label=>'<button class="project" disabled aria-label="'+esc(label+' — '+project+'; недоступно в макете')+'">'+label+'</button>').join('')+'<details><summary>Удалить сервис '+esc(project)+'</summary><div class="body meta">Снять автозапуск этого проекта. Рабочие файлы и другие проекты сохраняются.</div><button class="project" disabled>Подтвердить удаление '+esc(project)+'</button></details></details>';}
function render(){const c=counts(fixtures);root.querySelector('.trigger').innerHTML=badge(state.view==='full');const menu=root.querySelector('.menu');menu.style.setProperty('--size',state.font+'px');menu.style.setProperty('--menu-width',(state.font>=18?360:320)+'px');if(state.page!=='home'){const tasks=fixtures.filter(t=>t.project===state.page);menu.innerHTML='<button data-action="back">‹ Все проекты</button><div class="row"><strong>'+esc(state.page)+'</strong>'+countMarkup(counts(tasks))+'</div><div class="body meta">'+(state.page==='taskq'?'Все задачи · '+(state.paused?'приём на паузе':'приём включён'):'Только наблюдение')+'</div>'+(['ask','failed','doing','review','ready','waiting','later'].map(st=>{const rows=tasks.filter(t=>t.state===st);return rows.length?'<div class="group"><div class="row meta"><span>'+names[st]+'</span>'+counter(rows.length,color(st),names[st])+'</div>'+rows.map(t=>taskRow(t)).join('')+'</div>':'';}).join('')||'<div class="body muted">Нет открытых задач</div>')+(state.page==='taskq'?'<div class="group"><a class="row" href="https://github.com/alexkirs/taskq/issues" target="_blank" rel="noopener noreferrer">Доска ↗</a><button data-action="pause">'+(state.paused?'Продолжить':'Приостановить')+' приём</button></div>'+serviceMenu(state.page):'');}else{menu.innerHTML='<div class="options views"><button data-view="icon" aria-pressed="'+(state.view==='icon')+'">'+badge(false)+' Значок</button><button data-view="full" aria-pressed="'+(state.view==='full')+'">'+badge(true)+' Сводка</button></div>'+ '<details><summary>✎ Попросить taskq</summary><div class="body"><label class="small-label" for="spec-request">Контекст: taskq · исполнение; serverq · наблюдение</label><div class="composer"><textarea id="spec-request" rows="2" placeholder="Что сделать?">'+esc(state.draft)+'</textarea><div class="composer-tools"><button data-action="history" aria-label="История и команды" aria-expanded="'+state.picker+'" data-tooltip="История и команды">↶</button><button data-action="send" aria-label="Отправить запрос" data-tooltip="Отправить">↑</button></div></div>'+requestPicker()+'<div class="answer" aria-live="polite">'+esc(state.reply)+'</div>'+(state.proposal?'<div class="options"><button data-action="confirm">Подтвердить</button><button data-action="clarify">Уточнить</button></div>':'')+'</div></details>'+ '<details><summary>↳ Работаем над <span class="meta">1 проект</span></summary><div class="body"><span class="small-label">Вы попросили</span><p>«Работай над taskq, за serverq только следи».</p><span class="small-label">Мы поняли</span><p>Исполнение: taskq, все задачи. Наблюдение: taskq и serverq, все задачи.</p><span class="small-label">Сейчас применяется · данные макета</span><p>'+ (state.paused?'taskq: новые не берём, текущие продолжаются.':'taskq: приём включён.')+' serverq: только наблюдение.</p><button data-action="scope">Изменить здесь…</button></div></details>'+group('ask',true)+group('failed',true)+'<div class="group"><div class="row meta">Проекты</div><button class="project" data-project="taskq"><span>taskq</span>'+countMarkup(c)+'<span>›</span></button><button class="project" data-project="serverq"><span>serverq</span><span class="meta">Наблюдение ›</span></button></div>'+ '<details class="group"><summary>▥ График <span class="meta">'+(state.custom?'Свой интервал':{'5m':'5 минут','1h':'Час','1d':'24 часа','1w':'7 дней','1mo':'30 дней'}[state.period])+'</span></summary><div class="options">'+Object.entries({'5m':'5 мин','1h':'Час','1d':'День','1w':'Неделя','1mo':'Месяц'}).map(([key,label])=>'<button data-period="'+key+'" aria-pressed="'+(!state.custom&&state.period===key)+'">'+label+'</button>').join('')+'</div><div class="body meta">Зелёный: закрыты. Красный: переходы в failed. Старые слева; высота относительно пика.</div><details><summary>Свой интервал</summary><div class="body"><label class="small-label">С (Asia/Bangkok)<input type="datetime-local" id="range-start" value="2026-10-12T21:32"></label><label class="small-label">До (Asia/Bangkok)<input type="datetime-local" id="range-end" value="2026-10-13T21:32"></label><button data-action="range">Показать</button><div id="range-error" role="alert"></div></div></details></details>'+ '<button class="project" data-action="pause">'+(state.paused?'Продолжить':'Приостановить')+' приём в taskq</button><details><summary>Аа Размер текста <span class="meta">'+state.font+' px</span></summary><div class="options">'+[14,16,18,20].map(n=>'<button data-font="'+n+'" aria-pressed="'+(n===state.font)+'">'+n+'</button>').join('')+'</div></details>'+serviceMenu('taskq')+'<div class="row meta">taskq · mac · демонстрация</div>';}
draw();}
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const open=[...root.querySelectorAll('details')].map(d=>d.open);if(el.dataset.view)state.view=el.dataset.view;if(el.dataset.font)state.font=Number(el.dataset.font);if(el.dataset.project)state.page=el.dataset.project;if(el.dataset.period){state.period=el.dataset.period;delete state.custom;}const a=el.dataset.action;if(a==='back')state.page='home';if(a==='pause')state.paused=!state.paused;if(a==='scope')state.draft='Приостанови приём в taskq';if(a==='history')state.picker=!state.picker;if(a==='clear-history')state.history=[];if(el.dataset.recall!==undefined||el.dataset.preset!==undefined){state.draft=el.dataset.recall!==undefined?state.history[Number(el.dataset.recall)]:['Что мешает работе?','Приостанови приём в taskq','Покажи причины failed'][Number(el.dataset.preset)];state.proposal=null;state.picker=false;}if(a==='send'){if(!state.draft.trim())return;state.history=remember(state.history,state.draft);state.picker=false;state.proposal=null;if(/приостанов/i.test(state.draft)){state.revision++;state.proposal={id:'demo-'+state.revision,revision:state.revision};state.reply='Предложение: приостановить приём в taskq. Текущие задачи продолжаются; наблюдение serverq не меняется.';}else state.reply='Демонстрация: 1 вопрос и 1 failed в taskq. Свободный текст сохранён; настоящий агент не подключён.';}if(a==='confirm'&&state.proposal){const p=state.proposal;if(confirm(state,p.id,p.revision)==='accepted'){state.paused=true;state.reply='Применено только в модели: taskq на паузе. Реальный сервис не изменён.';}}if(a==='clarify'){state.proposal=null;state.reply='Уточните запрос и отправьте снова.';}if(a==='range'){const start=Date.parse(root.querySelector('#range-start').value+'+07:00'),end=Date.parse(root.querySelector('#range-end').value+'+07:00');try{histogram(events,start,end);state.custom=[start,end];}catch(err){root.querySelector('#range-error').textContent=err.message;return;}}render();root.querySelectorAll('details').forEach((d,i)=>d.open=open[i]||false);if(a==='scope')root.querySelector('details').open=true;save();});
root.addEventListener('input',e=>{if(e.target.id==='spec-request'){state.draft=e.target.value;if(state.proposal){state.proposal=null;const confirmButton=root.querySelector('[data-action="confirm"]');if(confirmButton)confirmButton.disabled=true;}save();}});
root.querySelector('.trigger').addEventListener('click',()=>{const menu=root.querySelector('.menu');menu.hidden=!menu.hidden;root.querySelector('.trigger').setAttribute('aria-expanded',String(!menu.hidden));});
