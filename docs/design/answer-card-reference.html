<div class="viz-dotted-background">
<section id="q-answer-demo" aria-label="TaskQ question inside DashQ">
<style>
#q-answer-demo{--q-bg:light-dark(#f4f5f7,#292c32);--q-fg:light-dark(#252930,#eceff2);--q-muted:light-dark(#626b77,#b4bdc8);--q-edge:light-dark(#d9dde2,#444951);--q-work:light-dark(#237862,#77cdb3);--q-ask:light-dark(#a35c29,#edb993);background:var(--q-bg);color:var(--q-fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px;max-width:720px;margin:auto;color-scheme:light dark}
#q-answer-demo *{box-sizing:border-box}#q-answer-demo header{display:flex;align-items:center;gap:12px;padding:2px 0 10px}#q-answer-demo strong{font-weight:500}#q-answer-demo .muted{color:var(--q-muted)}#q-answer-demo .board{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--q-edge)}#q-answer-demo a{color:inherit;text-decoration:none;display:inline-flex;gap:7px;align-items:center}#q-answer-demo a:hover{text-decoration:underline}#q-answer-demo .counts{margin-left:auto;display:flex;gap:14px;font-variant-numeric:tabular-nums}#q-answer-demo .work{color:var(--q-work)}#q-answer-demo .ask{color:var(--q-ask)}#q-answer-demo .bar{display:flex;height:4px;gap:2px;margin:0 0 10px;background:color-mix(in srgb,var(--q-fg) 8%,transparent)}#q-answer-demo .bar span{background:var(--q-work);width:50%}#q-answer-demo .bar i{background:var(--q-ask);width:12.5%}#q-answer-demo summary{padding:5px 0;overflow-wrap:anywhere}#q-answer-demo .question{padding:4px 0 12px}#q-answer-demo p{margin:5px 0 10px}#q-answer-demo .choices{display:flex;flex-wrap:wrap;gap:6px}#q-answer-demo button{font:inherit;color:inherit;border:1px solid var(--q-edge);border-radius:4px;padding:6px 9px;background:transparent;text-align:left}#q-answer-demo button:hover{background:color-mix(in srgb,var(--q-fg) 7%,transparent)}#q-answer-demo button:disabled{opacity:.55}#q-answer-demo form{display:flex;gap:6px;align-items:flex-start;margin-top:8px}#q-answer-demo textarea{font:inherit;color:inherit;background:transparent;border:1px solid var(--q-edge);border-radius:4px;padding:6px 8px;flex:1;min-width:0;resize:vertical}#q-answer-demo .receipt{color:var(--q-work);overflow-wrap:anywhere}#q-answer-demo [hidden]{display:none}#q-answer-demo footer{margin-top:8px;color:var(--q-muted)}@media(pointer:coarse){#q-answer-demo button,#q-answer-demo summary,#q-answer-demo a{min-height:44px}}@media(max-width:390px){#q-answer-demo form{flex-wrap:wrap}#q-answer-demo textarea{flex-basis:100%}}
</style>
<header><strong>Boards</strong><span class="muted">Demo · no submissions</span></header>
<div class="board"><a href="https://github.com/taskqorg/taskq/issues" target="_blank" rel="noopener" aria-label="Open TaskQ board"><i data-lucide="panels-top-left" aria-hidden="true"></i><strong>taskq</strong></a><div class="counts"><span class="work" aria-label="In work: 4">▶ 4</span><span class="ask" data-count aria-label="Your answer: 1">? 1</span><span class="muted" aria-label="Ready: 3">○ 3</span></div></div>
<div class="bar" role="img" aria-label="Queue composition: 4 in work, 1 question, 3 ready; not completion progress"><span></span><i></i></div>
<details open><summary class="cursor-interaction"><span class="ask" data-state>?</span> <span class="muted">#841</span> Keep the old API?</summary>
<div class="question"><p>Should the new admin API keep compatibility with existing clients?</p>
<div data-editor><div class="choices"><button type="button" class="cursor-interaction" data-choice="1" aria-label="Option 1: Keep compatibility, recommended">1. Keep compatibility ★</button><button type="button" class="cursor-interaction" data-choice="2">2. Remove the old API</button></div><form><textarea rows="1" aria-label="Your answer" placeholder="Your answer…"></textarea><button type="submit" class="cursor-interaction" aria-label="Send your answer" disabled>Send</button></form></div>
<div class="receipt" role="status" aria-live="polite" hidden></div>
</div></details>
<div class="board"><a href="https://github.com/taskqorg/agentq/issues" target="_blank" rel="noopener" aria-label="Open AgentQ board"><i data-lucide="panels-top-left" aria-hidden="true"></i><strong>agentq</strong></a><div class="counts"><span class="work" aria-label="In work: 2">▶ 2</span><span class="muted" aria-label="Your answer: 0">? 0</span><span class="muted" aria-label="Ready: 1">○ 1</span></div></div>
<footer>▶ In work · ? Your answer · ○ Ready</footer>
<script>
(()=>{const r=document.getElementById('q-answer-demo'),input=r.querySelector('textarea'),send=r.querySelector('[type=submit]'),receipt=r.querySelector('.receipt'),editor=r.querySelector('[data-editor]');let saved=window.openai?.widgetState?.privateContent;let state={draft:saved?.draft||'',answer:saved?.answer||null,font:16};
function paint(){r.style.fontSize=state.font+'px';input.value=state.draft;send.disabled=!state.draft.trim();editor.hidden=!!state.answer;receipt.hidden=!state.answer;receipt.textContent=state.answer?'✓ Answer recorded (demo): '+state.answer:'';r.querySelector('[data-count]').textContent=state.answer?'? 0':'? 1';r.querySelector('[data-count]').setAttribute('aria-label','Your answer: '+(state.answer?0:1));r.querySelector('[data-state]').textContent=state.answer?'✓':'?';r.querySelector('.bar i').style.visibility=state.answer?'hidden':'visible';}
function save(){window.openai?.setWidgetState({modelContent:{demo:true,answer:state.answer},privateContent:{draft:state.draft,answer:state.answer}})?.catch(()=>{});}
function answer(text){if(state.answer)return;state.answer=text;paint();r.querySelector('summary').focus();save();}
input.addEventListener('input',()=>{state.draft=input.value;send.disabled=!state.draft.trim();save();});send.addEventListener('click',e=>{e.preventDefault();if(state.draft.trim())answer(state.draft.trim());});r.querySelector('form').addEventListener('submit',e=>{e.preventDefault();if(state.draft.trim())answer(state.draft.trim());});r.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.choice==='1'?'1. Keep compatibility':'2. Remove the old API')));paint();
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v){state.draft=v.draft||'';state.answer=v.answer||null;paint();}});
if(globalThis.Tweak){const t=new Tweak({container:r,onChange:paint});t.addSlider(state,'font',{label:'Text size',min:16,max:20,step:2,unit:'px'});}
})();
</script>
</section>
</div>
