<script>

function focusReceipt(r){

// Navigation is view state only: every route consumes the same pushed snapshot.
const routes={home:'Home',projects:'Projects',attention:'Attention',settings:'Settings',appearance:'Appearance',cadence:'Activity history',notifications:'Notifications',agents:'Agents',services:'Services',about:'About'};
const trail=[];
let disclosures=[];
function remember(){return {page,taskFilter,working,workCard,scroll:document.scrollingElement.scrollTop,open:[...menu.querySelectorAll('details')].map(d=>d.open)};}
function navigate(next,filter=null,work=null){
  trail.push(remember());page=next;taskFilter=filter;working=work;workCard=null;ask=null;noted=null;disclosures=[];
  render(true);document.scrollingElement.scrollTop=0;
  menu.querySelector('h1')?.focus();
}
function back(){
  const prior=trail.pop()||{page:'home',taskFilter:null,working:null,workCard:null,scroll:0,open:[]};

  render(true);document.scrollingElement.scrollTop=prior.scroll;
  menu.querySelector('h1')?.focus({preventScroll:true});

function routeButton(route,label=routes[route]){return '<button class="project" data-route="'+route+'">'+esc(label)+'</button>';}
// Task answers: the native bridge owns credentials and canonical dispatch/readback.
const answerRequests=new Map(),answerCards=new Map(),answerFeedback=new Map();

function answerSend(board,op){
  const p=S&&S.projects.find(p=>p.issues===board);

  if(answerRequests.has(key))return answerRequests.get(key).promise;
  let resolve;
  const promise=new Promise(r=>resolve=r);
  const timer=setTimeout(()=>{answerReceipt({root:p.root,id:op.id,state:'unknown',reason:'No bridge receipt received',next:'Check delivery with the same operation'});},30000);

function answerReceipt(r){
  const key=r.root+'#'+r.id,request=answerRequests.get(key);

  setTimeout(fit,0);

// A status refresh that reads the question past an answer op's revision ends Sending: reconcile once with the same op,
// so the CLI returns its first receipt (accepted) or names another writer (stale); the refresh itself never accepts.
// ponytail: fallback actions (#1021) keep Check delivery; their revision fence refuses another revision.
function answerReadback(){
  for(const [key,r] of answerRequests){
    const p=S.projects.find(p=>p.issues===r.board),t=p&&p.complete!==false&&p.tasks.find(t=>t.n===r.op.task);
    if(r.reconciled||r.op.action||!t||(t.state==='ask'&&t.revision===r.op.revision))continue;
    r.reconciled=true;send({a:'answer',root:p.root,board:r.board,op:r.op});
  }
}
function answerSlot(t){return t.state==='ask'?'<div data-answer="'+esc(t.key)+'"></div>':'';}
function answerNotices(){
  return [...answerFeedback].filter(([,r])=>!S.projects.some(p=>p.issues===r.board&&p.tasks.some(t=>t.n===r.op.task&&t.state==='ask'))).map(([key,r])=>'<div class="body" role="status">#'+r.op.task+' · '+esc(r.state)+(r.reason?': '+esc(r.reason):'')+(r.next?' · '+esc(r.next):'')+' <a href="'+esc(r.board+'/'+r.op.task)+'" data-url="'+esc(r.board+'/'+r.op.task)+'">Board ↗</a>'+(r.state==='unknown'?'<button data-a="answer-retry" data-key="'+esc(key)+'">Check delivery</button>':'')+'</div>').join('');
}
function mountAnswers(){
  for(const slot of menu.querySelectorAll('[data-answer]')){
    const t=unique(S.projects.flatMap(tasks)).find(t=>t.key===slot.dataset.answer);
    if(!t)continue;
    let card=answerCards.get(t.key);
    if(!card){const el=document.createElement('div');card={el,ui:TaskqAnswerCard.mount(el,{capability:answerCapability,send:answerSend})};answerCards.set(t.key,card);}
    slot.append(card.el);
    const p=S.projects.find(p=>p.issues+'/'+t.n===t.key);
    card.ui.update([{board:p.issues,row:t}]);
  }
  const keys=new Set(S.projects.flatMap(tasks).map(t=>t.key));
  for(const key of answerCards.keys())if(!keys.has(key))answerCards.delete(key);

// one task per board and issue: `issues` names provider, host and repo (M2)
function tasks(p){return p.tasks.map(t=>({...t,project:p.name,key:p.issues+'/'+t.n,url:t.url||p.issues+'/'+t.n}));}
function blockProject(p){return {id:p.root,name:p.name,board:{url:p.issues,kind:p.board_kind},complete:p.complete===true,closed:p.closed,tasks:tasks(p)};}
function unique(ts){return [...new Map(ts.map(t=>[t.key,t])).values()];}
function counts(ts){ts=unique(ts);const n=f=>ts.filter(t=>f.includes(t.state)).length;return {work:n(['doing','review']),ask:n(['ask']),ready:n(['ready']),failed:n(['failed'])};}

function counter(v,kind,label){return '<span class="counter '+(v>0?kind+' filled':'zero')+'" aria-label="'+esc(label+': '+v)+'" title="'+esc(label)+'">'+v+'</span>';}
// an incomplete or stale snapshot has unknown counts, never zero (§ 4)

function age(s){return s<120?s+' s':s<7200?Math.round(s/60)+' min':s<172800?Math.round(s/3600)+' h':Math.round(s/86400)+' d';}
// service error and stale status.json are not failed tasks (M-A10)
function problem(p){const e=!p.alive?(p.age==null?'no status.json: service not running':'status.json '+age(p.age)+' old: service not running?'):p.error?'service error: '+p.error:'';return e?'<button class="project alert" data-a="log" data-root="'+esc(p.root)+'" title="'+esc(e)+'"'+(p.log?'':' disabled')+'><span>⚠ '+esc(p.name)+': '+esc(e)+'</span><span class="meta">'+(p.log?'Log':'')+'</span><span></span></button>':'';}

function incidentNotice(p){return p.incident_notice?'<details class="group incident-notice"><summary>Incident reports: notice <span class="meta">'+esc(p.name)+'</span></summary><div class="body">Reports stay local until you choose.</div><div class="body meta">Destination: '+esc(p.incident_repo)+' on GitHub (public). Posting account: unknown here; verify the github.com account used by this project before enabling.</div><div class="body meta">Only sanitized fault codes, fingerprint, report ID, release, revision, contract, board/runtime/OS classes, source site and evidence codes are sent. No project, task, user, session, token or raw error text.</div><div class="body meta">Offline or unsupported login: keep a local JSON report. After confirming the destination and posting account, set incident_reports to true in taskq.json to enable, or false to opt out. TASKQ_INCIDENT_REPORTS=off also disables reporting.</div></details>':'';}
function service(p){return '<details class="group service"><summary>⚙ Service <span class="meta">'+esc(p.name)+'</span></summary>'+incident(p)+
  (p.log?'<button class="project" data-a="log" data-root="'+esc(p.root)+'">Open log</button>':'<div class="body meta">Log path unknown</div>')+
  '<button class="project" data-a="folder" data-root="'+esc(p.root)+'">Open folder</button>'+
  '<button class="project" data-a="restart" data-root="'+esc(p.root)+'"'+(p.alive?'':' disabled title="Service not running"')+'>Restart</button>'+
  '<button class="project" data-a="stop" data-root="'+esc(p.root)+'">Stop until next logon</button>'+
  '<details><summary>Uninstall service '+esc(p.name)+'</summary><div class="body meta">Removes this project\'s service; files and other projects stay.</div><button class="project" data-a="uninstall" data-root="'+esc(p.root)+'">Confirm uninstall '+esc(p.name)+'</button></details></details>';}
// bins, range and since come from Rust (the icon draws the same); unknown is never drawn or counted as zero (M6)
function when(t,tz){return new Date(t*1000).toLocaleString([],{timeZone:tz==='UTC'?'UTC':undefined,dateStyle:'short',timeStyle:'short'})+' '+(tz==='UTC'?'UTC':zone);}

function custom(){

  menu.innerHTML=head()+answerNotices()+actionNotices()+(page!=='home'||working||taskFilter?'<button data-a="back">‹ Back</button>':'')+'<h1 tabindex="-1">'+esc(title)+'</h1>'+(S.settings_error?'<div class="body alert" role="alert">Settings unknown: '+esc(S.settings_error)+'; defaults shown</div>':'')+(working?workPage():taskFilter?filteredTasks(p):p?project(p):routeBody())+'<div class="grip" data-resize="" role="button" aria-label="Resize window with arrow keys" tabindex="0"></div><nav class="options footer" aria-label="Menu"><button data-route="home">Home</button><button data-route="settings">Settings</button></nav>';
  mountAnswers();mountResources();
  menu.querySelectorAll('details').forEach((d,i)=>d.open=open[i]??(['cadence','agents','services','attention'].includes(page)));
  if(S.page!==undefined)menu.querySelectorAll('.hist,.agents,.service,.incident-notice').forEach(d=>d.open=true);
  const restored=answerFocus&&menu.querySelector('[data-answer="'+CSS.escape(answerFocus.dataset.answer)+'"] '+answerSelector);
  if(restored&&!navigating){restored.focus({preventScroll:true});if(caret)restored.setSelectionRange(...caret);}
  else if(!navigating){const target=focusedSummary>=0?menu.querySelectorAll('summary')[focusedSummary]:focusKey&&active.tagName==='H1'?menu.querySelector('h1'):focusKey&&focusKey!=='{}'?[...menu.querySelectorAll(active.tagName)].filter(same)[focusAt]:null;target?.focus({preventScroll:true});}
  document.scrollingElement.scrollTop=scroll;
  fit();
  // after fit() sets the width: a new exchange or text size opens at the newest entry; a tick keeps the reader's place;
  // a block that drops a cut line asks for the smaller height
  const bound=[...menu.querySelectorAll('[data-bound]')];
  bound.forEach(c=>{c.scrollTop=bounds.has(c.dataset.bound)?bounds.get(c.dataset.bound):c.classList.contains('aichain')?c.lastElementChild.offsetTop:0;wholeLines(c);});
  if(bound.some(c=>c.style.maxHeight))fit();}
// a bounded block shows whole lines: a line cut at the top scrolls into view, or at the scroll end (the newest text)
// moves out above; the bottom edge moves up to the first line it cuts
function wholeLines(c){
  if(c.scrollHeight<=c.clientHeight)return;
  const top=c.getBoundingClientRect().top+c.clientTop,lines=()=>{const r=document.createRange(),w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT),a=[];
    for(let n;(n=w.nextNode());){r.selectNodeContents(n);a.push(...r.getClientRects());}return a;};
  const shrink=d=>c.style.maxHeight=c.offsetHeight-d+'px',cut=edge=>Math.min(...lines().filter(l=>l.top<edge&&l.bottom>edge).map(l=>l.top));
  const head=cut(top);
  if(head<top&&c.scrollTop+c.clientHeight<c.scrollHeight-1)c.scrollTop-=top-head;
  else if(head<top){const d=Math.min(...lines().filter(l=>l.top>=top).map(l=>l.top))-top;if(d<c.clientHeight){shrink(d);c.scrollTop+=d;}}
  const bottom=top+c.clientHeight,tail=cut(bottom);if(tail>top&&tail<bottom)shrink(bottom-tail);}
// a reader's scroll leaves cut lines: once it settles, the block takes its CSS bound again and realigns on whole lines
function settle(c){if(!c.isConnected)return;const s=c.scrollTop;c.style.maxHeight='';c.scrollTop=s;wholeLines(c);fit();}
menu.addEventListener('scroll',e=>{const c=e.target;if(!c.dataset?.bound)return;clearTimeout(c.settling);c.settling=setTimeout(()=>settle(c),150);},true);
// a refresh between press and release rebuilds the pressed control and its click is lost (U-A4):
// the refresh waits for the release, at most 5 s, then runs after the click
let pressedAt=null,stale=false;
function refresh(now){if(pressedAt!==null&&now-pressedAt<5000){stale=true;return;}render();}
function release(){pressedAt=null;if(stale){stale=false;setTimeout(render);}}
menu.addEventListener('pointerdown',()=>{pressedAt=performance.now();});
for(const event of ['pointerup','pointercancel'])addEventListener(event,release,true);
addEventListener('blur',release);
// Press end.
window.taskq={settle,receive(s){
  if(s.action_error){actionReceipt(s.action_error);return;}
  if(s.focus_receipt){focusReceipt(s.focus_receipt);return;}
  if(s.answerReceipt){answerReceipt(s.answerReceipt);return;}
  if(s.capmsg){resourceReceipt(s.capmsg);return;}
  if(s.open){openCard(s.open);return;}
  S=s;focusReadback();answerReadback();
  if(aiText===null)aiText=s.ai.draft||'';
  // snapshot mode names the page
  if(s.page!==undefined&&s.page!==page){page=s.page;taskFilter=null;working=null;workCard=null;trail.length=0;disclosures=[];render(true);return;}
  // a tick does not take the caret out of the range fields
  if(document.activeElement&&(document.activeElement.dataset.draft||document.activeElement.dataset.rscField||document.activeElement.id==='ai'))return;
  refresh(performance.now());
},model:{unique,counts,mode,resourceSet}};
menu.addEventListener('click',e=>{
  const cardLink=e.target.closest('.qac a');if(cardLink){e.preventDefault();send({a:'open',url:cardLink.getAttribute('href')});return;}
  if(e.target.closest('.qac,.rsc'))return;
  if(TaskqProjectBlocks.handle(e,{open:url=>send({a:'open',url}),project:id=>navigate(id),tasks:(id,state)=>navigate(id||'home',state)}))return;
  const a=e.target.closest('a[data-url]');if(a){e.preventDefault();send({a:'open',url:a.dataset.url});return;}
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.route){if(d.route!==page||working||taskFilter)navigate(d.route);return;}
  if(d.a==='answer-retry'){const r=answerFeedback.get(d.key);if(r)answerSend(r.board,r.op);render();return;}
  if(d.a==='notify'||d.a==='notify-test'){send({a:d.a,kind:d.kind,value:d.v,root:d.root});return;}
  if(d.a==='work'){navigate(page,null,d.root?{[d.root]:true}:{});return;}
  if(d.a==='back'){back();return;}
  if(d.set==='period'&&d.v==='custom'){const H=S.history;draft={start:local(H.start,H.tz),end:local(H.end,H.tz),tz:H.tz,error:''};render();return;}
  if(d.set){S[d.set]=d.set==='font'?Number(d.v):d.v;if(d.set==='period')draft=null;send({a:'set',[d.set]:S[d.set]});render();return;}
  if(d.a==='range'){
    const t=v=>v?Date.parse(draft.tz==='UTC'?v+'Z':v)/1000:NaN,a=t(draft.start),z=t(draft.end);
    draft.error=!(a<z)?'Refused: start must be before end.':'';
    if(!draft.error){S.period='custom';send({a:'set',period:'custom',start:a,end:z,tz:draft.tz});draft=null;}
    render();return;}
  if(d.a==='ai-menu'){aiMenu=!aiMenu;render();return;}
  // picking fills the input, never sends (M-A13)
  if(d.a==='ai-pick'){aiText=d.v;aiMenu=false;send({a:'ai-draft',text:aiText});render();const t=document.getElementById('ai');t.focus();t.setSelectionRange(t.value.length,t.value.length);return;}
  if(d.a==='ai-next'){send({a:'ai-send',text:d.v,after:S.ai.request.id});render();return;}
  if(d.a==='ai-send'){const r=S.ai.request,an=r&&r.answer||{};if(!aiText.trim())return;send({a:'ai-send',text:aiText,after:an.state==='clarify'?r.id:''});aiText='';render();return;}
  if(d.a==='ai-confirm'){aiConfirm=d.id+'/'+d.rev;send({a:'ai-confirm',root:d.root,id:d.id,rev:Number(d.rev)});render();return;}
  if(d.a==='ai-clear'){send({a:'ai-clear'});return;}
  if(d.a==='add-ask'||d.a==='add-back'){addConfirm=d.a==='add-ask';render();return;}
  if(d.a==='add-install'||d.a==='add-cancel')addConfirm=false;
  // the pressed button is replaced: focus Cancel in the question, or the command again after it (U-A8)
  if(d.a==='confirm'||d.a==='cancel'){confirming=d.a==='confirm';render();menu.querySelector(confirming?'[data-a="cancel"]':'[data-a="confirm"]')?.focus();return;}
  if(d.a==='update'){updating={v:d.v,at:S.now};}
  if(d.a==='pick'){ask=d.root;render();return;}
  if(d.a==='pause-all'||d.a==='resume-all'){confirming=null;for(const p of S.projects.filter(p=>mode(p)===(d.a==='pause-all'?'run':'paused')))focusStart(d.a.slice(0,-4),p.root);render();menu.querySelector('[data-a="confirm"]')?.focus();return;}
  if(d.a==='pause'||d.a==='resume'||d.a==='focus'){focusStart(d.a,d.root,d.label);ask=null;render();return;}
  if(d.a){actionErrors.delete(d.root);send({a:d.a,root:d.root,label:d.label});}render();});
menu.addEventListener('input',e=>{if(e.target.id==='ai'){aiText=e.target.value;send({a:'ai-draft',text:aiText});return;}const k=e.target.dataset.draft;if(k&&draft)draft[k]=e.target.value;});
menu.addEventListener('focusout',e=>{const f=x=>x&&(x.id==='ai'||x.dataset&&(x.dataset.draft||x.dataset.rscField));if(f(e.target))setTimeout(()=>{if(!f(document.activeElement))render();});});
menu.addEventListener('mousedown',e=>{if(S&&e.button===0&&e.target.closest('.head')&&!e.target.closest('button'))send({a:'drag'});});
let resizing=null;
menu.addEventListener('pointerdown',e=>{if(e.button!==0||!e.target.closest('.grip'))return;resizing={x:e.screenX,y:e.screenY,w:innerWidth,h:innerHeight};e.target.setPointerCapture(e.pointerId);e.preventDefault();});
menu.addEventListener('pointermove',e=>{if(!resizing)return;manualSize=[Math.max(240,resizing.w+e.screenX-resizing.x),Math.max(120,resizing.h+e.screenY-resizing.y)];menu.style.width='100%';send({a:'resize',d:devicePixelRatio,w:manualSize[0],h:manualSize[1]});});
for(const event of ['pointerup','pointercancel','lostpointercapture'])menu.addEventListener(event,()=>{if(resizing)send({a:'resize-end'});resizing=null;});
menu.addEventListener('keydown',e=>{if(!e.target.closest('.grip')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();manualSize=[Math.max(240,innerWidth+(e.key==='ArrowRight'?10:e.key==='ArrowLeft'?-10:0)),Math.max(120,innerHeight+(e.key==='ArrowDown'?10:e.key==='ArrowUp'?-10:0))];send({a:'resize',d:devicePixelRatio,w:manualSize[0],h:manualSize[1]});send({a:'resize-end'});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')send({a:'hide'});});
menu.addEventListener('toggle',()=>fit(),true);
document.fonts.ready.then(()=>{if(S)fit();});
send({a:'ready'});
})();
</script></body></html>
